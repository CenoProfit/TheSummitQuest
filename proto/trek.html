/* ===================================================================
   MUSIC

   Written rather than recorded, for the same reason everything else
   here is: a loop long enough not to notice is a file too big to ship,
   and a short one is worse than silence by the third mile.

   D dorian, which is the mode most walking music lands in: minor
   enough to have weather in it, with a major sixth that keeps it from
   turning into a lament. The vamp is i - VII - IV - i, open fifths in
   the bass and no third underneath, so it reads as country rather than
   as a chord chart.

   Two modes. The walk is a pad, a low fifth, a plucked eighth note
   figure and a shaker; a phrase wanders over the top every other bar
   and the phrase is picked from the mile you are on, so it keeps
   moving without ever repeating on a schedule you can hear. A fight
   drops the pad, doubles the pulse, puts the flattened second in the
   bass and hits two and four.
   =================================================================== */
const MKEY='sq_trek_music';
let musOn=true;
try{ musOn=(localStorage.getItem(MKEY)||'on')==='on'; }catch(e){}
let AC=null,mBus=null,mLP=null,mWet=null,mWalk=null,mFight=null;
let mTimer=null,mNext=0,mBar=0,mMode='walk';
const MLEVEL=0.21;
function actx(){
 try{ return AC=AC||new (window.AudioContext||window.webkitAudioContext)(); }
 catch(e){ return null; }
}
/* a cheap impulse response: noise under an exponential decay */
function makeIR(ac,sec,decay){
 const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,n,ac.sampleRate);
 for(let c=0;c<2;c++){ const d=b.getChannelData(c);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); }
 return b;
}
function musInit(){
 const ac=actx(); if(!ac||mBus) return ac;
 mBus=ac.createGain(); mBus.gain.value=musOn?MLEVEL:0.0001;
 mLP=ac.createBiquadFilter(); mLP.type='lowpass'; mLP.frequency.value=2400;
 const rv=ac.createConvolver(); rv.buffer=makeIR(ac,2.6,2.2);
 mWet=ac.createGain(); mWet.gain.value=0.42;
 mBus.connect(mLP); mLP.connect(ac.destination);
 mLP.connect(mWet); mWet.connect(rv); rv.connect(ac.destination);
 mWalk=ac.createGain(); mWalk.gain.value=1; mWalk.connect(mBus);
 mFight=ac.createGain(); mFight.gain.value=0; mFight.connect(mBus);
 return ac;
}
const MROOT=146.83;                       /* D3 */
const MSC=[0,2,3,5,7,9,10];               /* dorian */
function mf(deg,oct){
 const i=((deg%7)+7)%7, o=(oct||0)+Math.floor(deg/7);
 return MROOT*Math.pow(2,(MSC[i]+12*o)/12);
}
function mvoice(ac,to,type,f,t,len,vel,cut,det){
 const o=ac.createOscillator(), g=ac.createGain();
 o.type=type; o.frequency.value=f; if(det) o.detune.value=det;
 let tail=g;
 if(cut){ const lp=ac.createBiquadFilter(); lp.type='lowpass';
          lp.frequency.value=cut; lp.Q.value=0.7;
          o.connect(lp); lp.connect(g); }
 else o.connect(g);
 g.connect(to);
 g.gain.setValueAtTime(0.0001,t);
 g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vel),t+Math.min(0.09,len*0.18));
 g.gain.exponentialRampToValueAtTime(0.0001,t+len);
 o.start(t); o.stop(t+len+0.04);
 return tail;
}
function mpad(ac,to,f,t,len,vel){
 for(const d of [-6,6]){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.value=f; o.detune.value=d;
  o.connect(g); g.connect(to);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vel,t+len*0.35);
  g.gain.setValueAtTime(vel,t+len*0.62);
  g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.start(t); o.stop(t+len+0.05);
 }
}
let MNOISE=null;
function mperc(ac,to,t,vel,hi,len){
 if(!MNOISE){
  const n=Math.floor(ac.sampleRate*0.5);
  MNOISE=ac.createBuffer(1,n,ac.sampleRate);
  const d=MNOISE.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
 }
 const sN=ac.createBufferSource(); sN.buffer=MNOISE; sN.loop=true;
 const bp=ac.createBiquadFilter(); bp.type='bandpass';
 bp.frequency.value=hi; bp.Q.value=1.1;
 const g=ac.createGain();
 sN.connect(bp); bp.connect(g); g.connect(to);
 g.gain.setValueAtTime(0.0001,t);
 g.gain.exponentialRampToValueAtTime(vel,t+0.004);
 g.gain.exponentialRampToValueAtTime(0.0001,t+len);
 sN.start(t); sN.stop(t+len+0.02);
}
const MPROG=[0,6,3,0];                    /* i  VII  IV  i */
function walkBar(ac,t){
 const beat=0.52, bar=beat*4, k=mBar%4, r=MPROG[k];
 const to=mWalk;
 /* the fifth underneath, no third: it is a drone, not a chord */
 mvoice(ac,to,'triangle',mf(r,-1),t,bar*0.98,0.17,420);
 mvoice(ac,to,'sine',mf(r+4,-1),t,bar*0.98,0.085,380);
 /* the pad */
 for(const d of [r,r+2,r+4]) mpad(ac,to,mf(d,0),t,bar*1.02,0.040);
 /* the eighth note figure, which is the walking in it */
 const fig=[0,2,4,2,5,4,2,0];
 for(let i=0;i<8;i++){
  const n=r+fig[i];
  mvoice(ac,to,'triangle',mf(n,1),t+i*beat*0.5,0.34,
         i%2?0.055:0.082,1700,(i%3)*3-3);
 }
 /* shaker on the offbeats, a soft thump on one */
 for(let i=0;i<8;i++) if(i%2) mperc(ac,to,t+i*beat*0.5,0.022,5200,0.055);
 mperc(ac,to,t,0.055,120,0.16);
 if(k===2) mperc(ac,to,t+beat*2,0.040,140,0.14);
 /* a phrase over the top every other bar, chosen by where you are */
 if(k%2===1){
  const seed=((miles()*7)|0)+mBar*3;
  const SHAPE=[[0,2,4,7],[7,4,2,0],[0,4,2,5],[4,5,7,4],[2,4,5,7],[7,5,4,2]];
  const sh=SHAPE[seed%SHAPE.length];
  for(let i=0;i<sh.length;i++)
   mvoice(ac,to,'sine',mf(r+sh[i],1),t+beat*(1.0+i*0.5),0.46,0.055,2600);
 }
 return bar;
}
function fightBar(ac,t){
 const beat=0.40, bar=beat*4, k=mBar%4;
 const to=mFight;
 const r=[0,0,1,6][k];                    /* the flat second on three */
 mvoice(ac,to,'sawtooth',mf(r,-1),t,bar*0.98,0.085,260);
 for(let i=0;i<8;i++)
  mvoice(ac,to,'square',mf(r,0),t+i*beat*0.5,0.16,i%2?0.028:0.050,900);
 mvoice(ac,to,'triangle',mf(r+4,0),t,bar*0.5,0.055,1200);
 mvoice(ac,to,'triangle',mf(r+2,0),t+bar*0.5,bar*0.45,0.050,1200);
 mperc(ac,to,t,0.075,110,0.17);
 mperc(ac,to,t+beat,0.070,1900,0.10);
 mperc(ac,to,t+beat*2,0.060,110,0.15);
 mperc(ac,to,t+beat*3,0.075,1900,0.11);
 return bar;
}
function musMode(m){
 if(mMode===m) return;
 mMode=m;
 if(!mBus||!AC) return;
 const t=AC.currentTime;
 for(const [n,v] of [[mWalk,m==='walk'?1:0],[mFight,m==='fight'?1:0]]){
  n.gain.cancelScheduledValues(t);
  n.gain.setValueAtTime(n.gain.value,t);
  n.gain.linearRampToValueAtTime(v,t+(v?0.30:0.55));
 }
 mLP.frequency.cancelScheduledValues(t);
 mLP.frequency.setTargetAtTime(m==='fight'?3600:2400,t,0.3);
 mWet.gain.cancelScheduledValues(t);
 mWet.gain.setTargetAtTime(m==='fight'?0.16:0.42,t,0.3);
}
function schedBar(){
 const ac=actx(); if(!ac) return;
 const len=mMode==='fight'?fightBar(ac,mNext):walkBar(ac,mNext);
 mNext+=len; mBar++;
 mTimer=setTimeout(schedBar,Math.max(40,(mNext-ac.currentTime-0.45)*1000));
}
function musBegin(ac){
 if(mTimer) return;
 mBus.gain.cancelScheduledValues(ac.currentTime);
 mBus.gain.setValueAtTime(Math.max(0.0001,mBus.gain.value),ac.currentTime);
 mBus.gain.exponentialRampToValueAtTime(MLEVEL,ac.currentTime+2.0);
 mNext=ac.currentTime+0.3; schedBar();
}
/* resume() is asynchronous: the state is still suspended when it
   returns, so one gesture only works if you wait on the promise */
function musStart(){
 if(!musOn||mTimer) return;
 const ac=musInit(); if(!ac) return;
 if(ac.state==='running'){ musBegin(ac); return; }
 const p=ac.resume();
 if(p&&p.then) p.then(()=>{ if(ac.state==='running') musBegin(ac); }).catch(()=>{});
}
function musStop(){
 clearTimeout(mTimer); mTimer=null;
 if(!mBus||!AC) return;
 mBus.gain.cancelScheduledValues(AC.currentTime);
 mBus.gain.setValueAtTime(Math.max(0.0001,mBus.gain.value),AC.currentTime);
 mBus.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+1.2);
}
function setMus(on){
 musOn=on;
 try{ localStorage.setItem(MKEY,on?'on':'off'); }catch(e){}
 const b=document.getElementById('musbtn');
 if(b){ b.classList.toggle('off',!on); b.textContent=on?'♪':'♪̸'; }
 on?musStart():musStop();
}
document.getElementById('musbtn').onclick=()=>setMus(!musOn);
setMus(musOn);
/* iOS will not start audio without a gesture, so the first touch
   anywhere is the one that does it */
for(const ev of ['pointerdown','keydown'])
 addEventListener(ev,function once(){
  removeEventListener(ev,once); musStart();
  /* iOS refuses motion without a gesture, so the load time attempt
     fails there; this is the first chance to ask properly */
  if(!PED.live&&!hostFn()) startMotion();
 },{passive:true});

/* ---------- loop ---------- */
let last=performance.now();
let _errs=0;
function frame(now){
 const dt=Math.min(60,now-last); last=now;
 if(mBus) musMode(S.fight?'fight':'walk');
 encWatch(); chestWatch(); nextBar();
 try{ step(dt,now); paint(now,dt); bannerTick(now); toastTick(now);
      /* whatever is left of the frame goes into baking what is coming */
      bakeBudget(Math.max(2,9-(performance.now()-now))); }
 catch(e){ if(_errs++<3) console.error('frame',e); }
 requestAnimationFrame(frame);
}

/* ===================================================================
   THE PACK — what the chests are for

   A chest that hands you a thing you cannot look at again is a slot
   machine. This is the other half: everything you have found, what is
   still missing, and the five slots that decide who walks the trail.
   =================================================================== */
const CATS=[['all','ALL'],['sword','SWORDS'],['staff','STAFFS'],['shield','SHIELDS'],
            ['helm','HELMS'],['chest','ARMOR'],['shoes','BOOTS'],['pet','PETS']];
let pcat='all', psel=null;
const CELL=()=>innerWidth<430?46:64;
const pack=document.getElementById('pack');

function owned(id){return (S.own&&S.own[id])|0;}
function grant(g){
 if(!S.own) S.own={};
 const was=owned(g.id); S.own[g.id]=was+1;
 /* the duplicate is left at the cairn on the spot, so a repeat find is
    never nothing and never a chore in a menu afterwards */
 if(was) S.stones=stones()+STONE_Y[g[2]];
 /* A new piece goes straight on if the slot is empty or if it outranks
    what is already there, so the reward shows up without a trip through
    a menu. It never quietly takes a legendary off you. */
 if(!was){
  if(!S.eq) S.eq={};
  const sl=CAT2SLOT[g[1]], cur=S.eq[sl]?BYID[S.eq[sl]]:null;
  if(!cur||g[2]>cur[2]){S.eq[sl]=g.id; wizApply();}
 }
 save(); return !was;
}
/* Claiming is the one place in the game where you choose what you get. */
function claim(g){
 const cost=STONE_C[g[2]];
 if(owned(g.id)||stones()<cost) return;
 S.stones=stones()-cost;
 if(!S.own) S.own={}; S.own[g.id]=1;
 if(!S.eq) S.eq={};
 const sl=CAT2SLOT[g[1]], cur=S.eq[sl]?BYID[S.eq[sl]]:null;
 if(!cur||g[2]>cur[2]){S.eq[sl]=g.id; wizApply();}
 save(); psel=g; drawPack();
}
function equip(g){
 if(!owned(g.id)) return;
 if(!S.eq) S.eq={};
 const sl=CAT2SLOT[g[1]];
 S.eq[sl]=(S.eq[sl]===g.id)?null:g.id;
 wizApply(); save(); drawPack();
}

const DPR=()=>Math.min(2,window.devicePixelRatio||1);
/* size is in CSS pixels; the backing store is a whole multiple of it so
   that a sprite shown at or above its own size lands on exact pixels */
function iconCell(g,size){
 const d=DPR(), n=Math.round(size*d);
 const c=document.createElement('canvas');
 c.width=n; c.height=n; c.style.width=size+'px'; c.style.height=size+'px';
 blitGear(c.getContext('2d'),g,false,0,0,n);
 return c;
}
function drawSlots(){
 const L=document.getElementById('pleft'); L.innerHTML='';
 for(const sl of SLOTS){
  const id=S.eq&&S.eq[sl], g=id?BYID[id]:null;
  const d=document.createElement('div');
  d.className='pslot'+(g?' on':'');
  const box=document.createElement('div');
  box.style.cssText='width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center';
  if(g) box.appendChild(iconCell(g,30));
  else box.innerHTML='<span style="color:#32425a;font-size:15px">\u00b7</span>';
  const t=document.createElement('div'); t.className='pslotxt';
  t.innerHTML='<b>'+SLOTNAME[sl]+'</b><span style="color:'+(g?RAR[g[2]][1]:'#45566e')+'">'
             +(g?g[0]:'empty')+'</span>';
  d.appendChild(box); d.appendChild(t);
  d.onclick=()=>{ if(g){psel=g; drawPack();} };
  L.appendChild(d);
 }
 /* Bare headed and empty handed, for anyone who would rather see the
    wanderer than the wizard. The hat and the walking staff are what he
    wears when a slot is empty, so without this there is no way to have
    neither. */
 const pl=document.createElement('div');
 pl.className='pslot plainrow'+(S.plain?' on':'');
 pl.innerHTML='<div style="width:30px;flex:0 0 30px;text-align:center;color:'
  +(S.plain?'#f0c14b':'#45566e')+';font-size:15px">'+(S.plain?'\u25c9':'\u25cb')
  +'</div><div class="pslotxt"><b>PLAIN DRESS</b><span style="color:'
  +(S.plain?'#f0c14b':'#45566e')+'">'
  +(S.plain?'bare headed, empty handed':'his hat and walking staff')
  +'</span></div>';
 pl.onclick=()=>{ S.plain=!S.plain; wizApply(); save(); drawPack(); };
 L.appendChild(pl);
 drawDoll();
}
/* the paper doll is the same composite that walks the trail, so what
   you see here is literally what is out there */
function drawDoll(){
 const c=document.getElementById('doll'); if(!c) return;
 AURAK=0.52;
 try{ _drawDoll(c); } finally { AURAK=1; }
}
function _drawDoll(c){
 const box=c.parentElement.getBoundingClientRect();
 const H=Math.max(96,Math.min(144,Math.round((box.height||150)-26)));
 const d=DPR(), n=Math.round(H*d);
 c.width=n; c.height=n; c.style.width=H+'px'; c.style.height=H+'px';
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const eq=S.eq||{};
 const off=eq.off&&BYID[eq.off]?BYID[eq.off]:null;
 const hand=eq.hand&&BYID[eq.hand]?BYID[eq.hand]:null;
 const SP=n*0.62, X0=Math.round(n*0.08), Y0=Math.round(n*0.20);
 const hdq=S.eq&&S.eq.head&&BYID[S.eq.head]?BYID[S.eq.head]:null;
 if(hdq&&auraOf(hdq))
  drawHalo(q,hdq,X0+SP*HEAD_A[0],Y0+SP*HEAD_A[1],SP*0.30,performance.now());
 /* heroCanvas leaves the off arm out whenever something is in that
    hand, because the hand has to close ON the strap and that is a
    separate layer. The doll wielded the shield and then never drew
    layer 24, so the shield floated with no arm behind it. */
 const sleeve=eq.body&&BYID[eq.body]?BYID[eq.body]:HERO_PAL;
 const gripOn=i=>q.drawImage(heroLayer(i,sleeve),X0,Y0,SP,SP);
 if(off){
  if(auraOf(off)) drawAura(q,off,SHIELD_A,X0,Y0,SP,1,performance.now());
  wield(q,off,SHIELD_A,X0,Y0,SP,1);
  gripOn(24);
 }
 if(hand){
  if(auraOf(hand)) drawAura(q,hand,WEAPON_A,X0,Y0,SP,1,performance.now());
  wield(q,hand,WEAPON_A,X0,Y0,SP,1);
  gripOn(23);
 }
 const ftq=eq.feet&&BYID[eq.feet]?BYID[eq.feet]:null;
 if(ftq&&auraOf(ftq)) bootFX(q,ftq,X0,Y0,SP,performance.now(),0,1,0);
 q.drawImage(heroCanvas(0),X0,Y0,SP,SP);
 const bdq=eq.body&&BYID[eq.body]?BYID[eq.body]:null;
 if(bdq&&auraOf(bdq)) bodyGlow(q,bdq,X0,Y0,SP,performance.now());
 if(ftq&&auraOf(ftq)) bootFX(q,ftq,X0,Y0,SP,performance.now(),0,1,1);
}
function drawTabs(){
 const T=document.getElementById('ptabs'); T.innerHTML='';
 for(const [k,label] of CATS){
  const b=document.createElement('div');
  b.className='ptab'+(k===pcat?' on':''); b.textContent=label;
  b.onclick=()=>{pcat=k; drawPack();};
  T.appendChild(b);
 }
}
function drawGrid(){
 const G=document.getElementById('pgrid'); G.innerHTML='';
 const list=GEAR.filter(g=>pcat==='all'||g[1]===pcat)
   .sort((a,b)=>CATS.findIndex(c=>c[0]===a[1])-CATS.findIndex(c=>c[0]===b[1])||a[2]-b[2]);
 for(const g of list){
  const n=owned(g.id), has=n>0;
  const d=document.createElement('div');
  d.className='cell'+(has?'':' locked')+((S.eq&&S.eq[CAT2SLOT[g[1]]]===g.id)?' eq':'');
  if(has) d.style.borderColor=RAR[g[2]][1];
  const au=has?auraOf(g):null;
  if(au){ d.classList.add('burning');
   const C=AURA[au].c[2];
   d.style.setProperty('--au',C[0]+','+C[1]+','+C[2]); }
  d.appendChild(iconCell(g,CELL()));
  if(n>1){const s=document.createElement('span'); s.className='dup'; s.textContent='x'+n; d.appendChild(s);}
  if(psel&&psel.id===g.id) d.classList.add('sel');
  d.onclick=()=>{psel=g; drawPack();};
  d.ondblclick=()=>{if(has) equip(g);};
  G.appendChild(d);
 }
}
/* The journal. Every place you have reached, what it was, and what came
   out of the ground there. Newest at the top, because the thing you want
   when you open this is the place you were standing an hour ago. */
function drawJournal(){
 const G=document.getElementById('jlist'); G.innerHTML='';
 const log=(S.log||[]).slice().sort((a,b)=>a.m-b.m);
 const places=log.filter(e=>!e.f&&!e.e).length, kills=log.filter(e=>e.f&&e.won).length;
 const met=log.filter(e=>e.e).length;
 document.getElementById('jcount').textContent=
  places+' / '+TRAIL.length+(kills?'  \u2620 '+kills:'');
 const far=log.length?Math.max.apply(null,log.map(e=>e.m)):0;
 const hi=log.filter(e=>!e.f&&!e.e).map(e=>TRAIL.find(t=>t.m===e.m))
             .filter(L=>L&&L.e).sort((a,b)=>b.e-a.e)[0];
 document.getElementById('jsum').innerHTML=
  log.length
   ? ('Furthest point mile '+far.toFixed(1)+', '+pctEnd(far)
      +' percent of the way to '+TR.endn+'.'
      +(hi?' Highest ground so far is '+hi.n+' at '+hi.e.toLocaleString()+' feet.':'')
      +(kills?' '+kills+(kills===1?' thing':' things')+' put down on the way.':'')
      +(met?' '+met+' met and let be.':''))
   : 'Every place you reach is written down here, with the day you got there '
     +'and what came out of the ground.';
 if(!log.length){
  const e=document.createElement('div'); e.className='jempty';
  e.textContent='Nothing written here yet. The journal fills itself in as you reach places.';
  G.appendChild(e); return;
 }
 for(let x=log.length-1;x>=0;x--){
  const en=log[x];
  if(en.e){                                   /* something you met */
   const E=ENC[en.k];
   const d=document.createElement('div'); d.className='jrow jmet';
   let h='<div class="jhead"><span class="jn" style="color:#9fd8ff">'+E.n+'</span>';
   if(en.day) h+='<span class="jd">DAY '+en.day+'</span>';
   h+='</div><div class="jm">MILE '+en.m.toFixed(1)+'</div>'
     +'<div class="jw">'+E.w+'</div>'
     +'<div class="jg">\u25b2 '+en.st+' STONES</div>';
   d.innerHTML=h; G.appendChild(d); continue;
  }
  if(en.f){                                   /* a fight, not a place */
   const B=BOSS[en.b], g=en.i?BYID[en.i]:null;
   const d=document.createElement('div');
   d.className='jrow'+(en.won?' jwon':' jlost');
   let h='<div class="jhead"><span class="jn" style="color:'
        +(en.won?'#ffb49a':'#8695a8')+'">'+B.n+'</span>';
   if(en.day) h+='<span class="jd">DAY '+en.day+'</span>';
   h+='</div><div class="jm">MILE '+en.m.toFixed(1)+' &middot; '
     +(en.won?'KILLED':'GOT AWAY')+' &middot; '
     +Math.round(en.steps||0).toLocaleString()+' STEPS</div>';
   h+='<div class="jw">'+(en.won?B.w:'It got away. Your steps still counted.')
     +'</div>';
   if(en.won) h+='<div class="jg">'
     +(g?'TOOK &middot; <b style="color:'+RAR[g[2]][1]+'">'+g[0].toUpperCase()+'</b>'
        :'CARRIED NOTHING')
     +(en.st?' &middot; \u25b2 '+en.st+' STONES':'')+'</div>';
   d.innerHTML=h; G.appendChild(d); continue;
  }
  const L=TRAIL.find(t=>t.m===en.m); if(!L) continue;
  const g=en.i?BYID[en.i]:null;
  const d=document.createElement('div'); d.className='jrow';
  let h='<div class="jhead"><span class="jn">'+L.n+'</span>';
  if(en.day) h+='<span class="jd">DAY '+en.day+'</span>';
  h+='</div><div class="jm">MILE '+L.m.toFixed(1)
    +(L.e?' &middot; '+L.e.toLocaleString()+' FT':'')
    +' &middot; '+pctEnd(L.m)+'% TO '+TR.end+'</div>';
  if(L.w) h+='<div class="jw">'+L.w+'</div>';
  if(g) h+='<div class="jg">FOUND &middot; <b style="color:'+RAR[g[2]][1]+'">'
          +g[0].toUpperCase()+'</b></div>';
  d.innerHTML=h; G.appendChild(d);
 }
}
let DART=null;
function paintDart(){
 if(!DART) return;
 const q=DART.c.getContext('2d'), px=DART.px, g=DART.g;
 q.clearRect(0,0,px,px);
 const A=auraOf(g);
 /* the showcase holds the piece a little smaller so the flame has room */
 const s=A?0.80:1.0, o=Math.round(px*(1-s)/2);
 /* The piece fills its box here rather than sitting in a hand, so the
    carry offset is null. Passing carryOf's offset (which is what the
    old code did by leaving it to default) put a sword's flame up and
    to the right of the sword. */
 if(A&&g[1]==='helm') drawHalo(q,g,px*0.5,px*0.44,px*0.38,performance.now());
 else if(A) drawAura(q,g,[0.5,0.5],o,o,px*s,1.0,performance.now(),[0,0,1]);
 blitGear(q,g,false,o,o,Math.round(px*s));
}
/* ---------- what a piece is worth ----------
   No item carries a hand written stat line and none of them needs one.
   Four numbers fall out of what the table already says: the category
   decides the SHAPE of the profile, so a sword leans on attack and a
   staff on magic; the rarity decides how much there is to spread; the
   materials bend it, so an ember blade reads hotter than an iron one;
   and a hash of the name adds a small wobble so two rare swords are not
   twins. 115 items, four stats each, no new data.

   These do not make you walk further. They decide how a fight on the
   trail goes, and nothing else. */
const STATS=['atk','def','spd','mag'];
const STATNAME={atk:'ATK',def:'DEF',spd:'SPD',mag:'MAG'};
const STATFULL={atk:'ATTACK',def:'DEFENSE',spd:'SPEED',mag:'MAGIC'};
const STATCOL={atk:'#f0795a',def:'#5aa9f0',spd:'#74e84f',mag:'#b978f0'};
const CATPROF={sword:[.55,.15,.20,.10], staff:[.20,.10,.15,.55],
               shield:[.05,.65,.10,.20], helm:[.10,.45,.15,.30],
               chest:[.10,.60,.10,.20],  shoes:[.05,.20,.65,.10],
               pet:[.25,.20,.25,.30]};
const RARPOOL=[12,20,30,44,62];      /* points to spread, by rarity */
const MATBIAS={
 iron:[.45,.40,.10,.05], steel:[.48,.37,.10,.05], bronze:[.40,.38,.14,.08],
 copper:[.36,.34,.16,.14], metal:[.42,.40,.10,.08], mithril:[.30,.30,.18,.22],
 stone:[.26,.56,.06,.12], obsid:[.50,.22,.12,.16], gold:[.18,.30,.10,.42],
 silver:[.20,.26,.16,.38], ivory:[.22,.26,.26,.26], bone:[.28,.22,.28,.22],
 ash:[.24,.18,.34,.24],   jade:[.14,.34,.16,.36],  moss:[.10,.36,.18,.36],
 ember:[.34,.10,.14,.42], frost:[.20,.22,.12,.46], storm:[.24,.10,.26,.40],
 venom:[.30,.08,.26,.36], sun:[.22,.18,.14,.46],   dusk:[.22,.14,.24,.40],
 void:[.26,.12,.16,.46],  arcane:[.12,.12,.16,.60],sea:[.16,.20,.22,.42],
 wood:[.26,.20,.38,.16],  cloth:[.08,.20,.40,.32], leather:[.16,.26,.44,.14],
 fur:[.14,.30,.38,.18],   feather:[.12,.10,.62,.16],skin:[.18,.18,.46,.18],
 scale:[.20,.42,.26,.12]};
const _SCACHE={};
function statsOf(g){
 if(_SCACHE[g.id]) return _SCACHE[g.id];
 const prof=CATPROF[g[1]]||[.25,.25,.25,.25];
 let bias=[0,0,0,0], bw=0;
 const add=(m,w)=>{const b=MATBIAS[m]; if(!b) return;
                    for(let i=0;i<4;i++) bias[i]+=b[i]*w; bw+=w;};
 add(g[4],3); add(g[5],1); add(g[6],1); add(g[7],1);
 if(bw) for(let i=0;i<4;i++) bias[i]/=bw;
 let h=2166136261>>>0;
 for(let i=0;i<g[0].length;i++){ h^=g[0].charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
 const mix=[];
 for(let i=0;i<4;i++){
  h=(Math.imul(h,1103515245)+12345)>>>0;
  const w=0.86+((h>>>16)%1000)/1000*0.28;
  mix.push(Math.max(0.02,(prof[i]*0.70+bias[i]*0.30)*w));
 }
 const sum=mix.reduce((a,b)=>a+b,0), pool=RARPOOL[g[2]];
 const o={total:0};
 for(let i=0;i<4;i++){ const v=Math.max(1,Math.round(pool*mix[i]/sum));
                       o[STATS[i]]=v; o.total+=v; }
 return _SCACHE[g.id]=o;
}
/* everything you are wearing, added up */
function loadout(){
 const t={atk:BASE.atk,def:BASE.def,spd:BASE.spd,mag:BASE.mag,total:0};
 for(const sl of SLOTS){
  const id=S.eq&&S.eq[sl], g=id?BYID[id]:null; if(!g) continue;
  const st=statsOf(g);
  for(const k of STATS) t[k]+=st[k];
  t.total+=st.total;
 }
 return t;
}
const MATNAME={metal:'forged',wood:'turned wood',leather:'oiled leather',
 cloth:'woven cloth',stone:'cut stone',bone:'bone',arcane:'something else',
 fur:'',feather:'',scale:'',skin:''};
function drawDetail(){
 const D=document.getElementById('pdetail');
 D.innerHTML='';
 if(!psel){D.innerHTML='<div class="dtxt">Nothing here walks for you. '
  +'What you wear decides how a fight on the trail goes, and nothing else.'
  +'<span style="display:block;margin-top:7px;color:#5c6a7c">'
  +'A piece you already own is left at the cairn for stones. Stones claim '
  +'something you have never found.</span></div>'; return;}
 const g=psel, has=owned(g.id), R=RAR[g[2]], n=owned(g.id);
 const art=document.createElement('div'); art.className='dart';
 if(has){
  const d=DPR(), px=Math.round(128*d);
  const c=document.createElement('canvas');
  c.width=px; c.height=px; c.style.width='128px'; c.style.height='128px';
  c.style.imageRendering='pixelated';
  DART={c:c,g:g,px:px}; paintDart();
  art.appendChild(c);
 }else{ DART=null; art.innerHTML='<span class="dq">?</span>'; }
 art.style.borderColor=has?R[1]:'#2b3a50';
 const txt=document.createElement('div'); txt.className='dtxt';
 txt.innerHTML='<b style="color:'+R[1]+'">'+g[0]+'</b>'
  +'<span class="rr" style="color:'+R[1]+'">'+R[0]+'</span> &nbsp;·&nbsp; '
  +SLOTNAME[CAT2SLOT[g[1]]]
  +(has?'<br><span style="color:#5c6a7c">'+(MATNAME[g[6]]||'')
        +(n>1?(MATNAME[g[6]]?' &nbsp;·&nbsp; ':'')+n+' found':'')+'</span>'
      :'<br><span style="color:#5c6a7c">Not found yet.'
        +(g[2]===4?' The trail will not give this up. The cairn is the only way.'
                  :' Keep walking, or claim it.')+'</span>')
  +statRow(g);
 if(has){
  const sl=CAT2SLOT[g[1]], worn=(S.eq&&S.eq[sl]===g.id);
  const b=document.createElement('button');
  b.className='wearbtn'+(worn?' on':'');
  b.textContent=worn?'\u2713 WORN \u00b7 TAKE OFF':'WEAR IT \u25b6';
  b.onclick=()=>equip(g);
  txt.appendChild(b);
 }else{
  const cost=STONE_C[g[2]], have=stones(), can=have>=cost;
  const b=document.createElement('button');
  b.className='wearbtn '+(can?'buy':'poor');
  b.textContent=can?('CLAIM \u00b7 '+cost+' STONES')
                   :(cost+' STONES \u00b7 YOU HAVE '+have);
  if(can) b.onclick=()=>claim(g);
  txt.appendChild(b);
 }
 D.appendChild(art); D.appendChild(txt);
}
function drawStats(){
 const B=document.getElementById('statbar'); B.innerHTML='';
 const t=loadout();
 for(const k of STATS){
  const d=document.createElement('div'); d.className='stat';
  d.innerHTML='<span>'+STATNAME[k]+'</span><b style="color:'+STATCOL[k]+'">'+t[k]+'</b>';
  B.appendChild(d);
 }
}
/* the four numbers for one piece, used on its entry in the pack */
function statRow(g){
 const st=statsOf(g);
 return '<div class="srow">'+STATS.map(k=>'<span>'+STATNAME[k]
   +' <b style="color:'+STATCOL[k]+'">'+st[k]+'</b></span>').join('')+'</div>';
}
function drawPack(){
 packStart();
 const tot=GEAR.length, got=GEAR.filter(g=>owned(g.id)).length;
 document.getElementById('pcount').textContent=got+' / '+tot;
 document.getElementById('pstones').textContent='\u25b2 '+stones();
 drawSlots(); drawStats(); drawTabs(); drawGrid(); drawDetail();
}
let packTick=null;
function packAnimate(){
 if(!pack.classList.contains('open')){packTick=null;return;}
 const eh=S.eq&&S.eq.hand?BYID[S.eq.hand]:null;
 const eo=S.eq&&S.eq.off ?BYID[S.eq.off ]:null;
 const ed=S.eq&&S.eq.head?BYID[S.eq.head]:null;
 const eb=S.eq&&S.eq.body?BYID[S.eq.body]:null;
 const ef=S.eq&&S.eq.feet?BYID[S.eq.feet]:null;
 const onDoll=(eh&&auraOf(eh))||(eo&&auraOf(eo))||(ed&&auraOf(ed))
            ||(eb&&auraOf(eb))||(ef&&auraOf(ef));
 if(!onDoll&&!(DART&&auraOf(DART.g))){packTick=null;return;}
 if(onDoll) drawDoll();
 if(DART&&auraOf(DART.g)) paintDart();
 packTick=requestAnimationFrame(packAnimate);
}
function packStart(){ if(!packTick) packTick=requestAnimationFrame(packAnimate); }
document.getElementById('packopen').onclick=()=>{pack.classList.add('open'); drawPack(); packStart();};
document.getElementById('kitstrip').onclick=()=>{pack.classList.add('open'); drawPack(); packStart();};
document.getElementById('pclose').onclick=()=>pack.classList.remove('open');
const jrn=document.getElementById('journal');
document.getElementById('jopen').onclick=()=>{drawJournal(); jrn.classList.add('open');};
document.getElementById('jclose').onclick=()=>jrn.classList.remove('open');

/* ---- the trails ----
   Steps go to one trail at a time. Picking another one does not cost
   anything: the one you leave keeps its mile, its journal and whatever
   was barring it, and is there when you come back. */
const trl=document.getElementById('trails');
document.getElementById('tnametext').textContent='\u2605 '+TR.head;
document.getElementById('endname').textContent=TR.end;
function drawTrails(){
 const G=document.getElementById('tlist'); G.innerHTML='';
 const crown=['at','pct','cdt'].filter(id=>S.done[id]).length;
 document.getElementById('tcount').textContent=
  TORDER.filter(id=>S.done[id]).length+' / '+TORDER.length+' WALKED';
 document.getElementById('tsum').innerHTML=
  'Your steps go to one trail at a time. Each trail keeps its own mileage and journal. '
  +'Your pack, your stones and your gear come with you.'
  +(crown===3?' <b style="color:var(--gold)">\u2605 TRIPLE CROWN.</b>'
    :' The Appalachian, the Pacific Crest and the Continental Divide together are the '
     +'Triple Crown: '+crown+' of 3 walked.');
 for(const id of TORDER){
  const T=TRAILS[id], here=id===S.cur, st=here?S:(S.tr[id]||{});
  const mi=Math.min(T.total,(st.steps||0)/SPM);
  const d=document.createElement('div'); d.className='jrow'+(here?' tcur':'');
  d.innerHTML='<div class="jhead"><span class="jn">'+T.name+'</span>'
   +'<span class="jd">'+T.total.toLocaleString()+' MI</span></div>'
   +'<div class="jm">'+T.from+' TO '+T.to+'</div>'
   +'<div class="jw">'+T.pitch+'</div>'
   +'<div class="jg">'+(S.done[id]?'<b style="color:var(--gold)">\u2605 THRU HIKED</b> &middot; ':'')
   +(mi>0?'MILE '+mi.toFixed(1)+' &middot; '+(mi/T.total*100).toFixed(1)+'%':'NOT STARTED')+'</div>';
  const b=document.createElement('button'); b.className='btn tgo';
  if(here){ b.textContent='YOU ARE HERE'; b.disabled=true; }
  else{ b.textContent=mi>0?'PICK IT BACK UP \u25b6':'START WALKING \u25b6';
        b.onclick=()=>walkTrail(id); }
  d.appendChild(b); G.appendChild(d);
 }
}
document.getElementById('tname').onclick=()=>{drawTrails(); trl.classList.add('open');};
document.getElementById('nextdist').onclick=()=>{
 if(miles()>=TOTAL){drawTrails(); trl.classList.add('open');} };
document.getElementById('tclose').onclick=()=>trl.classList.remove('open');

/* the strips are keyed on a signature, so a forced redraw needs it cleared */
const _eq0=equip;
equip=function(g){ _eq0(g); kitSig=''; statSig=''; hud(); };

prune();
if(!S.dk) S.dk=dayKey();
wizApply(); drawPack();
/* a native shell may already be handing us steps; otherwise ask */
/* in dev mode the buttons are the step source, so the bar should not
   nag for motion a laptop is never going to send */
stepsLive(DEVMODE);
hostPoll();
if(!DEVMODE&&!hostFn()) startMotion();
setInterval(hostPoll,1500);
resize(); hud(); measureBtm();
addEventListener('resize',()=>{resize(); measureBtm();});
requestAnimationFrame(frame);
</script>
