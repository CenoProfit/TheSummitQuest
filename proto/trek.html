:root{
 --pix:'Press Start 2P','Courier New',monospace;
 --body:'Courier New',Courier,monospace;
 --bg:#080d14; --solid:#111823; --solid2:#1a2432;
 --panel:rgba(14,22,33,.60); --panel2:rgba(24,34,48,.52);
 --edge:#33445c; --edge2:#5a7392; --ink:#e9f0f6; --dim:#8695a8;
 --gold:#f5c651; --xp:#74e84f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
 overflow:hidden;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
 padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.frame{background:var(--panel);border:3px solid var(--edge);position:relative;
 box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--edge2),4px 4px 0 4px rgba(0,0,0,.5);
 background-image:
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.top{padding:8px 11px}
.trailname{font-family:var(--pix);font-size:8px;letter-spacing:2px;color:var(--gold);
 text-shadow:2px 2px 0 rgba(0,0,0,.7)}
.mile{font-family:var(--pix);font-size:17px;margin:7px 0 3px;letter-spacing:1px;
 text-shadow:2px 2px 0 rgba(0,0,0,.75)}
.mile small{font-size:8px;color:var(--dim);letter-spacing:2px}
.biome{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.btm{margin-top:auto;padding:10px 11px 11px}
.nextrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.nextname{font-family:var(--pix);font-size:8px;letter-spacing:1px;color:var(--gold);
 text-shadow:1px 1px 0 rgba(0,0,0,.7);line-height:1.5}
.nextdist{font-family:var(--pix);font-size:8px;white-space:nowrap}
.track{height:13px;background:#0a121c;border:2px solid var(--edge2);overflow:hidden;
 background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.fill{height:100%;background:linear-gradient(#9bf07a,#48b82e);width:0%;transition:width .5s ease-out}
.steprow{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;
 letter-spacing:1px;color:var(--dim)}
.steprow b{color:var(--xp);font-family:var(--pix);font-size:9px}
.steprow i{color:var(--gold);font-family:var(--pix);font-size:9px;font-style:normal}
.dev{margin-top:8px;display:flex;gap:6px}
.btn{font-family:var(--pix);font-size:7px;letter-spacing:1px;padding:8px 7px;flex:1;
 background:var(--solid2);color:var(--ink);border:2px solid var(--edge2);cursor:pointer;
 box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.devnote{font-size:9px;color:#5c6a7c;letter-spacing:1px;margin-top:7px;text-align:center}

/* ---- chest ---- */
#chest{position:fixed;inset:0;z-index:30;display:none;background:rgba(3,6,11,.90)}
#chest.open{display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.cinfo{position:absolute;left:0;right:0;bottom:0;
 padding:18px 22px max(22px,env(safe-area-inset-bottom));text-align:center;
 background:linear-gradient(rgba(3,6,11,0) 0%,rgba(3,6,11,.92) 16%,rgba(3,6,11,.98) 100%)}
.clm{font-family:var(--pix);font-size:8px;color:var(--dim);letter-spacing:2px;line-height:1.8;
 margin-bottom:14px;opacity:0;transition:opacity .5s}
.crar{font-family:var(--pix);font-size:12px;letter-spacing:3px;margin-bottom:9px;
 text-shadow:0 0 10px currentColor,2px 2px 0 rgba(0,0,0,.8);opacity:0;transform:scale(.6);
 transition:opacity .35s,transform .35s cubic-bezier(.2,1.7,.5,1)}
.citem{font-family:var(--pix);font-size:11px;line-height:1.8;margin-bottom:5px;opacity:0;
 transition:opacity .4s}
.ckind{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;
 margin-bottom:18px;opacity:0;transition:opacity .4s}
#cok{opacity:0;transition:opacity .4s;width:100%;flex:none;padding:12px}
.show{opacity:1 !important;transform:none !important}
</style>

<body>
<canvas id="scene"></canvas>

<div class="wrap">
  <div class="frame top">
    <div class="trailname">★ APPALACHIAN TRAIL · NOBO</div>
    <div class="mile"><span id="mile">0.0</span> <small>MI OF 2197</small></div>
    <div class="biome" id="biome">Georgia hardwood</div>
  </div>
  <div class="frame btm">
    <div class="nextrow">
      <span class="nextname" id="nextname">STOVER CREEK SHELTER</span>
      <span class="nextdist" id="nextdist">2.8 MI</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="steprow">
      <span>TODAY <b id="today">0</b> STEPS</span>
      <span>DAY <i id="day">1</i></span>
    </div>
    <div class="dev">
      <button class="btn" id="b1k">+1,000</button>
      <button class="btn" id="b5k">+5,000</button>
      <button class="btn" id="bday">NEXT DAY</button>
      <button class="btn" id="brst">RESET</button>
    </div>
    <div class="devnote">prototype controls — real build reads HealthKit</div>
  </div>
</div>

<div id="chest">
  <canvas id="fx"></canvas>
  <div class="cinfo">
    <div class="clm" id="clm"></div>
    <div class="crar" id="crar"></div>
    <div class="citem" id="citem"></div>
    <div class="ckind" id="ckind"></div>
    <button class="btn" id="cok">KEEP WALKING ▶</button>
  </div>
</div>

<script>
/* ===================================================================
   SUMMIT QUEST — DAILY TREK (prototype, perspective rebuild)

   You walk away from the camera, up a winding trail that recedes to the
   horizon, and the world comes at you continuously.

   The renderer is the pseudo-3D ground plane that racing games used:
   the trail is a chain of fixed-length segments in world space, each
   projected to a screen row by y = horizon + FOCAL/z. Drawing them from
   nearest to furthest and refusing to draw above the lowest row already
   covered gives hidden-surface removal for free, which is what lets the
   ground roll over hills instead of lying flat.

   Everything is on the same 1:3 pixel grid as the rest of the game.
   =================================================================== */

const PX   = 2;    // screen pixels per drawn pixel
const SEG  = 0.5;    // world units per trail segment
const MPZ  = 160;    // world units per trail mile
const SPM  = 2100;   // steps per mile, ~30in stride
const NSEG = 620;  // segments drawn ahead

/* ---------- colour ---------- */
const _rgb=h=>{h=h.replace('#','');
 return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const _css=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const _mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const _dark=(a,t)=>_mix(a,[0,0,0],t), _lite=(a,t)=>_mix(a,[255,255,255],t);

/* Stateless. Every feature has to be derivable from its own world slot
   alone, because the world streams past the camera forever. */
function hash(n){let t=(n|0)+0x6D2B79F5|0;t=Math.imul(t^t>>>15,1|t);
 t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}

/* ---------- the trail, northbound from Springer ---------- */
const TRAIL=[
 {m:  0.0,n:'SPRINGER MOUNTAIN',      k:'summit', t:3,a:.18},
 {m:  2.8,n:'STOVER CREEK SHELTER',   k:'shelter',t:0},
 {m:  4.9,n:'THREE FORKS',            k:'water',  t:0},
 {m:  5.2,n:'LONG CREEK FALLS',       k:'water',  t:1},
 {m:  8.1,n:'HAWK MOUNTAIN SHELTER',  k:'shelter',t:1},
 {m: 15.8,n:'GOOCH MOUNTAIN SHELTER', k:'shelter',t:1},
 {m: 20.5,n:'WOODY GAP',              k:'gap',    t:1},
 {m: 28.8,n:'BLOOD MOUNTAIN',         k:'summit', t:4,a:1.0},
 {m: 31.7,n:'NEEL GAP',               k:'town',   t:3},
 {m: 37.4,n:'HOGPEN GAP',             k:'gap',    t:1},
 {m: 43.2,n:'LOW GAP SHELTER',        k:'shelter',t:1},
 {m: 50.5,n:'BLUE MOUNTAIN SHELTER',  k:'shelter',t:1},
 {m: 52.9,n:'UNICOI GAP',             k:'gap',    t:2},
 {m: 56.0,n:'TRAY MOUNTAIN',          k:'summit', t:3,a:.60},
 {m: 69.6,n:'DICKS CREEK GAP',        k:'town',   t:2},
 {m: 78.1,n:'BLY GAP',                k:'border', t:4},
 {m: 85.5,n:'STANDING INDIAN',        k:'summit', t:3,a:.70},
 {m: 99.6,n:'ALBERT MOUNTAIN',        k:'summit', t:4,a:.80},
 {m:100.0,n:'ONE HUNDRED MILES',      k:'mark',   t:4,a:.45},

const BK=['mtn','fst','gnd','gn2','pth','cnp','trk','fer','rck'];
function biomeAt(mi){
 let a=BIOMES[0],b=BIOMES[0];
 for(let i=0;i<BIOMES.length;i++){ if(BIOMES[i].m<=mi) a=BIOMES[i];
  if(BIOMES[i].m>mi){b=BIOMES[i];break;} b=a; }
 const t=Math.min(1,Math.max(0,(mi-a.m)/Math.max(.001,b.m-a.m)));
 const o={name:(t<.5?a.n:b.n),tree:(t<.5?a.tree:b.tree),
  sky0:_mix(_rgb(a.sky[0]),_rgb(b.sky[0]),t), sky1:_mix(_rgb(a.sky[1]),_rgb(b.sky[1]),t)};
 for(const k of BK) o[k]=_mix(_rgb(a[k]),_rgb(b[k]),t);
 return o;
}

/* ===================================================================
   RENDER CORE  —  three-quarter view, orthographic, chunk-baked

   The mountain is not projected every frame. It is a tall vertical
   strip of world that gets baked, once, into offscreen chunks and then
   scrolled. That is what a tile-based game does, and it is the only way
   to afford this much detail: a chunk costs millions of operations to
   shade, but it is paid once every twenty seconds instead of sixty
   times a second.

   The terrain itself is a ridged-multifractal heightfield lit by a
   surface normal. Ridges, gullies, spurs and faces all fall out of that
   for free, which is why it reads as a mountain range rather than as a
   texture. Material comes from altitude and steepness: forest low,
   meadow and scree above it, bare rock on anything steep, snow at the
   top. There is no horizon and no sky. Distance is carried entirely by
   a screen-space haze that thickens toward the top of the frame, so the
   far ridges sit back without a single extra polygon.
   =================================================================== */
const RPM  = 900;    // world rows per trail mile
const CH   = 256;    // chunk height, world rows
const OVER = 96;     // how far an object may overhang the chunk above it
const _qh=new URLSearchParams(location.search).get('t');
const HOUR=()=> _qh!==null?(+_qh):new Date().getHours();
/* Fractional hours. The sun has to crawl, not hop once an hour. */
function TOD(){
 if(_qh!==null) return (+_qh)%24;
 const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
}
/* ---- the sky ----
   Sunrise at six, sunset at half past seven, and an arc between them. The
   whole palette hangs off one number: the sun's elevation. */
const SUNUP=6.0, SUNDN=19.5;
function solar(){
 const h=TOD(), day=(h>=SUNUP&&h<SUNDN);
 const tt=day?(h-SUNUP)/(SUNDN-SUNUP):((h-SUNDN+24)%24)/(24-(SUNDN-SUNUP));
 const el=Math.sin(tt*Math.PI);                 // 0 at the horizon, 1 at the top
 return {day,tt,el,
   x:0.05+0.90*tt,                              // across the sky, left to right
   y:1-el,                                      // 0 at the top, 1 on the horizon
   /* warmth spikes near the horizon and dies at noon */
   warm:Math.min(0.72,Math.max(0,1-el*2.6))*(day?1:0.30),
   dark:day?0:Math.min(1,0.35+el*0.75)};
}
const SKY={
 night:[['#060b1c','#0d1630','#1a2443'],   /* zenith, middle, horizon */
        ['#0a1024','#16203c','#2b3657']],
 dawn :[['#17315e','#4a6b9e','#e9a06a'],
        ['#1d3a6b','#5a7cab','#f4bf86']],
 day  :[['#1d5fb8','#3f87d4','#a9d4ee'],
        ['#2468c4','#4d93dd','#bfe0f4']],
 dusk :[['#15274f','#4f4a86','#f0875a'],
        ['#1b2f5c','#60588f','#f8a46d']]};
const _qm=new URLSearchParams(location.search).get('m');

/* ---- light ---- */
const COOL=[44,52,76], WARM=[255,243,205];
const sh=(c,t)=> t<0?_mix(c,COOL,Math.min(.72,-t*.80)):_mix(c,WARM,Math.min(.86,t*.82));
const LX=-0.62, LY=-0.56, LZ=0.55;          // key light, over the left shoulder

/* ---- ordered dither, served as canvas patterns ---- */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const _pat=new Map();
function dpat(a,b,lv){
 lv=Math.max(0,Math.min(16,Math.round(lv)));
 const k=a+'|'+b+'|'+lv;
 let p=_pat.get(k); if(p) return p;
 if(lv<=0) p=a; else if(lv>=16) p=b;
 else{
  const c=document.createElement('canvas'); c.width=4; c.height=4;
  const q=c.getContext('2d'); q.fillStyle=a; q.fillRect(0,0,4,4); q.fillStyle=b;
  for(let y=0;y<4;y++)for(let x=0;x<4;x++) if(BAYER[(y<<2)|x]<lv) q.fillRect(x,y,1,1);
  p=ctx.createPattern(c,'repeat');
 }
 if(_pat.size>1400) _pat.clear();
 _pat.set(k,p); return p;
}
function vnoise(x,y){
 const xi=Math.floor(x), yi=Math.floor(y), fx=x-xi, fy=y-yi;
 const h00=hash(xi*374761+yi*668265), h10=hash((xi+1)*374761+yi*668265);
 const h01=hash(xi*374761+(yi+1)*668265), h11=hash((xi+1)*374761+(yi+1)*668265);
 const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
 return (h00*(1-sx)+h10*sx)*(1-sy)+(h01*(1-sx)+h11*sx)*sy;
}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.28+vnoise(x*4.3,y*4.3)*.17;}
/* Ridged multifractal. Folding the noise at its midpoint turns rounded
   hills into sharp crests, which is the difference between a landscape
   and a duvet. */
function ridged(x,y){
 let s=0,a=1,f=1,w=0;
 for(let i=0;i<5;i++){
  const n=1-Math.abs(vnoise(x*f,y*f)*2-1);
  s+=n*n*a; w+=a; a*=.52; f*=2.07;
 }
 return s/w;
}

/* ---------- state ---------- */
const KEY='sq_trek_proto3';
let S={steps:0,today:0,day:1,opened:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const miles=()=>S.steps/SPM;
if(_qm!==null) S.steps=Math.round((+_qm)*SPM);

let shownMi=miles(), drift=0, surge=0, walkPhase=0;

const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){
 const w=cv.clientWidth||innerWidth, h=cv.clientHeight||innerHeight;
 W=Math.max(1,Math.ceil(w/PX)); H=Math.max(1,Math.ceil(h/PX));
 cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;
 CHUNK.clear(); TC.clear(); UC.clear(); _pat.clear();
}

/* ---- where you are on the mountain ----
   World rows run downhill, so climbing means the camera row decreases.
   Row zero is Springer. Everything in the world is addressed by its row. */
const rowOfMile=m=> -m*RPM;
const mileOfRow=Y=> -Y/RPM;

/* How far above the treeline a mile feels, from the nearest bald summit. */
function alpineAt(mi){
 let v=0;
 for(const L of TRAIL){
  if(!L.a) continue;
  const d=Math.abs(L.m-mi); if(d>2.6) continue;
  v=Math.max(v,L.a*(1-d/2.6));
 }
 return Math.max(0,Math.min(1,v));
}

/* ---- the crest ----
   Long traverses with hard kinks, which is what a ridge actually does.
   A triangle wave gives the reversal; the slow wander keeps it from
   looking mechanical. */
function crestX(Y){
 const a=Math.asin(Math.sin(Y*0.0040))*0.6366;
 const b=Math.asin(Math.sin(Y*0.0129+1.7))*0.6366;
 return W*0.50 + a*W*0.25 + b*W*0.125 + (fbm(Y*0.0055,11)-0.5)*W*0.11;
}
/* how broad the top of the spine is: wide saddles, narrow knife edges */
function crestW(Y){
 return W*(0.105+0.055*Math.sin(Y*0.0072)+0.026*Math.sin(Y*0.0185+2.1));
}
/* One over a crest, falling to zero down its flanks. Pulled out of the
   height function because the shading needs it too: high ground is open to
   the sky and reads bright, valleys close over and read dark, and that
   contrast is most of what makes a ridge look like a ridge. */
/* which flank falls away harder. It swaps over long distances, so the
   exposure changes shoulder to shoulder as you walk. */
function crestTilt(Y){ return Math.sin(Y*0.0029+0.7)*0.62+Math.sin(Y*0.0071)*0.25; }

function ridgeProf(x,Y,off,wscale,fall){
 const cx=crestX(Y)+off, wd=crestW(Y)*wscale, tilt=crestTilt(Y);
 const dx=x-cx, d=Math.abs(dx), side=dx<0?-1:1;
 if(d<wd) return 1-0.19*(d/wd)*(d/wd);
 const e=(d-wd)/(W*fall)*(1.0+side*tilt*0.58);
 return 0.82*Math.exp(-e*2.4)/(1+e*1.30);
}
/* The one you are standing on. A tight falloff is the whole point: this is
   a drop, not a hillside. */
const crestProf=(x,Y)=> ridgeProf(x,Y,0,1,0.235);
/* Its neighbours, lower and broader, with forested valleys in between.
   Without them the flanks just run off the edge of the screen and there is
   nothing to be above. */
const SIDE_L=-0.70, SIDE_R=0.74;
const leftProf =(x,Y)=> ridgeProf(x,Y,W*SIDE_L,1.7,0.30);
const rightProf=(x,Y)=> ridgeProf(x,Y,W*SIDE_R,1.6,0.30);
function profAt(x,Y){
 return Math.max(crestProf(x,Y),leftProf(x,Y)*0.74,rightProf(x,Y)*0.70);
}

const pathX=Y=> crestX(Y);
const pathW=()=> Math.max(3,W*0.030);

/* ---- terrain ---- */
function terrainH(x,Y){
 let h=-Y*0.30;
 h+=crestProf(x,Y)*118;                        // the spine you walk
 h+=leftProf(x,Y)*78;                          // the range either side
 h+=rightProf(x,Y)*72;
 const p=profAt(x,Y);
 /* spurs and gullies, strongest on the flanks and in the valleys */
 h+=ridged(x*0.0092,Y*0.0092)*34*(0.24+0.76*(1-p));
 h+=ridged(x*0.023+30,Y*0.023)*10;
 h+=fbm(x*0.036,Y*0.036)*4.5;
 return h;
}

/* Everything a pixel needs to know about itself. */
const MAT={ROCK:0,SCREE:1,MEADOW:2,FOREST:3,SNOW:4,PATH:5,WATER:6};

/* ===================================================================
   CHUNKS
   =================================================================== */
const CHUNK=new Map();
let chunkBudget=0;

function buildChunk(ci,B0){
 const A=ci*CH, Bq=A+CH;
 const c=document.createElement('canvas'); c.width=W; c.height=CH;
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const img=q.createImageData(W,CH), D=img.data;

 /* The heightfield is sampled at half resolution and interpolated. The
    shading needs gradients, not detail, and this makes a chunk four
    times cheaper without anyone being able to tell. */
 const GW=(W>>1)+3, GH=(CH>>1)+3;
 const G=new Float32Array(GW*GH);
 for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++)
  G[gy*GW+gx]=terrainH((gx-1)*2,A+(gy-1)*2);
 /* Cast shadow, in a single pass. The key light comes from the left, so
    march each row left to right carrying the highest horizon seen so far,
    decayed by the sun's slope: anything that falls below that horizon is
    in the shadow of something uphill of it. A ridge that throws no shadow
    into its own valley never reads as having height, and this is the one
    cue that no amount of palette work can fake. */
 const SHD=new Float32Array(GW*GH);
 const SUNSL=1.35;                     // height lost per grid step sunward
 for(let gy=0;gy<GH;gy++){
  let horizon=-1e9;
  for(let gx=0;gx<GW;gx++){
   horizon-=SUNSL;
   const hv=G[gy*GW+gx];
   if(hv>=horizon){ horizon=hv; SHD[gy*GW+gx]=0; }
   else SHD[gy*GW+gx]=Math.min(1,(horizon-hv)/11);
  }
 }
 const sAt=(x,y)=>{
  const fx=x*0.5+1, fy=y*0.5+1;
  const xi=Math.min(GW-2,Math.max(0,Math.floor(fx))), yi=Math.min(GH-2,Math.max(0,Math.floor(fy)));
  const tx=fx-xi, ty=fy-yi, o=yi*GW+xi;
  return (SHD[o]*(1-tx)+SHD[o+1]*tx)*(1-ty)+(SHD[o+GW]*(1-tx)+SHD[o+GW+1]*tx)*ty;
 };
 const gAt=(x,y)=>{                       // bilinear back to full res
  const fx=x*0.5+1, fy=y*0.5+1;
  const xi=Math.min(GW-2,Math.max(0,Math.floor(fx))), yi=Math.min(GH-2,Math.max(0,Math.floor(fy)));
  const tx=fx-xi, ty=fy-yi, o=yi*GW+xi;
  return (G[o]*(1-tx)+G[o+1]*tx)*(1-ty)+(G[o+GW]*(1-tx)+G[o+GW+1]*tx)*ty;
 };

 for(let y=0;y<CH;y++){
  const Y=A+y;
  const mi=mileOfRow(Y);
  const B=biomeAt(Math.max(0,mi)), alp=alpineAt(Math.max(0,mi));
  const px=pathX(Y), pw=pathW();
  const rock=_mix(B.rck,_rgb('#9c968a'),.22);
  for(let x=0;x<W;x++){
   const h=gAt(x,y);
   const hx=(gAt(x+1,y)-gAt(x-1,y))*0.5;
   const hy=(gAt(x,y+1)-gAt(x,y-1))*0.5;
   const inv=1/Math.sqrt(hx*hx+hy*hy+1);
   let lam=(-hx*LX-hy*LY+LZ)*inv;              // lambert on the surface
   const steep=Math.sqrt(hx*hx+hy*hy);
   const prof=profAt(x,Y);
   /* sky exposure: the crest is open, the gullies are not */
   const amb=0.36+0.32*inv+0.26*prof;
   lam=Math.max(-0.42,lam)*1.12+amb*0.30;

   /* ---- material ---- */
   const dpx=Math.abs(x-px);
   const grain=fbm(x*0.030,Y*0.030);          // patches, tens of pixels
   const fine =fbm(x*0.26,Y*0.26);           // texture, a few pixels
   const open=prof+grain*0.16-0.08;           // how exposed this ground is
   let m, col;
   if(dpx<pw*(0.9+grain*0.35)){
    m=MAT.PATH;
   }else if(steep>3.00-grain*0.8){
    m=MAT.ROCK;                               // anything that is a cliff
   }else if(alp>0.80&&open>0.70&&grain>0.30){
    m=MAT.SNOW;
   }else if(alp>0.46||(open>0.86&&steep>0.70)){
    m=MAT.SCREE;                              // bare, blown crest
   }else if(open<0.34){
    m=MAT.FOREST;                             // the valleys fill with trees
   }else if(open<0.56&&grain>0.30){
    m=MAT.FOREST;
   }else m=MAT.MEADOW;

   switch(m){
    case MAT.PATH:{
     const edge=dpx/(pw*(0.9+grain*0.35));
     col=_mix(B.pth,rock,0.35+alp*0.4);
     col=sh(col,0.12-edge*0.50+(fine-0.5)*0.26);
     if(hash((x*7+Y*131)|0)<0.12) col=sh(col,0.26);     // stones in the tread
     break;}
    case MAT.ROCK:{
     const facet=Math.sin(x*0.52+h*0.14)*Math.sin(Y*0.44+fine*2.3)
                +Math.sin(x*1.21+Y*0.63)*0.45;
     const strat=Math.sin(h*0.34+fine*2.4)+facet*0.55;
     col=_mix(_rgb('#6e6a78'),_rgb('#b0a9bb'),fine*0.70+(strat>0?0.18:0));
     col=sh(col,-0.04+(fine-0.5)*0.40+facet*0.17);
     break;}
    case MAT.SCREE:
     col=sh(_mix(rock,B.gn2,0.26+grain*0.3),-0.06+(fine-0.5)*0.36); break;
    case MAT.SNOW:{
     col=_mix(_rgb('#dfe9fb'),_rgb('#ffffff'),fine);
     col=sh(col,0.16+(fine-0.5)*0.18); break;}
    case MAT.FOREST:
     col=sh(_mix(B.cnp,B.fst,grain*0.6),-0.26+(fine-0.5)*0.32); break;
    default:
     col=sh(_mix(B.gnd,B.gn2,grain),(fine-0.5)*0.36); break;
   }
   /* altitude: the valleys sit in their own shade, the crest does not */
   col=_mix(sh(col,-0.30),col,Math.pow(prof,0.58));
   col=_mix(col,_rgb('#8ba4c6'),(1-prof)*0.15);
   /* light it, then put it in the shadow of whatever is uphill */
   const t=Math.max(-0.52,Math.min(0.62,(lam-0.56)*2.05));
   col=sh(col,t);
   const shd=sAt(x,y);
   if(shd>0.01) col=_mix(col,sh(col,-0.44),Math.min(0.62,shd*0.78));
   const o=((y*W)+x)<<2;
   D[o]=col[0]|0; D[o+1]=col[1]|0; D[o+2]=col[2]|0; D[o+3]=255;
  }
 }
 q.putImageData(img,0,0);

 /* ---- things that stand on it, back to front ---- */
 const items=[];
 for(let Y=A-OVER;Y<Bq+OVER;Y++){
  const mi=mileOfRow(Y), alp=alpineAt(Math.max(0,mi));
  const px=pathX(Y), pw=pathW();
  /* two candidate slots per row, thinned hard so they do not carpet */
  for(let s=0;s<4;s++){
   const r=hash((Y*1709+s*7919)|0);
   if(r>0.085) continue;
   const x=Math.round(hash((Y*131+s*31)|0)*W);
   if(Math.abs(x-px)<pw*2.1) continue;                 // keep the trail clear
   const h=terrainH(x,Y);
   const steep=Math.abs(terrainH(x+2,Y)-terrainH(x-2,Y))*0.25
              +Math.abs(terrainH(x,Y+2)-terrainH(x,Y-2))*0.25;
   const g2=fbm(x*0.030,Y*0.030);
   const pr=profAt(x,Y);
   const treeOK=alp<0.52&&steep<1.8&&g2>0.12&&pr<0.72
               &&hash((Y*97+s*311)|0)>pr*0.85;   /* thinning out uphill */
   const kind=treeOK&&hash((Y*53+s*17)|0)<0.62?'tree'
             :hash((Y*97+s*41)|0)<0.42?'rock'
             :alp>0.5?'rock':(hash((Y*29+s*13)|0)<0.5?'bush':'fern');
   items.push({x,Y,kind,s,alp,mi});
  }
  /* trailside markers: a cairn every so often, more of them up high */
  if(hash((Y*4409)|0)<0.006+alp*0.012){
   items.push({x:Math.round(px+(hash((Y*13)|0)<0.5?-1:1)*pw*2.1),Y,kind:'cairn',s:0,alp,mi});}
 }
 items.sort((a,b)=>a.Y-b.Y);
 for(const it of items){
  const sy=it.Y-A;
  const B=biomeAt(Math.max(0,it.mi));
  if(it.kind==='tree'){
   const vr=Math.floor(hash((it.Y*17+it.s*5)|0)*4);
   const hgt=Math.round((7+hash((it.Y*311+it.s)|0)*13)*(1-it.alp*0.55));
   if(hgt<4) continue;
   const spc=it.alp>0.3?'fir':B.tree==='fir'?(vr<3?'fir':'hard')
                              :(vr===0?'birch':vr===1?'fir':'hard');
   const spr=treeSprite(spc,hgt,B,[0,0,0],0,Math.round(it.mi/7),
                        hash((it.Y*7)|0)<0.16,vr);
   /* a soft cast shadow downslope of the key light */
   const sw=spr.width*0.42, sh2=Math.max(1,hgt*0.085);
   q.fillStyle='rgba(12,18,34,.32)';
   for(let d2=-sh2;d2<=sh2;d2++){
    const ww=Math.round(sw*Math.sqrt(Math.max(0,1-(d2/sh2)*(d2/sh2))));
    if(ww>0) q.fillRect(Math.round(it.x+sw*0.75-ww),Math.round(sy+d2),ww*2,1);}
   q.drawImage(spr,Math.round(it.x-spr.width/2),Math.round(sy-spr.height+2));
  }else if(it.kind==='cairn'){
   const s2=Math.max(1,Math.round(1+hash((it.Y*3)|0)*1.4));
   q.fillStyle='rgba(12,18,34,.30)';
   q.fillRect(it.x-s2*2,sy-1,s2*4,2);
   for(let i=0;i<5;i++){
    const w2=s2*(2.4-i*0.38);
    q.fillStyle=_css(sh(_rgb('#8b8798'),-0.22+i*0.10));
    q.fillRect(Math.round(it.x-w2),Math.round(sy-i*s2*1.1-s2),Math.round(w2*2),Math.round(s2*1.2));
    q.fillStyle=_css(sh(_rgb('#8b8798'),0.22+i*0.06));
    q.fillRect(Math.round(it.x-w2),Math.round(sy-i*s2*1.1-s2),Math.round(w2*0.9),Math.round(s2*0.5));}
  }else{
   const s2=Math.max(1,Math.round(1+hash((it.Y*211+it.s)|0)*1.6));
   const spr=undergrowth(it.kind,s2,B,[0,0,0],0,Math.round(it.alp*4),
     Math.floor(hash((it.Y*523+it.s*71)|0)*4));
   q.drawImage(spr,Math.round(it.x-spr.width/2),Math.round(sy-spr.height+1));
  }
 }

 /* ---- landmarks sit at their real mileage ---- */
 for(const L of TRAIL){
  const Y=rowOfMile(L.m);
  if(Y<A-OVER||Y>=Bq+OVER) continue;
  const sy=Y-A, B=biomeAt(L.m);
  const side=hash(Math.round(L.m*10))<0.5?-1:1;
  const lx=Math.round(pathX(Y)+side*pathW()*2.2);
  q.fillStyle='rgba(12,18,34,.30)';
  q.fillRect(lx-5,sy-1,10,2);
  landmark(q,lx,sy,0.62,L.k,B,false);
 }
 return c;
}
function chunkAt(ci){
 let c=CHUNK.get(ci);
 if(!c){ c=buildChunk(ci); CHUNK.set(ci,c);
  if(CHUNK.size>7){ const ks=[...CHUNK.keys()].sort((a,b)=>a-b);
   /* drop whichever cached chunk is furthest from the camera */
   const cur=Math.floor(camTopRow()/CH);
   ks.sort((a,b)=>Math.abs(b-cur)-Math.abs(a-cur));
   CHUNK.delete(ks[0]); } }
 return c;
}

/* ===================================================================
   TREES — baked per species, per size, per variant.
   A tree is drawn once and blitted thereafter, so it can afford a trunk
   with branches, a canopy built from overlapping crowns, a lit side, a
   shaded side, sky holes punched through it, and an outline.
   =================================================================== */
const TC=new Map();
const hbucket=h=> h<10?Math.round(h):h<26?Math.round(h/2)*2:Math.round(h/6)*6;
function treeSprite(sp,h,B,s1,fogLv,tint,blaze,vr){
 vr=vr&3;
 const hb=hbucket(h), key=sp+'|'+hb+'|'+tint+'|'+(blaze?1:0)+'|'+vr;
 let c=TC.get(key); if(c) return c;
 const CW=Math.max(3,Math.ceil(hb*(sp==='fir'?1.0:1.35)))|1;
 const CHh=Math.max(3,Math.ceil(hb*1.08));
 c=document.createElement('canvas'); c.width=CW; c.height=CHh;
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const cx=(CW>>1), gy=CHh-1;
 const VT=[[0,0],[-0.05,.16],[.07,0],[-0.02,-.10]][vr];
 let base=sp==='birch'?_mix(B.cnp,_rgb('#a8cc62'),.46)
         :sp==='fir'  ?_mix(B.cnp,COOL,.14):B.cnp;
 base=_mix(base,_rgb(VT[0]>0?'#b9cc56':'#2f6a4e'),Math.abs(VT[0])*4);
 base=sh(base,VT[1]);
 const lit=sh(base,.38), mid=sh(base,.05), dk=sh(base,-.28), out=sh(base,-.54);
 const trk=sp==='birch'?_rgb('#d8d8cc'):B.trk;
 const F=c2=>_css(c2);
 const dot=(x,y,w2,h2,col)=>{q.fillStyle=col; q.fillRect(Math.round(x),Math.round(y),
   Math.max(1,Math.round(w2)),Math.max(1,Math.round(h2)));};
 const crown=(x,y,r,col)=>{q.fillStyle=col;
  for(let i=-r;i<=r;i++){const w2=Math.round(Math.sqrt(Math.max(0,r*r-i*i))*(1-Math.abs(i)/(r*3.4)));
   if(w2>0) q.fillRect(Math.round(x-w2),Math.round(y+i),w2*2+1,1);}};
 if(sp==='fir'){
  const th=hb*.14, tw=Math.max(1,Math.round(hb*.075));
  dot(cx-tw/2,gy-th,tw,th+1,F(sh(trk,-.18)));
  dot(cx-tw/2,gy-th,Math.max(1,tw/2),th+1,F(sh(trk,.10)));
  const ch2=hb-th, tiers=Math.max(4,Math.round(hb/5));
  for(let tt=tiers-1;tt>=0;tt--){
   const p=tt/(tiers-1), by=gy-th-ch2*p*0.90;
   const r=Math.max(1,hb*.40*(1-p*.80)+(hb>18?1:0));
   q.fillStyle=F(out);
   for(let i=0;i<=r*1.05;i++) q.fillRect(Math.round(cx-r+i*.5),Math.round(by-i*.9),
     Math.max(1,Math.round((r-i*.5)*2)),1);
   q.fillStyle=F(dk);
   for(let i=0;i<=r;i++) q.fillRect(Math.round(cx-r+i*.5)+1,Math.round(by-i*.9)-1,
     Math.max(1,Math.round((r-i*.5)*2)-1),1);
   q.fillStyle=F(mid);
   for(let i=0;i<=r*.9;i++) q.fillRect(Math.round(cx-r*.9+i*.5)+1,Math.round(by-i*.9)-2,
     Math.max(1,Math.round((r*.9-i*.5)*1.5)),1);
   q.fillStyle=F(lit);
   for(let i=0;i<=r*.6;i++) q.fillRect(Math.round(cx-r*.85+i*.4)+1,Math.round(by-i*.9)-2,
     Math.max(1,Math.round((r*.55-i*.35))),1);
  }
  dot(cx,gy-hb,1,Math.max(1,hb*.09),F(lit));
 }else{
  const th=hb*.44, tw=Math.max(1,Math.round(hb*.085));
  dot(cx-tw/2,gy-th,tw,th+1,F(sh(trk,-.22)));
  dot(cx-tw/2,gy-th,Math.max(1,Math.round(tw*.45)),th+1,F(sh(trk,.14)));
  if(hb>14){
   q.fillStyle=F(sh(trk,-.14));
   for(let i=0;i<hb*.22;i++){q.fillRect(Math.round(cx-i*.8),Math.round(gy-th*.75-i*.55),1,1);
    q.fillRect(Math.round(cx+i*.75),Math.round(gy-th*.85-i*.5),1,1);}
   if(sp==='birch'){q.fillStyle=F(sh(trk,-.60));
    for(let i=0;i<4;i++) q.fillRect(cx-tw/2,Math.round(gy-th*(0.2+i*0.2)),Math.max(1,tw-1),1);}
  }
  const ch2=hb-th, w=hb*.52;
  const CLS=[
   [[0,-ch2*.62,.62],[-w*.54,-ch2*.44,.52],[w*.52,-ch2*.46,.50],
    [-w*.30,-ch2*.82,.44],[w*.30,-ch2*.80,.42],[0,-ch2*.95,.33],
    [-w*.62,-ch2*.68,.30],[w*.60,-ch2*.70,.28]],
   [[0,-ch2*.70,.55],[-w*.46,-ch2*.38,.60],[w*.58,-ch2*.52,.44],
    [-w*.18,-ch2*.92,.38],[w*.36,-ch2*.86,.34],[-w*.70,-ch2*.56,.26]],
   [[0,-ch2*.55,.70],[-w*.62,-ch2*.58,.44],[w*.44,-ch2*.40,.56],
    [w*.14,-ch2*.90,.40],[-w*.36,-ch2*.86,.30],[w*.66,-ch2*.74,.24]],
   [[0,-ch2*.78,.48],[-w*.40,-ch2*.52,.54],[w*.40,-ch2*.54,.54],
    [0,-ch2*.40,.62],[-w*.22,-ch2*1.0,.30],[w*.24,-ch2*.98,.28]]];
  const cl=CLS[vr];
  for(const o of cl) crown(cx+o[0],gy-th+o[1],Math.max(1,w*o[2]+1),F(out));
  for(const o of cl) crown(cx+o[0],gy-th+o[1],Math.max(1,w*o[2]),F(dk));
  for(const o of cl) crown(cx+o[0]-w*.13,gy-th+o[1]-w*.11,Math.max(1,w*o[2]*.80),F(mid));
  for(const o of cl) crown(cx+o[0]-w*.26,gy-th+o[1]-w*.22,Math.max(1,w*o[2]*.48),F(lit));
  if(hb>12){
   const im=q.getImageData(0,0,CW,CHh), DD=im.data;
   for(let i=0;i<Math.round(hb*1.3);i++){
    const px2=Math.round(cx+(hash(i*31+hb)*2-1)*w*.85);
    const py=Math.round(gy-th-ch2*(0.30+hash(i*17+hb)*0.60));
    if(px2<0||px2>=CW||py<0||py>=CHh) continue;
    const o=(py*CW+px2)<<2; if(DD[o+3]) DD[o+3]=0;}
   q.putImageData(im,0,0);
  }
 }
 if(blaze&&hb>12){
  const bw=Math.max(1,Math.round(hb*.055)), bh2=Math.max(2,Math.round(hb*.11));
  q.fillStyle=_css(sh([248,250,254],.06));
  q.fillRect(cx-Math.ceil(bw/2),Math.round(gy-(sp==='fir'?hb*.11:hb*.40)*0.74)-bh2,bw,bh2);}
 if(TC.size>2400) TC.clear();
 TC.set(key,c); return c;
}

const UC=new Map();
function undergrowth(kind,s,B,s1,fogLv,alpLv,vb){
 vb=(vb|0)&3;
 const key=kind+'|'+s+'|'+alpLv+'|'+vb;
 let c=UC.get(key); if(c) return c;
 const alp=alpLv/4, SZ=Math.max(4,s*11);
 c=document.createElement('canvas'); c.width=SZ; c.height=SZ;
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const cx=SZ>>1, gy=SZ-1, F=c2=>_css(c2);
 const rock=_mix(B.rck,_rgb('#9c968a'),alp*.45);
 if(kind==='fern'){
  for(let b=-4;b<=4;b++){
   const hh=s*(5-Math.abs(b)*.9), lean=b*.5;
   q.fillStyle=F(sh(B.fer,b<0?.28:-.22));
   for(let i=0;i<hh;i++) q.fillRect(Math.round(cx+b*s+lean*i*.12),Math.round(gy-i),Math.max(1,s*.8),1);
   q.fillStyle=F(sh(B.fer,b<0?.42:-.05));
   q.fillRect(Math.round(cx+b*s+lean*hh*.12),Math.round(gy-hh),Math.max(1,s*.8),Math.max(1,s));}
 }else if(kind==='rock'){
  const rs=s*(1.6+alp*1.8);
  const LOB=[
   [[0,0,1.00,.74],[-.52,.20,.56,.44],[ .58,.14,.46,.38]],
   [[0,0,0.92,.82],[ .46,.22,.60,.46],[-.44,.26,.42,.34]],
   [[-.18,0,1.06,.68],[ .58,-.10,.52,.54],[ .10,.26,.66,.40]],
   [[0,0,1.12,.62],[-.40,-.26,.50,.48],[ .46,.12,.56,.44]]][vb];
  const by2=gy-rs*0.80;
  const ell=(dx,dy,rx,ry,col)=>{q.fillStyle=col;
   for(let i=-ry;i<=ry;i++){
    const yy=Math.round(by2+dy+i); if(yy>gy) continue;
    const w2=Math.round(rx*Math.sqrt(Math.max(0,1-(i/ry)*(i/ry))));
    if(w2>0) q.fillRect(Math.round(cx+dx-w2),yy,w2*2+1,1);}};
  /* the shadow it sits in */
  q.fillStyle='rgba(12,18,34,.34)';
  for(let i=-rs*.34;i<=rs*.34;i++){
   const w2=Math.round(rs*1.55*Math.sqrt(Math.max(0,1-(i/(rs*.34))*(i/(rs*.34)))));
   if(w2>0) q.fillRect(Math.round(cx+rs*.45-w2),Math.round(gy-rs*.12+i),w2*2,1);}
  const draw=(gx,gy3,shade)=>{for(const L of LOB)
   ell(L[0]*rs+gx,L[1]*rs+gy3,L[2]*rs,L[3]*rs,_css(sh(rock,shade)));};
  draw(0,0,-0.58);                          // outline / underside
  for(const L of LOB) ell(L[0]*rs,L[1]*rs-rs*.10,L[2]*rs*.94,L[3]*rs*.92,_css(sh(rock,-.12)));
  for(const L of LOB) ell(L[0]*rs-rs*.16,L[1]*rs-rs*.26,L[2]*rs*.70,L[3]*rs*.62,_css(sh(rock,.16)));
  for(const L of LOB) ell(L[0]*rs-rs*.28,L[1]*rs-rs*.40,L[2]*rs*.40,L[3]*rs*.34,_css(sh(rock,.42)));
  /* a fracture or two across the lit face */
  q.fillStyle=_css(sh(rock,-.34));
  for(let f=0;f<2;f++){
   const fy=by2-rs*(0.10+hash(vb*7+f+s)*0.55);
   q.fillRect(Math.round(cx-rs*(0.55+hash(f*31+s)*0.4)),Math.round(fy),
              Math.max(1,Math.round(rs*(0.6+hash(f*13+s)*0.5))),1);}
  if(alp<.45){                              /* moss on the uphill side */
   q.fillStyle=_css(sh(_mix(B.fer,_rgb('#6f8f3e'),.5),-.02));
   for(let i=0;i<3;i++)
    q.fillRect(Math.round(cx-rs*(0.9-i*0.3)),Math.round(by2-rs*(0.55-i*0.12)),
               Math.max(1,Math.round(rs*.45)),Math.max(1,Math.round(s*.7)));}
 }else if(kind==='bush'){
  const r=s*2.5;
  const cl=[[0,-r*.7,1],[-r*.7,-r*.45,.75],[r*.7,-r*.5,.7],[0,-r*1.15,.6]];
  const dr=()=>{for(const o of cl){const rr=Math.max(1,r*o[2]);
   for(let i=-rr;i<=rr;i++){const w2=Math.round(Math.sqrt(Math.max(0,rr*rr-i*i)));
    q.fillRect(Math.round(cx+o[0]-w2),Math.round(gy+o[1]+i),w2*2+1,1);}}};
  q.fillStyle=F(sh(B.cnp,-.52)); dr();
  q.fillStyle=F(sh(B.cnp,-.16)); cl.forEach(o=>o[2]*=.88); dr();
  q.fillStyle=F(sh(B.cnp,.26));  cl.forEach(o=>{o[0]-=r*.18;o[1]-=r*.16;o[2]*=.62;}); dr();
 }else if(kind==='log'){
  const lw=s*9, lh=Math.max(2,s*1.8);
  q.fillStyle=F(sh(B.trk,-.44)); q.fillRect(cx-lw/2,gy-lh,lw,lh);
  q.fillStyle=F(sh(B.trk,-.06)); q.fillRect(cx-lw/2,gy-lh,lw,Math.max(1,lh*.6));
  q.fillStyle=F(sh(B.trk,.24));  q.fillRect(cx-lw/2,gy-lh,lw,Math.max(1,lh*.28));
 }else{
  q.fillStyle=F(sh(B.fer,-.10)); q.fillRect(cx,gy-s*4,Math.max(1,s*.8),s*4);
  const fc=_rgb(hash(s*7)<.5?'#e8dc84':'#d892b8');
  q.fillStyle=F(sh(fc,-.20)); q.fillRect(cx-s,gy-s*5,s*3,s);
  q.fillStyle=F(sh(fc,.32));  q.fillRect(cx-s,gy-s*5,s*1.5,s);
 }
 if(UC.size>900) UC.clear();
 UC.set(key,c); return c;
}

/* ---------- landmarks ---------- */
function landmark(g,x,gy,sc,k,B){
 const s=Math.max(1,sc);
 const U=(a,b,w,h,col)=>{g.fillStyle=col;
  g.fillRect(Math.round(x+a*s),Math.round(gy+b*s),
   Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)));};
 const wood=_rgb('#6b4e2c'), stone=B.rck, gold='#f5c651';
 if(k==='shelter'||k==='town'){
  const wd=k==='town'?13:9, ht=k==='town'?6.5:5;
  U(-wd/2,-ht,wd,ht,_css(sh(wood,-.32)));
  U(-wd/2,-ht,wd*.42,ht,_css(sh(wood,.08)));
  for(let i=0;i<=wd+2;i++){const rr=-ht-Math.min(i,wd+2-i)*.8;
   U(-wd/2-1+i,rr,1.05,1.2,_css(sh(_rgb('#4a3621'),i<wd*.5?.16:-.24)));}
  U(-wd*.20,-ht*.80,wd*.40,ht*.80,_css(sh(_rgb('#1b1309'),-.1)));
  U(-wd/2,-ht*.46,wd,.6,_css(sh(wood,.24)));
  if(k==='town'){U(-wd*.34,-ht*.62,1.6,1.6,'#ffe9a8'); U(wd*.14,-ht*.62,1.6,1.6,'#ffe9a8');}
  else{U(wd*.36,-2.2,1.6,2.2,_css(sh(stone,-.2))); U(wd*.38,-3.0,1.2,1.0,'#e8773c');}
 }else if(k==='summit'||k==='mark'){
  for(let i=0;i<11;i++){const w=11-i;
   U(-w/2,-11+i,w,1.06,_css(sh(stone,-.32-i*.01)));
   U(-w/2,-11+i,w*.40,1.06,_css(sh(stone,.24)));}
  U(-.45,-17,1.1,6,_css(sh(wood,0)));
  U(-.45,-17,4.8,2.6,gold); U(.5,-16.3,3.2,1.2,'#8a5f12');
 }else if(k==='water'){
  for(let i=0;i<9;i++) U(-10+i*2.4,-((i%2)?1.6:.5),2.4,1.5,
   _css(sh(_rgb('#3d84ab'),(i%2)?-.22:.12)));
  U(-10,-1.9,20,.7,_css(sh(_rgb('#b6e2f2'),.22)));
 }else if(k==='border'){
  U(-.5,-17,1.3,17,_css(sh(wood,-.1)));
  U(.8,-17,9,5.6,gold); U(1.8,-15.5,7.2,2.6,'#6b4c0c');
 }else{
  U(-.5,-13,1.3,13,_css(sh(wood,-.08)));
  U(-5.2,-13,10.4,4.3,_css(sh(_rgb('#9a7840'),0)));
  U(-3.9,-11.8,7.8,1.6,_css(sh(_rgb('#2a1f12'),0)));
 }
}

const BACK=[
["...kkkk...","..kkkkkk..","..kwwwwk..","...hhhh...",".rrrrrrrr.","rrrrrrrrrr",

const BPAL={k:'#d4b070',w:'#8e7440',h:'#e0c396',r:'#d85c32',P:'#a8431f',
            b:'#6f2c18',l:'#364a60',L:'#2a3a4e',s:'#1a222e'};
function climber(g,x,y,s,f,lamp){
 const sp=BACK[f];
 g.fillStyle='rgba(12,16,26,.60)';
 for(let r=0;r<sp.length;r++)for(let c=0;c<sp[r].length;c++){
  if(sp[r][c]!=='.')continue;
  const n=(r>0&&sp[r-1][c]!=='.')||(r<sp.length-1&&sp[r+1][c]!=='.')
        ||(c>0&&sp[r][c-1]!=='.')||(c<sp[r].length-1&&sp[r][c+1]!=='.');
  if(n) g.fillRect(x+c*s,y+r*s,s,s);}
 for(let r=0;r<sp.length;r++)for(let c=0;c<sp[r].length;c++){
  const ch=sp[r][c]; if(ch==='.')continue;
  g.fillStyle=_css(sh(_rgb(BPAL[ch]),c<4?.22:c>6?-.24:0));
  g.fillRect(x+c*s,y+r*s,s,s);}
 g.fillStyle=_css(sh(_rgb('#8a6f42'),0));
 const sw=Math.max(1,Math.round(s*.6));
 g.fillRect(x-s,y+s*5,sw,s*11); g.fillRect(x+s*10,y+s*6,sw,s*10);
 if(lamp){
  g.fillStyle='rgba(255,241,200,.16)';
  for(let i=1;i<10;i++) g.fillRect(x+s*5-i*s,y-i*s*1.7,i*s*2,s*1.7);
  g.fillStyle='rgba(255,245,215,.9)'; g.fillRect(x+s*3,y+s*3,s*4,s);}
}

function sprite(g,rows,pal,x,y,s,flip){
 const w=rows[0].length;
 for(let r=0;r<rows.length;r++){const row=rows[r];
  for(let c=0;c<w;c++){const ch=row[c]; if(!ch||ch==='.')continue;
   const col=pal[ch]; if(!col)continue;
   g.fillStyle=col;
   g.fillRect(x+(flip?(w-1-c):c)*s,y+r*s,s,s);}}
}

const CLY=()=> Math.round(H*0.70);          // where the climber stands
const progress=()=> shownMi*RPM+drift;      // rows climbed
const camTopRow=()=> -progress()-CLY();     // world row at screen y = 0
const screenY=Y=> Y-camTopRow();

let fauna=[], motes=[], nextSpawn=0, pending=[];

function spawn(now,alp){
 const r=Math.random();
 const type=alp>.6 ? (r<.42?'hawk':r<.74?'goat':'bird')
                   : (r<.26?'deer':r<.42?'rabbit':r<.56?'fox':r<.68?'turkey':r<.87?'bird':'hawk');
 const air=(type==='bird'||type==='hawk');
 const top=camTopRow();
 const side=Math.random()<.5?-1:1;
 fauna.push({type,air,
  x:side<0?-14:W+14, Y:top+Math.random()*H*0.75,
  vx:-side*(7+Math.random()*16), vY:(Math.random()-.35)*9,
  born:Math.random()*6.28, flip:side>0});
 nextSpawn=now+2600+Math.random()*5200;
}

/* ---- cloud, seen from inside it ----
   There is no horizon, so weather cannot live in a sky. At this altitude
   it lives where you are: shadows crossing the ground under you and torn
   banks of cloud drifting over the camera. */
function drawCloudShadows(g,now,S2){
 if(!(S2.el>0.10)) return;
 for(let k=0;k<5;k++){
  const cw=W*(0.40+hash(k*29)*0.62), chh=H*(0.12+hash(k*61)*0.17);
  let cx=((hash(k*17)*W*2.4-now*0.0055)%(W+cw*1.3)); if(cx<-cw*1.2) cx+=W+cw*1.3;
  const cy=((hash(k*41)*H*1.6+now*0.0026)%(H*1.6))-chh*0.5;
  if(cy>H) continue;
  const sg=g.createRadialGradient(cx+cw/2,cy+chh/2,0,cx+cw/2,cy+chh/2,cw*0.55);
  const a2=0.30*Math.min(1,S2.el*1.6);
  sg.addColorStop(0,'rgba(16,24,48,'+a2.toFixed(3)+')');
  sg.addColorStop(0.55,'rgba(16,24,48,'+(a2*0.5).toFixed(3)+')');
  sg.addColorStop(1,'rgba(16,24,48,0)');
  g.fillStyle=sg; g.fillRect(Math.max(0,cx),Math.max(0,cy),cw,chh);
 }
}
function drawCloudBanks(g,now,S2){
 /* the cloud itself, torn and drifting between you and the mountain */
 const lit=_mix(_rgb('#ffffff'),_rgb('#ffcfa0'),S2.warm*0.8);
 const dim=_mix(lit,_rgb('#5f7099'),S2.dark*0.8);
 for(let k=0;k<3;k++){
  const cw=W*(0.62+hash(k*53)*0.7), chh=H*(0.07+hash(k*71)*0.09);
  let cx=((hash(k*23)*W*3.0-now*0.0135)%(W+cw*1.2)); if(cx<-cw*1.1) cx+=W+cw*1.2;
  const cy=((hash(k*37)*H*1.9+now*0.0042)%(H*1.9))-chh;
  if(cy>H||cy+chh<0) continue;
  const base=(0.045+hash(k*13)*0.045)*(1-S2.dark*0.45);
  for(let i=0;i<4;i++){
   const lw=cw*(0.30+hash(k*31+i*7)*0.42), lh=chh*(0.55+hash(k*17+i*5)*0.70);
   const lx=cx+hash(k*11+i*3)*cw*0.72, ly=cy+hash(k*41+i*9)*chh*0.5;
   const rg=g.createRadialGradient(lx+lw/2,ly+lh/2,0,lx+lw/2,ly+lh/2,Math.max(lw,lh)*0.55);
   rg.addColorStop(0,'rgba('+(lit[0]|0)+','+(lit[1]|0)+','+(lit[2]|0)+','+base.toFixed(3)+')');
   rg.addColorStop(0.5,'rgba('+(dim[0]|0)+','+(dim[1]|0)+','+(dim[2]|0)+','+(base*0.5).toFixed(3)+')');
   rg.addColorStop(1,'rgba('+(dim[0]|0)+','+(dim[1]|0)+','+(dim[2]|0)+',0)');
   g.fillStyle=rg; g.fillRect(lx,ly,lw,lh);}
 }
}

function paint(now,dt){
 const g=ctx;
 const mi=shownMi, B=biomeAt(Math.max(0,mi)), alp=alpineAt(Math.max(0,mi));
 const top=camTopRow();
 const S2=solar();
 const night=S2.dark, dusk=S2.warm*(S2.day?1:0.6);

 /* ---- the mountain you are on, blitted from baked chunks ---- */
 const c0=Math.floor(top/CH), c1=Math.floor((top+H)/CH);
 for(let ci=c0;ci<=c1;ci++) g.drawImage(chunkAt(ci),0,Math.round(ci*CH-top));

 drawCloudShadows(g,now,S2);

 /* ---- the next landmark gets a beacon you can see coming ---- */
 for(const L of TRAIL){
  if(L.m<=mi) continue;
  const sy=screenY(rowOfMile(L.m));
  if(sy<-30||sy>H) continue;
  const side=hash(Math.round(L.m*10))<0.5?-1:1;
  const lx=Math.round(pathX(rowOfMile(L.m))+side*pathW()*2.2);
  const pul=.5+.5*Math.sin(now/330);
  g.fillStyle='rgba(245,198,81,'+(pul*.9).toFixed(2)+')';
  g.fillRect(lx,Math.round(sy-16),1,4);
  g.fillStyle='rgba(245,198,81,'+(pul*.22).toFixed(2)+')';
  g.fillRect(lx-2,Math.round(sy-18),5,8);
  break;
 }

 /* ---- wildlife, live, sorted so the near ones pass in front ---- */
 fauna.sort((a,b)=>a.Y-b.Y);
 for(const A of fauna){
  const sy=screenY(A.Y); if(sy<-20||sy>H+20) continue;
  const F=FAUNA[A.type];
  let rows=F.r;
  if(A.type==='bird'&&Math.sin(now/90+A.born)>0) rows=BIRD2;
  const ss=Math.max(1,Math.round(F.s*1.5));
  const run=A.air?Math.sin(now/80+A.born)*ss*1.4
                 :(A.type==='rabbit'?Math.abs(Math.sin(now/95+A.born))*ss*2.2
                                    :Math.abs(Math.sin(now/130+A.born))*ss*.7);
  if(!A.air){g.fillStyle='rgba(10,14,28,.30)';
   g.fillRect(Math.round(A.x),Math.round(sy),rows[0].length*ss,Math.max(1,ss));}
  sprite(g,rows,F.p,Math.round(A.x),Math.round(sy-ss*rows.length-run),ss,A.flip);
 }

 /* ---- the climber ---- */
 {const Yc=-progress(), cx=pathX(Yc), cy=CLY();
  const s=Math.max(2,Math.round(W/82));
  const bob=Math.round(Math.sin(walkPhase*2)*s*.6);
  g.fillStyle='rgba(10,16,30,.34)';
  g.fillRect(Math.round(cx-s*3),Math.round(cy-s*.4),s*10,Math.max(1,Math.round(s*1.2)));
  climber(g,Math.round(cx-s*5),Math.round(cy-s*16+bob),s,[0,1,0,2][(walkPhase|0)%4],night>.45);}

 /* ---- weather ---- */
 for(const p of motes){ g.fillStyle=p.c; g.fillRect(p.x|0,p.y|0,p.s,p.s); }
 if(alp>.45){
  for(let k=0;k<120;k++){
   const t=(now/1400+hash(k*13))%1;
   const x=((hash(k*7)*W*1.5-t*W*1.5)%W+W)%W;
   const y=(hash(k*31)*H+t*H*.45)%H;
   g.fillStyle='rgba(248,252,255,'+(0.10+0.30*hash(k*5)).toFixed(2)+')';
   g.fillRect(x|0,y|0,1,hash(k*3)<.3?2:1);}
 }

 /* ---- distance ----
    There is no horizon. Everything that sells depth is here: a haze that
    thickens toward the top of the frame, so the far ridges sit back
    without a single extra thing being drawn. */


 /* ---- the hour, as a wash over everything ---- */
 /* the hour, washed over the ground only: the sky already has it */
 if(night>0.02){
  g.fillStyle='rgba(16,26,60,'+(night*0.60).toFixed(3)+')';
  g.fillRect(0,0,W,H);
  g.fillStyle='rgba(88,118,198,'+(night*0.09).toFixed(3)+')';
  g.fillRect(0,0,W,H);
 }
 if(dusk>0.02){
  g.fillStyle='rgba(255,150,80,'+(dusk*0.20).toFixed(3)+')';
  g.fillRect(0,0,W,H);
 }
 /* sun raking across, only in the middle of the day */
 if(S2.day&&S2.el>0.18){
  const lean=(S2.x-0.5)*W*0.9;
  for(let k=0;k<3;k++){
   const xx=((hash(k*211)*W*1.7-progress()*.10)%(W+160)+W+160)%(W+160)-80;
   const lg=g.createLinearGradient(xx,0,xx+lean*0.5,H);
   lg.addColorStop(0,'rgba(255,246,214,0)');
   lg.addColorStop(0.42,'rgba(255,246,214,'+(0.10*S2.el).toFixed(3)+')');
   lg.addColorStop(1,'rgba(255,246,214,0)');
   g.fillStyle=lg; g.fillRect(Math.max(0,xx-12),0,W*0.32,H);}
 }

 drawCloudBanks(g,now,S2);

 /* ---- vignette ---- */
 const vw=Math.round(W*0.13);
 let vg2=g.createLinearGradient(0,0,vw,0);
 vg2.addColorStop(0,'rgba(8,12,24,0.42)'); vg2.addColorStop(1,'rgba(8,12,24,0)');
 g.fillStyle=vg2; g.fillRect(0,0,vw,H);
 vg2=g.createLinearGradient(W,0,W-vw,0);
 vg2.addColorStop(0,'rgba(8,12,24,0.42)'); vg2.addColorStop(1,'rgba(8,12,24,0)');
 g.fillStyle=vg2; g.fillRect(W-vw,0,vw,H);
 vg2=g.createLinearGradient(0,H,0,H-Math.round(H*0.08));
 vg2.addColorStop(0,'rgba(8,12,24,0.38)'); vg2.addColorStop(1,'rgba(8,12,24,0)');
 g.fillStyle=vg2; g.fillRect(0,H-Math.round(H*0.08),W,Math.round(H*0.08));
}

/* ---------- motion ---------- */
function step(dt,now){
 const target=miles(), d=target-shownMi;
 /* The mountain keeps moving when you have banked nothing. This is a
    screen you leave open, and a climber standing still is a dead screen.
    The mile count underneath is still only ever your real steps.
    Thirteen rows a second is a walk: a screen height takes half a minute. */
 surge=Math.max(0,surge-dt*.00070);
 drift+=(9+surge*300)*dt/1000;
 if(Math.abs(d)>0.0004) shownMi+=d*Math.min(1,dt/900);
 walkPhase+=dt/190*(1+surge*4.5);

 /* build at most one chunk per frame, so a new one never costs a hitch */
 if(pending.length){
  const ci=pending.shift();
  if(!CHUNK.has(ci)) CHUNK.set(ci,buildChunk(ci));
 }

 const night=solar().dark;
 const alp=alpineAt(Math.max(0,shownMi));
 if(now>nextSpawn) spawn(now,alp);
 const top=camTopRow();
 for(const A of fauna){ A.x+=A.vx*dt/1000; A.Y+=A.vY*dt/1000; }
 fauna=fauna.filter(A=>A.x>-40&&A.x<W+40&&A.Y>top-60&&A.Y<top+H+60).slice(-10);

 if(night>.45&&alp<.5){
  if(Math.random()<dt/300&&motes.length<34)
   motes.push({x:Math.random()*W,y:H*.35+Math.random()*H*.6,vx:(Math.random()-.5)*8,
    vy:(Math.random()-.5)*6,s:1,life:2800+Math.random()*2800,t:0,c:'rgba(190,255,140,.9)'});
  for(const p of motes){ p.t+=dt;
   p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000;
   p.vx+=(Math.random()-.5)*12*dt/1000; p.vy+=(Math.random()-.5)*10*dt/1000;
   const a=Math.max(0,Math.sin(p.t/p.life*Math.PI))*(0.45+0.55*Math.sin(p.t/160));
   p.c='rgba(200,255,152,'+a.toFixed(2)+')';}
  motes=motes.filter(p=>p.t<p.life);
 }else if(alp<.5){
  if(Math.random()<dt/420&&motes.length<22)
   motes.push({x:Math.random()*W,y:-2,vx:-5-Math.random()*11,vy:11+Math.random()*16,s:1,
    t:0,life:9e9,c:Math.random()<.5?'rgba(214,160,72,.85)':'rgba(166,186,116,.75)'});
  for(const p of motes){ p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; p.x+=Math.sin(p.y/8)*.4; }
  motes=motes.filter(p=>p.y<H+3&&p.x>-5&&p.life>1e9);
 }else motes.length=0;
}

function roll(tier){
 const r=Math.random()+tier*0.11;
 const i=r>1.30?4:r>1.05?3:r>0.78?2:r>0.42?1:0;
 const kinds=Object.keys(LOOT), k=kinds[(Math.random()*kinds.length)|0];

/* the whole reveal, on one timeline, in milliseconds */
const T_DROP=420, T_SHAKE=1750, T_BURST=1900, T_RISE=2700, T_SETTLE=3150;
function fxFrame(now){
 if(!anim) return;
 const r=fx.getBoundingClientRect();
 const w=r.width||fx.clientWidth||innerWidth, h=r.height||fx.clientHeight||innerHeight;
 const FW=Math.max(8,Math.ceil(w/PX)), FH=Math.max(8,Math.ceil(h/PX));
 if(fx.width!==FW||fx.height!==FH){fx.width=FW;fx.height=FH;}
 fg.imageSmoothingEnabled=false; fg.clearRect(0,0,FW,FH);
 const t=now-anim.t0, R=anim.R, col=_rgb(R[1]);
 /* the chest sits in the middle of the room left above the caption,
    so the lid and the item always have somewhere to go */
 const info=document.querySelector('.cinfo');
 const capTop=info?Math.max(FH*0.52,(info.getBoundingClientRect().top-r.top)/PX):FH*0.62;
 const cx=Math.round(FW/2), cy=Math.round(capTop-FH*0.06);
 const S=Math.max(2,Math.round(Math.min(FW/22,FH/34)));

 /* --- 1. it falls in and lands --- */
 let dy=0, squash=0;
 if(t<T_DROP){ const p=t/T_DROP; dy=-(1-p)*(1-p)*Math.min(FH*.45,cy-S*6); }
 else if(t<T_DROP+140){ const p=(t-T_DROP)/140; squash=Math.sin(p*Math.PI)*.45; }

 /* --- 2. it shakes, harder and harder, and light leaks out --- */
 let sx=0, lid=0, glow=0;
 if(t>T_DROP && t<T_SHAKE){
  const p=(t-T_DROP)/(T_SHAKE-T_DROP);
  sx=Math.sin(t/(46-p*30))*S*(.18+p*.85);
  glow=p*p;
  if(p>.55) lid=(p-.55)/.45*0.30;
 }
 /* --- 3. the lid goes, and the flash --- */
 if(t>=T_SHAKE && t<T_BURST){ const p=(t-T_SHAKE)/(T_BURST-T_SHAKE); lid=.30+p*1.4; glow=1; }
 if(t>=T_BURST){ lid=1.7; glow=1; }

 /* flash ring */
 if(t>T_SHAKE-60 && t<T_SHAKE+320){
  const p=Math.max(0,Math.min(1,(t-(T_SHAKE-60))/380));
  fg.fillStyle='rgba(255,255,255,'+((1-p)*.85).toFixed(2)+')';
  const r=p*FW*.9;
  fg.fillRect(cx-r/2,cy-r/2*.5,r,r*.5);
 }

 /* --- the beam --- */
 if(glow>0){
  const bw=Math.max(1,Math.round(S*(1.2+glow*2.4)));
  for(let i=0;i<10;i++){
   const a=(glow*(.22-i*.02)*(0.6+0.4*Math.sin(now/180+i))).toFixed(3);
   fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a+')';
   fg.fillRect(cx-bw/2-i*2,cy-S*2-i*S*1.1,bw+i*4,S*2+i*S*1.1);
  }
 }

 /* --- the chest itself ---
    Planked body, iron bands, a lock plate, and a half-round lid hinged at
    the back. Drawn as pixel art rather than as stacked rectangles, because
    this is the thing the whole animation is about. */
 const by=cy+dy;
 const woodD=_rgb('#3f2714'), woodM=_rgb('#7a5430'), woodL=_rgb('#a37747');
 const iron =_rgb('#4a4a58'),  ironL=_rgb('#9a9aae'), out=_rgb('#17110a');
 const bw=Math.round(S*7)|1, bh=Math.round(S*4.2*(1-squash)+S*4.2*squash*0.55);
 const RC=(x,y,w,h,c2)=>{fg.fillStyle=_css(c2);
  fg.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
 const drawBox=()=>{
  const x0=cx-bw/2+sx, y0=by-bh;
  RC(x0-1,y0-1,bw+2,bh+2,out);
  for(let i=0;i<bw;i++){
   const plank=Math.floor(i/Math.max(1,S*1.4))%2;
   const edge=(i%Math.max(1,Math.round(S*1.4))===0);
   let c2=plank?woodM:_mix(woodM,woodL,.35);
   if(edge) c2=woodD;
   for(let j=0;j<bh;j++){
    const v=j/bh;
    RC(x0+i,y0+j,1,1,_mix(c2,v>0.78?woodD:_mix(c2,woodL,(1-v)*0.30),v>0.78?0.7:0.4));}
  }
  /* iron bands and the corner straps */
  RC(x0,y0,Math.max(1,S*.7),bh,iron); RC(x0,y0,Math.max(1,S*.7),Math.max(1,bh*.4),ironL);
  RC(x0+bw-S*.7,y0,Math.max(1,S*.7),bh,iron);
  RC(x0+bw-S*.7,y0,Math.max(1,S*.7),Math.max(1,bh*.4),_mix(iron,ironL,.5));
  RC(x0,y0+bh-S*.5,bw,Math.max(1,S*.5),_mix(iron,out,.45));
  /* the lock plate, in the rarity colour */
  const lw=Math.max(2,S*1.7);
  RC(cx-lw/2+sx,by-bh*.62,lw,lw*.95,_css?_mix(col,out,.35):col);
  RC(cx-lw/2+sx,by-bh*.62,lw,Math.max(1,lw*.34),_lite(col,.40));
  RC(cx-lw*.17+sx,by-bh*.62+lw*.30,Math.max(1,lw*.34),Math.max(1,lw*.40),out);
 };
 const lidOpen=Math.max(0,Math.min(1,lid/1.55));
 const drawLid=()=>{
  const lh=Math.max(2,Math.round(S*2.6*(1-lidOpen*0.80)));
  const ly=Math.round(by-bh-lh-lidOpen*S*1.6);
  const x0=cx-bw/2+sx;
  for(let j=0;j<lh;j++){
   const u=j/lh;                                  // 0 at the crown
   const w2=Math.round(bw*0.5*Math.sqrt(Math.max(0,1-u*u*0.72)));
   const yy=ly+j;
   fg.fillStyle=_css(out); fg.fillRect(cx+sx-w2-1,yy,w2*2+3,1);
   for(let i=-w2;i<=w2;i++){
    const lat=(i+w2)/(2*w2+.001);
    let c2=_mix(woodM,woodL,(1-u)*0.46+(1-lat)*0.34);
    if(Math.floor((i+w2)/Math.max(1,S*1.4))%2) c2=_mix(c2,woodD,.22);
    fg.fillStyle=_css(c2); fg.fillRect(cx+sx+i,yy,1,1);}
  }
  fg.fillStyle=_css(iron);
  fg.fillRect(cx+sx-Math.max(1,S*.8),ly,Math.max(2,S*1.6),lh);
  fg.fillStyle=_css(_lite(col,.34));
  fg.fillRect(cx+sx-Math.max(1,S*.5),ly,Math.max(1,S*1.0),lh);
  fg.fillStyle=_css(ironL);
  fg.fillRect(cx+sx-Math.max(1,S*.8),ly,Math.max(2,S*1.6),1);
  fg.fillStyle=_css(out); fg.fillRect(x0-1,ly+lh,bw+2,1);
 };
 /* the dark inside, revealed as the lid lifts */
 const drawInside=()=>{
  if(lidOpen<0.08) return;
  const ih=Math.round(S*1.9*lidOpen);
  fg.fillStyle=_css(_mix(out,[0,0,0],.4));
  fg.fillRect(cx-bw/2+sx+Math.round(S*.7),by-bh-ih,bw-Math.round(S*1.4),ih+1);
  fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(0.5*lidOpen).toFixed(2)+')';
  fg.fillRect(cx-bw/2+sx+Math.round(S*.9),by-bh-Math.max(1,ih*.5),bw-Math.round(S*1.8),Math.max(1,ih*.5));
 };
 /* light spilling out of an open chest, from behind the lid */
 if(lidOpen>0.18){
  const op=Math.min(1,(lidOpen-0.18)/0.6), BH=S*11;
  for(let j=0;j<BH;j++){
   const u=j/BH;
   const w2=Math.round(bw*0.46*(1-u*0.30));
   const a2=op*0.42*Math.pow(1-u,1.5);
   fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a2.toFixed(3)+')';
   fg.fillRect(cx+sx-w2,Math.round(by-bh-j),w2*2,1);}
 }
 /* once it is open the lid sits behind the box */
 if(lidOpen>0.3){ drawLid(); drawInside(); drawBox(); }
 else { drawBox(); drawLid(); }
 /* dust kicked up on landing */
 if(t>T_DROP&&t<T_DROP+420){
  const p=(t-T_DROP)/420;
  fg.fillStyle='rgba(190,178,160,'+((1-p)*.55).toFixed(2)+')';
  for(let i=0;i<14;i++){
   const a2=(i/14)*Math.PI*2, rr=p*S*7*(0.5+hash(i*13)*0.8);
   fg.fillRect(Math.round(cx+Math.cos(a2)*rr),Math.round(by-p*S*2.2*hash(i*7)),
               1+(hash(i*3)<.3?1:0),1);}
 }

 /* --- the item rises out, glowing --- */
 if(t>T_BURST){
  const p=Math.min(1,(t-T_BURST)/(T_RISE-T_BURST));
  const e=1-Math.pow(1-p,3);
  const hover=(t>T_RISE)?Math.sin((t-T_RISE)/420)*S*.4:0;
  const iy=by-bh-e*S*6.4+hover;
  const sp=ICON[anim.d.kind]||ICON.trinket, IS=Math.max(1,Math.round(S*.50*e));
  /* a halo in the rarity colour, as a real radial glow */
  const rg=fg.createRadialGradient(cx,iy-IS*6,0,cx,iy-IS*6,IS*13);
  rg.addColorStop(0,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(.55*e).toFixed(3)+')');
  rg.addColorStop(.45,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(.18*e).toFixed(3)+')');
  rg.addColorStop(1,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+',0)');
  fg.fillStyle=rg; fg.fillRect(cx-IS*14,iy-IS*20,IS*28,IS*28);
  for(let r=0;r<sp.length;r++)for(let c=0;c<sp[r].length;c++){
   const ch=sp[r][c]; if(ch==='.')continue;
   let ic=_rgb(IPAL[ch]||'#f2f5fb');
   if(ch!=='o') ic=_mix(ic,col,.34);                 // rarity tints the metal
   fg.fillStyle=_css(ic);
   fg.fillRect(cx-IS*6+c*IS,iy-IS*12+r*IS,IS,IS);}

  /* sparkles orbiting it */
  if(!anim.sp.length) for(let i=0;i<26;i++)
   anim.sp.push({a:Math.random()*6.28,r:S*(1.2+Math.random()*3.4),
                 v:(Math.random()<.5?-1:1)*(.6+Math.random()*1.5),
                 o:Math.random()*6.28,s:Math.random()<.3?2:1});
  for(const q of anim.sp){
   const ang=q.a+(t-T_BURST)/900*q.v;
   const rr=q.r*(0.6+0.4*Math.sin(ang*2+q.o));
   const px=cx+Math.cos(ang)*rr, py=iy-IS*6+Math.sin(ang)*rr*.55;
   fg.fillStyle='rgba(255,255,255,'+(.25+.55*Math.abs(Math.sin(ang+q.o))).toFixed(2)+')';
   fg.fillRect(px|0,py|0,q.s,q.s);}
 }

 /* --- the text, after the item has arrived --- */
 if(t>T_SETTLE && !anim.done){
  anim.done=true;
  document.getElementById('crar').classList.add('show');
  setTimeout(()=>document.getElementById('citem').classList.add('show'),180);
  setTimeout(()=>document.getElementById('ckind').classList.add('show'),340);
  setTimeout(()=>document.getElementById('cok').classList.add('show'),560);
 }
 requestAnimationFrame(fxFrame);
}
document.getElementById('cok').onclick=()=>{
 chestQ.shift(); anim=null;
 document.getElementById('chest').classList.remove('open');
 if(chestQ.length) setTimeout(startChest,260);
};

/* ---------- hud ---------- */
function hud(){
 const mi=miles();
 document.getElementById('mile').textContent=mi.toFixed(1);
 document.getElementById('biome').textContent=biomeAt(mi).name;
 document.getElementById('today').textContent=S.today.toLocaleString();
 document.getElementById('day').textContent=S.day;
 let prev={m:0}, next=null;
 for(const L of TRAIL){ if(L.m<=mi) prev=L; else {next=L;break;} }
 if(next){
  document.getElementById('nextname').textContent=next.n;
  document.getElementById('nextdist').textContent=(next.m-mi).toFixed(1)+' MI';
  document.getElementById('fill').style.width=
   Math.max(0,Math.min(100,((mi-prev.m)/Math.max(.01,next.m-prev.m))*100)).toFixed(1)+'%';
 }else{
  document.getElementById('nextname').textContent='TRAIL END (PROTOTYPE)';
  document.getElementById('nextdist').textContent='—';
  document.getElementById('fill').style.width='100%';
 }
}
function addSteps(n){
 const before=miles(); S.steps+=n; S.today+=n; const after=miles();
 for(const L of TRAIL)
  if(L.m>before && L.m<=after && S.opened.indexOf(L.m)<0){S.opened.push(L.m);chestQ.push(L);}
 surge=Math.min(.55,surge+n/22000);
 save(); hud();
 if(chestQ.length && !anim) setTimeout(startChest,1100);
}
document.getElementById('b1k').onclick=()=>addSteps(1000);
document.getElementById('b5k').onclick=()=>addSteps(5000);
document.getElementById('bday').onclick=()=>{
 S.day++; S.today=0; save(); addSteps(3000+((Math.random()*6000)|0));};
document.getElementById('brst').onclick=()=>{
 S={steps:0,today:0,day:1,opened:[]}; chestQ=[]; anim=null; shownMi=0; drift=0; save(); hud();};

/* ---------- loop ---------- */
let last=performance.now();
let _errs=0;
function frame(now){
 const dt=Math.min(60,now-last); last=now;
 try{ step(dt,now); paint(now,dt); }
 catch(e){ if(_errs++<3) console.error('frame',e); }
 requestAnimationFrame(frame);
}
resize(); hud(); addEventListener('resize',resize);
requestAnimationFrame(frame);
</script>
</body>
