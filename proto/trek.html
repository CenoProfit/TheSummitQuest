/* ---------- motion ---------- */
function step(dt,now){
 const target=miles(), d=target-shownMi;
 /* The mountain keeps coming while you watch. The mile count underneath
    is still only ever your real steps. */
 surge=Math.max(0,surge-dt*.00070);
 /* Drift is the camera running a little ahead of your real mileage so
    the world keeps moving while you watch. It used to only ever grow,
    with nothing to pull it back, so after a minute of looking at the
    screen the camera was hundreds of units past where your steps had
    taken you. Everything in the world is drawn against camY and keyed
    off real miles, so the whole scene slid out of step with the mile
    count: landmark signs went by before their chest fired, and a boss
    came up the trail, passed, and vanished with no fight, because the
    fight triggers on steps and the picture had left them behind.

    It is eased back now. Steps still shove it forward, which is the
    part that reads as walking, and it settles to a couple of dozen
    units instead of running away. */
 drift+=(15+surge*620)*dt/1000;
 drift-=drift*Math.min(1,dt*0.00055);
 if(drift>150) drift=150;
 if(Math.abs(d)>0.0004){
  const was=shownMi;
  shownMi+=d*Math.min(1,dt/900);
  /* On a big catch up the walker covers a good part of a mile a frame,
     enough to step right over a landmark and leave its sign behind him
     before the chest is checked. If this frame would carry him past the
     next waiting chest, he stops level with it instead, and chestWatch
     opens it on the next frame. Only when he was short of it to begin
     with, so a chest held back by a fight card never freezes the view.
     While a chest is open it is chestQ[0], and the one to stop at is the
     one after it: he keeps walking under the card, and used to be past
     the next sign by the time it closed. */
  const nxC=chestQ[anim?1:0];
  if(nxC){
   const stop=(nxC.m*RPM-drift-walkAt)/RPM;
   if(was<=stop&&shownMi>stop) shownMi=stop;
  }
 }
 walkPhase+=dt/330*(1+surge*4.5);
 const camY=camWY(), camX=trailX(camY);
 /* Exactly as much tilt as it takes to bring the walker's own patch
    of trail back to where he belongs on screen, and no more.
    The first try took the gradient ahead and multiplied it by the
    focal length. That is the right physics and the wrong control: FOC
    is max(H*FOCV, W*0.62), so on a wide window it is three times what
    it is on a narrow one, and the same hillside asked for three times
    the tilt and pinned the view at the cap. The whole screen became
    far-off ground and the haze ate it.
    So ask the question that actually matters instead: where would the
    trail under his feet land if the camera were level, and how far is
    that from where he should be? Pitching by p moves the ground down
    the frame by p and the mark he should stand on by 0.34p, so it
    closes the gap at 0.66 per pixel. Flat ground answers zero by
    construction, whatever the window. */
 {const hz0=HZN0(), FOCp=Math.max(H*FOCV,W*0.62);
  const d0=Math.max(34,EYE*FOCp/(0.62*(H-hz0)));
  const wy0=camY-d0, camZ0=terrainH(camX,camY)+EYE;
  const sy0=hz0+(camZ0-terrainH(trailX(wy0),wy0))*(FOCp/d0);
  const gap=sy0-(hz0+0.66*(H-hz0));
  const tgt=Math.max(0,Math.min(H*0.26,gap/0.66));
  pitch+=(tgt-pitch)*Math.min(1,dt*0.0035);}
 const alp=alpineAt(Math.max(0,shownMi));
 if(now>nextSpawn) spawn(now,alp,camX,camY);
 for(const A of fauna){
  A.wx+=A.vx*dt/1000; A.wy+=A.vy*dt/1000;
  A.ty+=A.vty*dt/1000;                        // a slow rise and fall
  /* Measured against the UNTILTED horizon. Taken from the tilted one
     the band collapsed as the camera pitched into a descent, from 59
     pixels of sky down to about 22, and every bird in the air snapped
     into that strip at once. */
  const lo=HZN0()*0.44, hi=HZN0()*0.95;
  if(A.ty<lo){A.ty=lo; A.vty=Math.abs(A.vty);}
  if(A.ty>hi){A.ty=hi; A.vty=-Math.abs(A.vty);}
 }
 fauna=fauna.filter(A=>Math.abs(A.wx-camX)<420&&(camY-A.wy)>0&&(camY-A.wy)<520).slice(-8);
}

function _seedrnd(seed){ let x=seed>>>0;
 return ()=>{ x=(Math.imul(x,1664525)+1013904223)>>>0; return x/4294967296; }; }
/* Where they stand. Built once, far enough ahead to cover anything the
   prototype can reach, and nudged clear of a landmark so a boss and a
   chest never land on the same step. */
const BSCHED=(()=>{
 const r=_seedrnd(0x5EED17), out=[]; let m=1.1, last=-1;
 while(m<TOTAL-3){
  let elig=[]; for(let i=0;i<BOSS.length;i++) if(BOSS[i].at*TOTAL<=m) elig.push(i);
  if(!elig.length) elig=[BOSS.findIndex(B=>B.tier===1)];
  elig.sort((a,b)=>BOSS[a].tier-BOSS[b].tier);
  /* never the same thing twice running, as long as there is a choice */
  if(elig.length>1) elig=elig.filter(i=>i!==last);
  /* About one in six is something from further up the trail that has
     come down. Without this the tier gate and the gear curve rise
     together and nothing ever gets away from you: 73 fights in the
     first 110 miles, 73 wins. This is where the losses live. */
  if(r()<0.30){
   const ceil=Math.max.apply(null,elig.map(i=>BOSS[i].tier));
   const over=BOSS.map((b,i)=>i).filter(i=>BOSS[i].tier>ceil)
                  .sort((a,b)=>BOSS[a].tier-BOSS[b].tier).slice(0,2);
   if(over.length) elig=over;
  }
  /* Weighted to the strongest thing that lives this far up the trail,
     but weighted, not sliced. The old form indexed into the eligible
     list by a fraction of its length, so once the whole roster was
     unlocked the bottom three of it could not come up at all: three of
     the eight were only ever seen in the first eighty miles. */
  let W=0; const w=elig.map((_,j)=>{
   const v=Math.exp(1.4*j/Math.max(1,elig.length-1)); W+=v; return v; });
  let rr=r()*W, k=0;
  for(;k<w.length-1;k++){ rr-=w[k]; if(rr<0) break; }
  last=elig[k];
  let mm=m, guard=0;
  while(guard++<6 && TRAIL.some(L=>Math.abs(L.m-mm)<0.30)) mm+=0.40;
  out.push({m:Math.round(mm*100)/100, b:elig[k]});
  m=mm+0.95+r()*0.95;
 }
 return out;
})();
/* A fight begins when the thing is this close, not when you are standing
   on its mile. The approach is drawn down to 330 units and the fight
   holds it at 330 and closes from there, so the two have to meet. They
   did not: the fight waited for the mile itself, and for the last 270
   steps of every approach the boss was simply not drawn. It grew out of
   the haze, vanished, and came back later as a fight. */

function nextBoss(mi){ for(const B of BSCHED) if(B.m>mi) return B; return null; }

/* ---- how a fight goes ----
   Damage is quoted per hundred steps because that is the unit a walker
   thinks in, and divided down at the point of use. */
/* The constants here are the whole difficulty curve. Small ones mean
   the margin in a fight goes as the CUBE of what you are wearing, so
   the game flips from losing everything to winning everything over
   about eighty points of gear with no middle to it. Bigger ones mean
   kit still matters and still runs out of road: a starting walker
   takes about a third of his fights, a half dressed one about half,
   and the best kit in the game about nine in ten. */
function myDPS(t){ return 30+(t.atk*0.55+t.mag*0.45)*(1+t.spd/210); }
function myVigour(t){ return 400+t.def*5.6; }
/* Eight creatures have to cover 2,197 miles, so the same creature is
   bigger the further north you meet it. Without this the roster tops
   out around mile 25 and nothing ever gets away again: 79 fights in the
   first 110 miles, one loss. Both curves flatten, because a full set of
   legendaries is only about twice a starting walker and an uncapped
   ramp would mean losing every fight in Virginia. */
/* Tuned over 30 simulated thru hikes against a target curve: a third
   of fights won on starting kit, about half at half a set, seven in
   ten at three quarters, and nine in ten on a full one. The Wyrm is
   the far end of it at three in four with the best kit in the game and
   nothing at all without. */
/* Nearly flat on purpose. The old curve multiplied a boss by 3.6 over
   the first 730 miles while the gear curve was finished by mile 70, so
   the walk got harder every mile after that and the last thousand of
   them were unwinnable. WHICH creature turned up is the difficulty
   now, and the schedule above is what decides that. */

function bossATK(B,mi){ return B.atk*(1+Math.min(1.2,mi/3500)); }

['Copper Golem','pet',2,8,'copper','leather','metal','arcane'],
['Peregrine','pet',2,5,'steel','leather','feather','bone'],
['Emberfrog','pet',2,2,'ember','leather','skin','arcane'],
['Quartz Titan','pet',3,8,'mithril','leather','stone','arcane'],
['Storm Eagle','pet',4,6,'storm','leather','feather','arcane'],
['Frost Wyrmling','pet',4,9,'frost','leather','scale','leather'],
['Cinder Drake','pet',4,9,'ember','leather','scale','leather']];

/* a stable id, so a save survives the list being reordered */
const GID=g=>g[1][0]+g[0].toLowerCase().replace(/[^a-z0-9]/g,'');
const BYID={}; GEAR.forEach((g,i)=>{g.id=GID(g); g.n=i; BYID[g.id]=g;});
const DARK=[12,11,18];

/* Three ramps, each running dark to light, out of the two materials a
   piece is made of: what it is, and what you hold it by.

   q d e A B W V   the body
   x c C Y Z       the brass, the gem, the glow
   j g G H K       the wood or the leather
   o n             the ink line and the soft edge under it

   Four tones was a cartoon. The boss art in the main game carries sixty
   colours a sprite; this is how far a palette-swapped system can go in
   the same direction, and it is far enough that a cuirass now has a
   lit shoulder and a shadowed waist instead of one flat grey. */
function tones(g){
 const P=PAL[g[4]].map(_rgb), Q=(PAL[g[5]]||PAL.leather).map(_rgb);
 const A=P[0], B=P[1], C=P[2];
 return {
  o:_mix(A,DARK,.88), n:_mix(A,DARK,.66),
  q:_mix(A,DARK,.54), d:_mix(A,DARK,.34), e:_mix(A,DARK,.15),
  A:A, B:B, W:_lite(B,.42), V:_lite(B,.76),
  x:_mix(C,DARK,.56), c:_mix(C,DARK,.27), C:C, Y:_lite(C,.32), Z:_lite(C,.66),
  j:_mix(Q[0],DARK,.56), g:_mix(Q[0],DARK,.30), G:Q[0], H:Q[1], K:_lite(Q[1],.42),
  u:[132,94,70], m:[196,148,114], M:[228,190,158]
 };
}
/* ===================================================================
   DRAWING A PIECE

   Crisp pixel art, which means the sprite carries its own shading and
   the renderer adds nothing. An earlier version of this file upscaled a
   small mask and synthesised the form with a bevel, a specular and a
   procedural material texture. It was the wrong aesthetic: it produced
   smooth plastic objects, and a plastic sword next to a pixel world
   reads as a mistake rather than a style.

   So the sprites are authored at 64x64 with an explicit tone ramp, and
   this does nothing but map a character to a colour. Two tones of metal
   plus a highlight, two tones of grip, and an accent for the brass. The
   palette per item is what makes a hundred pieces out of forty shapes.
   =================================================================== */
/* A 64x64 sprite is 4096 characters and most of them are nothing, so
   the table is stored run length encoded as <char><count> and unpacked
   once, on first use. */
const SPC=new Map();
function _unrle(s){
 let out='', i=0;
 while(i<s.length){
  const c=s[i++]; let n=0, has=false;
  while(i<s.length){const d=s.charCodeAt(i); if(d<48||d>57) break; n=n*10+(d-48); i++; has=true;}
  out+=c.repeat(has?n:1);
 }
 return out;
}
function spriteRows(g,alt){
 const pet=(alt&&g[1]==='pet');
 const key=pet?('p#'+g[3]):(g[1]+'#'+g[3]);
 const hit=SPC.get(key); if(hit) return hit;
 const raw=pet?PETALT[g[3]]:SHAPE[g[1]][g[3]];
 let r;
 if(Array.isArray(raw)) r=raw;                 /* already plain rows */
 else{
  const flat=_unrle(raw), n=Math.round(Math.sqrt(flat.length));
  r=[]; for(let y=0;y<n;y++) r.push(flat.slice(y*n,(y+1)*n));
 }
 SPC.set(key,r); return r;
}
const ART=new Map(), ARTMAX=260;
function gearArt(g,alt){
 const key=g.id+(alt?'#a':'');
 const hit=ART.get(key);
 if(hit){ART.delete(key);ART.set(key,hit);return hit;}
 const sp=spriteRows(g,alt);
 const T=tones(g), N=sp.length;
 const c=document.createElement('canvas'); c.width=N; c.height=N;
 const q=c.getContext('2d'), img=q.createImageData(N,N), P=img.data;
 for(let y=0;y<N;y++){const row=sp[y];
  for(let x=0;x<N;x++){
   const ch=row[x], i=(y*N+x)*4;
   if(ch==='.'){P[i+3]=0;continue;}
   const col=T[ch]||T.A;
   P[i]=col[0]; P[i+1]=col[1]; P[i+2]=col[2]; P[i+3]=255;}}
 q.putImageData(img,0,0);
 ART.set(key,c);
 if(ART.size>ARTMAX) ART.delete(ART.keys().next().value);
 return c;
}
/* The eight bosses come out of their own table and carry their own two
   materials, so they go through the same letter to colour map as a
   sword does. */
const BROW=new Map(), BART=new Map();
/* The bosses are hand drawn and arrive as a palette plus a run length
   encoded index stream, because the point of them is the colours the
   artist picked and the tone ramp would throw those away. Decoded on
   first use, synchronously, so drawBill can have the pixels in the
   frame that asks for them. */
function bossCanvas(i){
 const R=BOSSRGB[i], n=R.n, P2=R.p;
 const c=document.createElement('canvas'); c.width=n; c.height=n;
 const q=c.getContext('2d'), img=q.createImageData(n,n), D=img.data;
 const bin=atob(R.d);
 let o=0;
 for(let k=0;k<bin.length;k+=2){
  const run=bin.charCodeAt(k), col=P2[bin.charCodeAt(k+1)];
  if(!col){ o+=run; continue; }          /* 0 is the transparent entry */
  const r=(col>>16)&255, g=(col>>8)&255, b=col&255;
  for(let t=0;t<run;t++,o++){
   const j=o*4; D[j]=r; D[j+1]=g; D[j+2]=b; D[j+3]=255;
  }
 }
 q.putImageData(img,0,0); return c;
}
function encRows(i){
 const k='e'+i; let r=BROW.get(k); if(r) return r;
 const flat=_unrle(ENCPIX[i]), n=Math.round(Math.sqrt(flat.length));
 r=[]; for(let y=0;y<n;y++) r.push(flat.slice(y*n,(y+1)*n));
 BROW.set(k,r); return r;
}
/* A boss is 128 pixels of hand drawn detail and it is almost always
   drawn smaller than that. drawBill walks its source with an integer
   step, so at 90 pixels it was simply throwing away three rows in ten:
   the fine work went first, the edges crawled as the distance changed,
   and the thing arrived looking cheap. The trees hit exactly this and
   were given filtered levels; so are these. One filtered copy per size
   bucket, built on a canvas where the browser can do a real downscale,
   and nothing is ever enlarged, because enlarging pixel art is the one
   case where the hard nearest neighbour step is the right answer. */
const BPIX=new Map();
/* Fine steps, because the level is blitted one for one and the size
   therefore steps rather than slides; coarse steps would be visible. */
const bbucket=h=> h<32?Math.max(4,Math.round(h/2)*2)
                : h<96?Math.round(h/3)*3 : Math.round(h/4)*4;
function bossPix(B,isEnc,pxH){
 const src=bossArt(B,isEnc);
 const want=bbucket(Math.round(pxH));
 if(want>=src.height) return pixOf((isEnc?'enc#':'boss#')+B.p,src);
 const key=(isEnc?'ep':'bp')+B.p+'@'+want;
 const hit=BPIX.get(key); if(hit) return hit;
 const c=document.createElement('canvas');
 c.height=want; c.width=Math.max(1,Math.round(src.width*want/src.height));
 const q=c.getContext('2d');
 q.imageSmoothingEnabled=true; q.imageSmoothingQuality='high';
 q.drawImage(src,0,0,c.width,c.height);
 const P=pixOf(key,c);
 if(BPIX.size>80) BPIX.clear();
 BPIX.set(key,P); return P;
}
function bossArt(B,isEnc){
 const hit=BART.get(B.n); if(hit) return hit;
 let c;
 if(!isEnc){ c=bossCanvas(B.p); }
 else{
  const sp=encRows(B.p), T=tones(['','',0,0,B.m,B.gm]), N=sp.length;
  c=document.createElement('canvas'); c.width=N; c.height=N;
  const q=c.getContext('2d'), img=q.createImageData(N,N), P=img.data;
  for(let y=0;y<N;y++){const row=sp[y];
   for(let x=0;x<N;x++){
    const ch=row[x], i=(y*N+x)*4;
    if(ch==='.'){P[i+3]=0;continue;}
    const col=T[ch]||T.A;
    P[i]=col[0]; P[i+1]=col[1]; P[i+2]=col[2]; P[i+3]=255;}}
  q.putImageData(img,0,0);
 }
 BART.set(B.n,c); return c;
}
/* Nearest neighbour when the piece is being shown at or above its own
   size, because that is the whole point of pixel art; a real filter on
   the way DOWN, because dropping every other row of a 64px sprite to
   fit a 32px slot loses limbs. */
function blitGear(ctx2,g,alt,x,y,size){
 const c=gearArt(g,alt);
 ctx2.imageSmoothingEnabled = size < c.width;
 if(size<c.width) ctx2.imageSmoothingQuality='high';
 ctx2.drawImage(c,x,y,size,size);
 ctx2.imageSmoothingEnabled=false;
}

/* ===================================================================
   CHEST — opened, not awarded
   =================================================================== */
const fx=document.getElementById('fx'), fg=fx.getContext('2d');
const fxh=document.getElementById('fxhi'), hg=fxh.getContext('2d');
let anim=null, chestQ=[];

/* The chest opens as he walks past the sign, not on a timer.
   It is queued off real steps in advance(), but the picture eases
   toward real mileage behind that, so a fixed delay fired it whenever
   the clock said: on a big catch up he was still miles short of the
   landmark, and on a small one the sign had already gone off the
   bottom of the screen. Level with the walker is walkDD in front of
   the camera, the same yardstick the encounter box uses. */
/* +2: walkDD and drift both settle a hair between the step that stops
   him at the sign and the next frame's check, and without the slack he
   stood at the sign for a few frames before it opened */
/* walkAt, not walkDD: walkDD is eased for the encounter box, and on
   hilly ground it ran up to a hundred units off where he is actually
   drawn, so the sign could be well ahead of or behind him when the bar
   filled. This is the distance he is drawn at. */
function chestReached(L){ return camWY()-rowOfMile(L.m)<=walkAt+2; }
function chestWatch(){
 if(!chestQ.length||anim||bend.classList.contains('open')) return;
 const L=chestQ[0];
 if(!chestReached(L)) return;
 /* The distance he is drawn at hops a little from frame to frame, so
    he can land a few dozen units past the sign on the frame he is
    stopped at it. Pull the view back by that much, so the frame under
    the opening chest has the sign level with him. Only a frame's worth:
    anything more means he walked past it on purpose (a fight card was
    up), and snapping back a long way would be a jump. */
 const over=walkAt-(camWY()-rowOfMile(L.m));
 if(over>2&&over<400) shownMi-=over/RPM;
 startChest();
}
function startChest(){
 if(!chestQ.length||anim) return;
 /* the old timed callers still land here; too early and the watch
    in the frame loop picks it up when he gets there */
 if(!chestReached(chestQ[0])) return;
 const L=chestQ[0], d=roll(L.t,L.m), R=RAR[d[2]];
 const isNew=grant(d);
 anim={L,d,R,t0:performance.now(),done:false,sp:[]};
 const box=document.getElementById('chest');
 box.classList.add('open');
 S.log=S.log||[];
 if(!S.log.some(e=>e.m===L.m)) S.log.push({m:L.m,day:S.day,i:d.id});
 save();
 document.getElementById('clm').innerHTML=
  '<span class="clmn">'+L.n+'</span><span class="clmm">MILE '+L.m.toFixed(1)
  +(L.e?' &middot; '+L.e.toLocaleString()+' FT':'')
  +' &middot; '+pctEnd(L.m)+'% TO '+TR.end+'</span>';
 document.getElementById('clore').textContent=L.w||'';
 document.getElementById('crar').textContent=R[0];
 document.getElementById('crar').style.color=R[1];
 document.getElementById('citem').textContent=d[0];
 document.getElementById('citem').style.color=R[1];
 document.getElementById('ckind').textContent=
  (isNew?'NEW · ':'ALREADY YOURS · +'+STONE_Y[d[2]]+' STONES · ')
  +SLOTNAME[CAT2SLOT[d[1]]];
 for(const id of ['clm','clore','cdiv','crar','citem','ckind','cok'])
  document.getElementById(id).classList.remove('show');
 /* The place lands first and gets a beat to itself. The chest is still
    falling while you read it, so nothing waits on nothing. */
 setTimeout(()=>document.getElementById('clm').classList.add('show'),250);
 setTimeout(()=>document.getElementById('clore').classList.add('show'),950);
 requestAnimationFrame(fxFrame);
}
/* How often each rarity comes up, by the tier of the place you found
   it. Rows are tiers 0 to 4, columns COMMON to LEGENDARY, in parts per
   thousand.

   This was a single roll with four thresholds, which had two faults.
   The top of it was unreachable: the best tier on any trail is 4, the
   tilt is 0.085 a tier, so the legendary cut at 1.34 needed a random
   number above 1.0. Five legendary pieces and three legendary pets
   have never dropped for anybody. And the rest came too easily, a
   fifth of the chests at a tier 4 landmark holding a mythic.

   A table instead of thresholds because the odds are then the thing
   you read and edit, rather than something you solve for. */
/* Row 0 is a chest on Springer Mountain and row 7 is one in Maine. A
   table indexed on the landmark alone finished the gear curve by mile
   70 and left two thousand miles of nothing left to find. */
const RARW=[[900,100,  0,  0, 0],
            [780,215,  5,  0, 0],
            [640,320, 40,  0, 0],
            [500,370,125,  5, 0],
            [380,380,220, 20, 0],
            [280,350,310, 58, 2],
            [200,300,370,120,10],
            [140,250,400,180,30]];
function rollRar(tier,mi){
 const p=Math.min(1,Math.max(0,(mi||0)/TOTAL));
 const lv=Math.max(0,Math.min(RARW.length-1,
                   (tier|0)*0.43+Math.pow(p,1.10)*9.8));
 const a=Math.floor(lv), b=Math.min(RARW.length-1,a+1), f=lv-a;
 const w=RARW[a].map((x,i)=>x*(1-f)+RARW[b][i]*f);
 let s=0; for(const x of w) s+=x;
 let r=Math.random()*s;
 for(let i=0;i<w.length;i++){ r-=w[i]; if(r<0) return i; }
 return 0;
}
/* The mile you are at tilts the roll, and it tilts it hard: nothing
   above rare exists in the first few hundred miles, and the
   legendaries are a Maine problem. The cairn is still the only place
   you CHOOSE one instead of waiting for it. */
function roll(tier,mi){
 let rar=rollRar(tier,mi);
 /* about one chest in six holds a companion instead of a piece of kit */
 const pet=Math.random()<0.17;
 const pool=GEAR.filter(g=>(g[1]==='pet')===pet);
 let at=pool.filter(g=>g[2]===rar);
 while(!at.length&&rar>0){rar--; at=pool.filter(g=>g[2]===rar);}
 if(!at.length) at=pool;
 return at[(Math.random()*at.length)|0];
}

/* the whole reveal, on one timeline, in milliseconds */
const T_DROP=420, T_SHAKE=1750, T_BURST=1900, T_RISE=2700, T_SETTLE=3150;
function fxFrame(now){
 if(!anim) return;
 const r=fx.getBoundingClientRect();
 const w=r.width||fx.clientWidth||innerWidth, h=r.height||fx.clientHeight||innerHeight;
 const FW=Math.max(8,Math.ceil(w/PX)), FH=Math.max(8,Math.ceil(h/PX));
 if(fx.width!==FW||fx.height!==FH){fx.width=FW;fx.height=FH;}
 fg.imageSmoothingEnabled=false; fg.clearRect(0,0,FW,FH);
 /* the piece itself is drawn on its own layer at device resolution, so
    128x128 of detail is not thrown away by the pixel buffer */
 const HD=Math.min(2,window.devicePixelRatio||1);
 const HW=Math.round(w*HD), HH=Math.round(h*HD);
 if(fxh.width!==HW||fxh.height!==HH){fxh.width=HW;fxh.height=HH;}
 hg.clearRect(0,0,HW,HH);
 hg.imageSmoothingEnabled=true; hg.imageSmoothingQuality='high';
 const t=now-anim.t0, R=anim.R, col=_rgb(R[1]);
 /* the chest sits in the middle of the room left above the caption,
    so the lid and the item always have somewhere to go */
 const info=document.querySelector('.cinfo');
 const capTop=info?Math.max(FH*0.52,(info.getBoundingClientRect().top-r.top)/PX):FH*0.62;
 const cx=Math.round(FW/2), cy=Math.round(capTop-FH*0.06);
 const S=Math.max(2,Math.round(Math.min(FW/22,FH/34)));

 /* --- 1. it falls in and lands --- */
 let dy=0, squash=0;
 if(t<T_DROP){ const p=t/T_DROP; dy=-(1-p)*(1-p)*Math.min(FH*.45,cy-S*6); }
 else if(t<T_DROP+140){ const p=(t-T_DROP)/140; squash=Math.sin(p*Math.PI)*.45; }

 /* --- 2. it shakes, harder and harder, and light leaks out --- */
 let sx=0, lid=0, glow=0;
 if(t>T_DROP && t<T_SHAKE){
  const p=(t-T_DROP)/(T_SHAKE-T_DROP);
  sx=Math.sin(t/(46-p*30))*S*(.18+p*.85);
  glow=p*p;
  if(p>.55) lid=(p-.55)/.45*0.30;
 }
 /* --- 3. the lid goes, and the flash --- */
 if(t>=T_SHAKE && t<T_BURST){ const p=(t-T_SHAKE)/(T_BURST-T_SHAKE); lid=.30+p*1.4; glow=1; }
 if(t>=T_BURST){ lid=1.7; glow=1; }

 /* flash ring */
 if(t>T_SHAKE-60 && t<T_SHAKE+320){
  const p=Math.max(0,Math.min(1,(t-(T_SHAKE-60))/380));
  fg.fillStyle='rgba(255,255,255,'+((1-p)*.85).toFixed(2)+')';
  const r=p*FW*.9;
  fg.fillRect(cx-r/2,cy-r/2*.5,r,r*.5);
 }

 /* --- the beam --- */
 if(glow>0){
  const bw=Math.max(1,Math.round(S*(1.2+glow*2.4)));
  for(let i=0;i<10;i++){
   const a=(glow*(.22-i*.02)*(0.6+0.4*Math.sin(now/180+i))).toFixed(3);
   fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a+')';
   fg.fillRect(cx-bw/2-i*2,cy-S*2-i*S*1.1,bw+i*4,S*2+i*S*1.1);
  }
 }

 /* --- the chest itself ---
    Planked body, iron bands, a lock plate, and a half-round lid hinged at
    the back. Drawn as pixel art rather than as stacked rectangles, because
    this is the thing the whole animation is about. */
 const by=cy+dy;
 const woodD=_rgb('#3f2714'), woodM=_rgb('#7a5430'), woodL=_rgb('#a37747');
 const iron =_rgb('#4a4a58'),  ironL=_rgb('#9a9aae'), out=_rgb('#17110a');
 const bw=Math.round(S*7)|1, bh=Math.round(S*4.2*(1-squash)+S*4.2*squash*0.55);
 const RC=(x,y,w,h,c2)=>{fg.fillStyle=_css(c2);
  fg.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
 const drawBox=()=>{
  const x0=cx-bw/2+sx, y0=by-bh;
  RC(x0-1,y0-1,bw+2,bh+2,out);
  for(let i=0;i<bw;i++){
   const plank=Math.floor(i/Math.max(1,S*1.4))%2;
   const edge=(i%Math.max(1,Math.round(S*1.4))===0);
   let c2=plank?woodM:_mix(woodM,woodL,.35);
   if(edge) c2=woodD;
   for(let j=0;j<bh;j++){
    const v=j/bh;
    RC(x0+i,y0+j,1,1,_mix(c2,v>0.78?woodD:_mix(c2,woodL,(1-v)*0.30),v>0.78?0.7:0.4));}
  }
  /* iron bands and the corner straps */
  RC(x0,y0,Math.max(1,S*.7),bh,iron); RC(x0,y0,Math.max(1,S*.7),Math.max(1,bh*.4),ironL);
  RC(x0+bw-S*.7,y0,Math.max(1,S*.7),bh,iron);
  RC(x0+bw-S*.7,y0,Math.max(1,S*.7),Math.max(1,bh*.4),_mix(iron,ironL,.5));
  RC(x0,y0+bh-S*.5,bw,Math.max(1,S*.5),_mix(iron,out,.45));
  /* the lock plate, in the rarity colour */
  const lw=Math.max(2,S*1.7);
  RC(cx-lw/2+sx,by-bh*.62,lw,lw*.95,_css?_mix(col,out,.35):col);
  RC(cx-lw/2+sx,by-bh*.62,lw,Math.max(1,lw*.34),_lite(col,.40));
  RC(cx-lw*.17+sx,by-bh*.62+lw*.30,Math.max(1,lw*.34),Math.max(1,lw*.40),out);
 };
 const lidOpen=Math.max(0,Math.min(1,lid/1.55));
 const drawLid=()=>{
  const lh=Math.max(2,Math.round(S*2.6*(1-lidOpen*0.80)));
  const ly=Math.round(by-bh-lh-lidOpen*S*1.6);
  const x0=cx-bw/2+sx;
  for(let j=0;j<lh;j++){
   /* u is 1 at the crown and 0 where the lid meets the box, so the widest
      row is the bottom one. The other way round gives an upturned bowl. */
   const u=1-(j+0.5)/lh;
   const w2=Math.round(bw*0.5*Math.sqrt(Math.max(0,1-u*u*0.72)));
   const yy=ly+j;
   fg.fillStyle=_css(out); fg.fillRect(cx+sx-w2-1,yy,w2*2+3,1);
   for(let i=-w2;i<=w2;i++){
    const lat=(i+w2)/(2*w2+.001);
    let c2=_mix(woodM,woodL,u*0.46+(1-lat)*0.34);
    if(Math.floor((i+w2)/Math.max(1,S*1.4))%2) c2=_mix(c2,woodD,.22);
    fg.fillStyle=_css(c2); fg.fillRect(cx+sx+i,yy,1,1);}
  }
  fg.fillStyle=_css(iron);
  fg.fillRect(cx+sx-Math.max(1,S*.8),ly,Math.max(2,S*1.6),lh);
  fg.fillStyle=_css(_lite(col,.34));
  fg.fillRect(cx+sx-Math.max(1,S*.5),ly,Math.max(1,S*1.0),lh);
  fg.fillStyle=_css(ironL);
  fg.fillRect(cx+sx-Math.max(1,S*.8),ly,Math.max(2,S*1.6),1);
  fg.fillStyle=_css(out); fg.fillRect(x0-1,ly+lh,bw+2,1);
 };
 /* the dark inside, revealed as the lid lifts */
 const drawInside=()=>{
  if(lidOpen<0.08) return;
  const ih=Math.round(S*1.9*lidOpen);
  fg.fillStyle=_css(_mix(out,[0,0,0],.4));
  fg.fillRect(cx-bw/2+sx+Math.round(S*.7),by-bh-ih,bw-Math.round(S*1.4),ih+1);
  fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(0.5*lidOpen).toFixed(2)+')';
  fg.fillRect(cx-bw/2+sx+Math.round(S*.9),by-bh-Math.max(1,ih*.5),bw-Math.round(S*1.8),Math.max(1,ih*.5));
 };
 /* light spilling out of an open chest, from behind the lid */
 if(lidOpen>0.18){
  const op=Math.min(1,(lidOpen-0.18)/0.6), BH=S*11;
  for(let j=0;j<BH;j++){
   const u=j/BH;
   const w2=Math.round(bw*0.46*(1-u*0.30));
   const a2=op*0.42*Math.pow(1-u,1.5);
   fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a2.toFixed(3)+')';
   fg.fillRect(cx+sx-w2,Math.round(by-bh-j),w2*2,1);}
 }
 /* once it is open the lid sits behind the box */
 if(lidOpen>0.3){ drawLid(); drawInside(); drawBox(); }
 else { drawBox(); drawLid(); }
 /* dust kicked up on landing */
 if(t>T_DROP&&t<T_DROP+420){
  const p=(t-T_DROP)/420;
  fg.fillStyle='rgba(190,178,160,'+((1-p)*.55).toFixed(2)+')';
  for(let i=0;i<14;i++){
   const a2=(i/14)*Math.PI*2, rr=p*S*7*(0.5+hash(i*13)*0.8);
   fg.fillRect(Math.round(cx+Math.cos(a2)*rr),Math.round(by-p*S*2.2*hash(i*7)),
               1+(hash(i*3)<.3?1:0),1);}
 }

 /* --- the item rises out, glowing --- */
 if(t>T_BURST){
  const p=Math.min(1,(t-T_BURST)/(T_RISE-T_BURST));
  const e=1-Math.pow(1-p,3);
  const hover=(t>T_RISE)?Math.sin((t-T_RISE)/420)*S*.4:0;
  const iy=by-bh-e*S*6.4+hover;
  const IS=Math.max(1,Math.round(S*.38*e));
  /* a halo in the rarity colour, as a real radial glow */
  const rg=fg.createRadialGradient(cx,iy-IS*8,0,cx,iy-IS*8,IS*17);
  rg.addColorStop(0,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(.55*e).toFixed(3)+')');
  rg.addColorStop(.45,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(.18*e).toFixed(3)+')');
  rg.addColorStop(1,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+',0)');
  fg.fillStyle=rg; fg.fillRect(cx-IS*18,iy-IS*26,IS*36,IS*36);
  const k=PX*HD, side=IS*16*k;
  blitGear(hg,anim.d,false,(cx-IS*8)*k,(iy-IS*16)*k,side);

  /* sparkles orbiting it */
  if(!anim.sp.length) for(let i=0;i<26;i++)
   anim.sp.push({a:Math.random()*6.28,r:S*(1.2+Math.random()*3.4),
                 v:(Math.random()<.5?-1:1)*(.6+Math.random()*1.5),
                 o:Math.random()*6.28,s:Math.random()<.3?2:1});
  for(const q of anim.sp){
   const ang=q.a+(t-T_BURST)/900*q.v;
   const rr=q.r*(0.6+0.4*Math.sin(ang*2+q.o));
   const px=cx+Math.cos(ang)*rr, py=iy-IS*6+Math.sin(ang)*rr*.55;
   fg.fillStyle='rgba(255,255,255,'+(.25+.55*Math.abs(Math.sin(ang+q.o))).toFixed(2)+')';
   fg.fillRect(px|0,py|0,q.s,q.s);}
 }

 /* --- the text, after the item has arrived --- */
 if(t>T_SETTLE && !anim.done){
  anim.done=true;
  document.getElementById('cdiv').classList.add('show');
  document.getElementById('crar').classList.add('show');
  setTimeout(()=>document.getElementById('citem').classList.add('show'),180);
  setTimeout(()=>document.getElementById('ckind').classList.add('show'),340);
  setTimeout(()=>document.getElementById('cok').classList.add('show'),560);
 }
 requestAnimationFrame(fxFrame);
}
document.getElementById('cok').onclick=()=>{
 chestQ.shift(); anim=null; hg.clearRect(0,0,fxh.width,fxh.height);
 document.getElementById('chest').classList.remove('open');
 if(chestQ.length) setTimeout(startChest,260);
};

/* ---------- the kit and the totals, on the walk itself ----------
   Six slots across the bottom right, in equip order, so you can see
   what you are wearing without opening anything; tapping them opens
   the pack. Redrawn only when the signature changes, because this runs
   from hud() and hud() runs on every batch of steps. */
let kitSig='';
function drawKit(){
 const eq=S.eq||{};
 const sig=SLOTS.map(k=>eq[k]||'-').join(',');
 if(sig===kitSig) return;
 kitSig=sig;
 const K=document.getElementById('kitstrip'); if(!K) return;
 K.innerHTML='';
 const d=Math.min(2,window.devicePixelRatio||1), px=Math.round(20*d);
 for(const sl of SLOTS){
  const g=eq[sl]&&BYID[eq[sl]]?BYID[eq[sl]]:null;
  if(!g){ const e=document.createElement('span'); e.className='ke'; K.appendChild(e); continue; }
  const c=document.createElement('canvas');
  c.width=px; c.height=px; c.title=g[0];
  const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
  blitGear(q,g,false,0,0,px);
  c.style.borderBottom='2px solid '+RAR[g[2]][1];
  K.appendChild(c);
 }
}
let statSig='';
function drawStatStrip(){
 const t=loadout();
 const sig=STATS.map(k=>t[k]).join(',');
 if(sig===statSig) return;
 statSig=sig;
 const S4=document.getElementById('statstrip'); if(!S4) return;
 S4.innerHTML=STATS.map(k=>'<span class="sc">'+STATNAME[k]
   +' <b style="color:'+STATCOL[k]+'">'+t[k]+'</b></span>').join('');
}

/* ---------- hud ---------- */
function hud(){
 rollDay();
 drawKit(); drawStatStrip(); measureBtm();
 const mi=miles();
 document.getElementById('mile').textContent=mi.toFixed(1);
 document.getElementById('pct').textContent=pctEnd(mi);
 document.getElementById('biome').textContent=biomeAt(mi).name;
 document.getElementById('today').textContent=S.today.toLocaleString();
 document.getElementById('day').textContent=S.day;
 const nn=document.getElementById('nextname'), nd=document.getElementById('nextdist');
 const fl=document.getElementById('fill'), vt=document.getElementById('vtrack');
 const F=S.fight;
 vt.style.display=F?'block':'none';
 if(F){
  const B=BOSS[F.b];
  nn.textContent=B.n; nn.style.color='#ffb49a';
  nd.textContent=Math.max(0,Math.ceil(F.hp))+' HP';
  fl.style.background='linear-gradient(#ffb49a,#c0392b)';
  fl.style.width=Math.max(0,Math.min(100,F.hp/F.hp0*100)).toFixed(1)+'%';
  document.getElementById('vfill').style.width=
   Math.max(0,Math.min(100,F.vig/F.vig0*100)).toFixed(1)+'%';
  return;
 }
 nn.style.color=''; fl.style.background='';
 _nbKey=''; nextBar();
}
/* The bar to the next landmark runs off where the walker is on screen,
   not off the step count. Steps land in a lump and the walker eases
   after them, so a bar on real miles hit the landmark and flipped to
   the next one the moment you tapped, and the chest then opened a
   couple of seconds later when he actually got there, which read as
   the chest being late. Called every frame; it only touches the DOM
   when something it shows has changed. The mile count up top is still
   your real steps. */
let _nbKey='';
function walkerMi(){ return Math.max(0,Math.min(miles(),(progress()+walkAt)/RPM)); }
function nextBar(){
 if(S.fight) return;
 const mi=walkerMi();
 let prev={m:0}, next=null;
 for(const L of TRAIL){ if(L.m<=mi) prev=L; else {next=L;break;} }
 const name=next?next.n:'THRU HIKE COMPLETE';
 /* Rounded UP, and in feet for the last tenth of a mile. Rounded to the
    nearest tenth it read 0.0 MI from about a hundred steps out, so the
    bar said you were there several taps before the chest could open.
    Now it reaches zero on the step the chest opens. */
 const rem=next?Math.max(0,next.m-mi):0;
 const dist=!next?'PICK A TRAIL \u25b2'
  :rem>=0.1?(Math.ceil(rem*10)/10).toFixed(1)+' MI'
  :Math.max(10,Math.ceil(rem*5280/10)*10)+' FT';
 /* held just short of full until he is there, so a full bar always
    means the chest is opening */
 const pct=next?Math.max(0,Math.min(98.5,((mi-prev.m)/Math.max(.01,next.m-prev.m))*100)).toFixed(1)+'%':'100%';
 /* The landmark you are standing at, chest open or waiting behind a
    fight card: the bar is full and says so. This is the only time it
    is full, so the end of the bar and the chest are the same moment. */
 const at=anim?anim.L:(chestQ.length&&chestReached(chestQ[0])?chestQ[0]:null);
 const key=at?at.n+'|HERE|100%':name+'|'+dist+'|'+pct;
 if(key===_nbKey) return; _nbKey=key;
 if(at){
  document.getElementById('nextname').textContent=at.n;
  document.getElementById('nextdist').textContent='HERE';
  document.getElementById('fill').style.width='100%';
  return;
 }
 document.getElementById('nextname').textContent=name;
 document.getElementById('nextdist').textContent=dist;
 document.getElementById('fill').style.width=pct;
}
/* ---- walking ----
   Steps arrive in one lump after a day away, so they are fed through in
   chunks: a 20,000 step catch up has to be able to reach a landmark,
   finish a fight, and meet the next thing, in that order, rather than
   resolving all of it against the mile you happened to land on. */
function addSteps(n){
 n=Math.max(0,n|0);
 while(n>0){ const take=Math.min(n,120); advance(take); n-=take; }
 if(fightQ.length && !anim) setTimeout(showFightEnd,900);
}
function advance(n){
 const before=miles();
 /* a trail has an end; steps past it still count toward the day */
 const cap=Math.ceil(TOTAL*SPM), all=n;
 n=Math.min(n,Math.max(0,cap-S.steps));
 S.today+=all;
 if(n<=0){ S.fight=null; save(); hud(); return; }
 S.steps+=n; const after=miles();
 if(S.steps>=cap && !S.done[CUR]) S.done[CUR]=S.day;
 /* Springer sits at mile 0, so `L.m>before` never caught it on the first
    steps of a save and the southern terminus was the one place you could
    never reach. From a standing start the mile you are on counts. */
 for(const L of TRAIL)
  if(L.m<=after && (L.m>before || (before===0 && L.m===0))
     && S.opened.indexOf(L.m)<0){S.opened.push(L.m);chestQ.push(L);}
 if(S.fight) fightTick(n);
 else{
  S.bm=S.bm||0;
  const nb=BSCHED.find(x=>x.m>S.bm && x.m-ENGAGE<=after);
  if(nb){ S.bm=nb.m; startFight(nb); }
 }
 encTick(n,before,after);
 surge=Math.min(.55,surge+n/22000);
 save(); hud();
}

/* ---- what is up ahead ----
   `enc` is deliberately a plain variable and never goes into S: close
   the app with one pending and you walked past it. */
let enc=null, encWalk=0;
function encTick(n,before,after){
 if(enc) return;   /* encWatch owns a live encounter from here */
 if(S.fight) return;
 encWalk+=n;
 if(encWalk<300) return;
 encWalk=0;
 if(Math.random()>0.22) return;
 enc={k:(Math.random()*ENC.length)|0, m:after+0.10+Math.random()*0.15,
      side:Math.random()<0.5?-1:1};
}
/* The life of an encounter, watched every frame rather than only when
   steps come in, because between step batches the camera still glides.

   The box used to fire at 70 units out. The sprite is drawn from 900
   units down to 40, so 70 is the last moment before it leaves the
   screen: you watched the thing come the whole way in silence and then
   got told about it as it went by. Now the box goes up while it is
   still ahead of you and comes down once it is behind you, so the
   words and the picture are on screen together.

   Showing is also what collects it. Noticing the thing is the whole
   point of an encounter, which is why it is never saved: walk with the
   phone in your pocket and the frame loop is not running to see it. */
/* A few steps before he draws level with it.
   Distances here are from the CAMERA, and the camera trails the
   walker by walkDD, about 90 units. Timing the box off the camera put
   it up at 65, which is 25 units behind him: the creature had already
   gone by before the box appeared, which is what it looked like.
   Level with him is walkDD, so the box goes up a short lead ahead of
   that and comes down when the creature leaves the screen. */
const ENC_LEAD=10;    /* about eight steps of warning */
const ENC_GONE=BILL_NEAR;
const encShowAt=()=> walkDD+ENC_LEAD;
function encWatch(){
 if(!enc) return;
 const dd=camWY()-(-enc.m*RPM);
 /* Behind you now, and this has to come first and ignore whether it
    was ever shown. A card over the screen holds anim, and an encounter
    that went by underneath one was left standing at a negative
    distance forever; encTick will not lay a new one while an old one
    is alive, so a single missed encounter was the last encounter of
    the save. Walking past one unnoticed is the intent, but it has to
    be cleared on the way past like any other. */
 if(dd<ENC_GONE){ enc=null; return; }
 if(enc.seen) return;
 /* Not gated on anim any more. A landmark card holds anim, cards are
    common, and while one was up the box was suppressed: you dismissed
    it, and the creature had gone by with nothing ever shown, or the
    box arrived behind it. That is most of what "the message appears
    after it has passed" was. The box is a strip along the top, not a
    modal, so it has no reason to wait for a card. */
 if(dd>encShowAt()) return;
 enc.seen=true;
 resolveEnc();
}
function resolveEnc(){
 const E=ENC[enc.k];
 const gain=E.st[0]+((Math.random()*(E.st[1]-E.st[0]+1))|0);
 S.stones=stones()+gain;
 S.log=S.log||[];
 S.log.push({e:1,k:enc.k,day:S.day,m:Math.round(enc.m*100)/100,st:gain});
 toast(E,gain);
 save();
}

/* ---- the fight ---- */
let fightQ=[], banner=null;
function startFight(sch){
 const B=BOSS[sch.b], v=myVigour(loadout()), hp=bossHP(B,sch.m);
 /* How it goes is not settled by the kit alone. Both sides are linear
    in steps, so without a swing here the same walker meeting the same
    thing loses to it every single time, and that is eight hundred
    steps spent on a foregone conclusion. One roll per FIGHT, not per
    tick, or it averages itself back out to nothing. */
 const sw=()=>1+(Math.random()-0.5)*0.45;
 S.fight={b:sch.b,m:sch.m,hp:hp,hp0:hp,vig:v,vig0:v,steps:0,close:1,
          f1:sw(),f2:sw()};
 banner={b:sch.b,t0:performance.now()};
 save();
}
function fightTick(n){
 const F=S.fight, B=BOSS[F.b], t=loadout();
 const my=myDPS(t)/100*(F.f1||1), th=bossDPS(B,t,F.m)/100*(F.f2||1);
 /* Both sides are linear in steps, so the exact step it ends on can be
    solved for. Stepping the chunk and then testing reported every fight
    as a round multiple of the chunk size. */
 const toKill=my>0?F.hp/my:Infinity, toDrop=th>0?F.vig/th:Infinity;
 const end=Math.min(toKill,toDrop);
 const take=Math.min(n,end);
 F.hp-=my*take; F.vig-=th*take; F.steps+=take;
 /* it closes with you as it goes, which is what puts it on the screen
    at a size worth looking at by the end */
 F.close=Math.max(0.30,1-F.steps/2200);
 if(end<=n) endFight(toKill<=toDrop);
}
function endFight(won){
 const F=S.fight, B=BOSS[F.b];
 S.fight=null;
 let gain=0, got=null;
 if(won){
  S.beat=S.beat||{}; S.beat[B.n]=(S.beat[B.n]|0)+1;
  /* A boss pays in gear, not in stones. There are about 1,450 of them
     over the whole trail, so any flat stone reward dwarfs the duplicate
     economy the cairn was tuned against: a flat 14+tier*11 paid out
     3,700 stones in the first 110 miles alone, against the 1,458 a
     FULL thru hike of duplicates is worth. A repeat piece converts at
     the cairn on its own, so bosses still feed it, at the rate
     everything else does. */
  if(Math.random()<0.40){
   got=roll(Math.min(4,1+Math.round(B.tier*0.55)),F.m);
   const before=stones(); grant(got); gain=stones()-before;
  }
 }
 S.log=S.log||[];
 S.log.push({f:1,b:F.b,day:S.day,m:F.m,won:won?1:0,st:gain,
             i:got?got.id:null,steps:Math.round(F.steps)});
 fightQ.push({b:F.b,won:won,st:gain,i:got?got.id:null,steps:Math.round(F.steps)});
 save();
}
/* ---------- where the steps come from ----------
   There are no buttons any more. Steps are real.

   Two sources, in order of preference. If the page is hosted by a
   native shell that knows about HealthKit or the Android step counter,
   it sets window.trekSteps to a function returning the day's total and
   Trek polls it: that is the one that keeps counting while the phone
   is in a pocket, and it is what the shipped build should use.

   Failing that, and that is the case in any browser today, the device
   motion stream is used as a pedometer. It is a real step count and it
   is honest about what it is: it only runs while this screen is open
   and awake, because a web page gets no accelerometer in the
   background. The bar says so until it is counting.

   iOS needs DeviceMotionEvent.requestPermission() from a tap, which is
   what the prompt in the bottom bar is for. */
const PED={lo:0,armed:false,last:0,live:false,attached:false};
function pedTick(e){
 const a=e.accelerationIncludingGravity||e.acceleration;
 if(!a||a.x==null) return;
 if(!PED.live) stepsLive(true);      /* events arriving, so it is counting */
 const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
 /* a slow average is gravity; what is left is the walker */
 PED.lo=PED.lo?PED.lo*0.90+m*0.10:m;
 const d=m-PED.lo, now=performance.now();
 if(!PED.armed&&d>1.05) PED.armed=true;
 else if(PED.armed&&d<-0.42){
  PED.armed=false;
  /* a refractory gap, or one footfall rings as three */
  if(now-PED.last>270){ PED.last=now; addSteps(1); }
 }
}
function stepsLive(on){
 PED.live=on;
 document.getElementById('stepask').classList.toggle('on',!on);
 measureBtm();                    /* the prompt changes the frame height */
}
/* ---- keeping the screen on ----
   A web page gets no accelerometer once the screen sleeps, which on a
   phone in a pocket is about twenty seconds. Without this the web
   pedometer counts the walk from the front door to the gate and then
   stops, which is worse than not offering it. The Wake Lock is asked
   for at the same moment as motion and dropped the moment Trek is put
   away, so it is only ever held while you are actually walking with
   this screen open. It is the one thing that makes the browser build
   usable for a walk; the native build does not need it, because
   Health is counting whether the phone is awake or not. */
let wakeLock=null;
function paintWake(){
 const d=document.getElementById('wakedot');
 if(d) d.className='wakedot'+(wakeLock?' on':'');
}
async function holdScreen(){
 try{
  if(!('wakeLock' in navigator)) return false;
  if(wakeLock) return true;
  wakeLock=await navigator.wakeLock.request('screen');
  /* the browser drops it on its own when the tab is hidden */
  wakeLock.addEventListener('release',()=>{ wakeLock=null; paintWake(); });
  paintWake(); return true;
 }catch(e){ wakeLock=null; paintWake(); return false; }
}
function dropScreen(){
 try{ if(wakeLock) wakeLock.release(); }catch(e){}
 wakeLock=null; paintWake();
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden) return;
 if(PED.live&&PED.attached) holdScreen();
});
/* the host calls these when Trek is opened and closed */
window.trekSleep=dropScreen;
window.trekWake=()=>{ if(PED.live&&PED.attached) holdScreen(); };

function askText(t){
 const b=document.getElementById('stepask'); if(b) b.textContent=t;
}
function startMotion(){
 const D=window.DeviceMotionEvent;
 if(!D){ stepsLive(false); askText('THIS BROWSER CANNOT COUNT STEPS'); return false; }
 /* Attaching a listener is not the same as receiving anything. A
    desktop browser has DeviceMotionEvent and never fires it, and
    saying "counting" there would be a lie; the prompt stays up until
    a real reading lands. */
 const go=()=>{
  addEventListener('devicemotion',pedTick); PED.attached=true;
  holdScreen();
 };
 if(typeof D.requestPermission==='function'){
  D.requestPermission().then(r=>{
   if(r==='granted') go();
   else { stepsLive(false); askText('MOTION BLOCKED · ALLOW IT IN SETTINGS'); }
  }).catch(()=>{ stepsLive(false); askText('TAP TO COUNT YOUR STEPS'); });
 }else go();
 return true;
}
document.getElementById('stepask').onclick=startMotion;

/* A native shell can hand us the real daily total instead, and that is
   the one that counts while the phone is in a pocket. Trek runs in a
   frame inside the game, so the function may be set on this window or
   on the parent; both are the same origin. The moment a real source
   appears the pedometer is detached, because two sources counting the
   same walk would double it. */
let hostLast=null;
function hostFn(){
 if(typeof window.trekSteps==='function') return window.trekSteps;
 try{
  if(window.parent&&window.parent!==window&&
     typeof window.parent.trekSteps==='function') return window.parent.trekSteps;
 }catch(e){}
 return null;
}
function hostPoll(){
 if(DEVMODE) return;
 const fn=hostFn();
 if(!fn) return;
 if(PED.attached){ removeEventListener('devicemotion',pedTick); PED.attached=false; }
 const t=fn();
 if(typeof t!=='number'||!isFinite(t)) return;
 if(hostLast===null){ hostLast=t; stepsLive(true); return; }
 if(t>hostLast){ addSteps(t-hostLast); }
 hostLast=t;                       /* a lower number means a new day */
 stepsLive(true);
}

/* the day rolls over on the calendar, not on a button */
function dayKey(){ const d=new Date();
 return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function rollDay(){
 const k=dayKey();
 if(!S.dk){ S.dk=k; save(); return; }
 if(S.dk!==k){ S.dk=k; S.day=(S.day|0)+1; S.today=0; save(); hud(); }
}

/* a way in for the console and for the host, deliberately not a button */
window.trekPush=n=>addSteps(Math.max(0,n|0));

/* ---- dev controls, behind ?dev=1 ----
   A laptop has no accelerometer and no Health, so there is no way to
   walk the thing at a desk. These are the old prototype buttons, shown
   only when the flag is in the URL, so they cannot appear in the app:
   nothing in the game ever links to trek.html with a query string. */
const DEVMODE=new URLSearchParams(location.search).get('dev')==='1';
if(DEVMODE){
 const row=document.getElementById('devrow');
 row.hidden=false;
 document.getElementById('b10').onclick=()=>addSteps(10);
 document.getElementById('b100').onclick=()=>addSteps(100);
 document.getElementById('b1k').onclick=()=>addSteps(1000);
 document.getElementById('b5k').onclick=()=>addSteps(5000);
 document.getElementById('bday').onclick=()=>{
  S.day=(S.day|0)+1; S.today=0; S.dk=dayKey(); save(); addSteps(3000+((Math.random()*6000)|0)); };
 document.getElementById('brst').onclick=resetTrek;
}

function resetTrek(){
 S={steps:0,today:0,day:1,dk:dayKey(),opened:[],log:[],stones:0,bm:0,beat:{},fight:null,
    own:{},eq:{},cur:CUR,tr:{},done:{}}; chestQ=[]; fightQ=[]; banner=null; anim=null;
 bend.classList.remove('open'); enc=null; encWalk=0;
 document.getElementById('etoast').classList.remove('on'); toastT=0; toastMin=0;
