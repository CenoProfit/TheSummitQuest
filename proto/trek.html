:root{
 --pix:'Press Start 2P','Courier New',monospace;
 --body:'Courier New',Courier,monospace;
 --bg:#080d14; --solid:#111823; --solid2:#1a2432;
 --panel:rgba(14,22,33,.60); --panel2:rgba(24,34,48,.52);
 --edge:#33445c; --edge2:#5a7392; --ink:#e9f0f6; --dim:#8695a8;
 --gold:#f5c651; --xp:#74e84f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
 overflow:hidden;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
 padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.frame{background:var(--panel);border:3px solid var(--edge);position:relative;
 box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--edge2),4px 4px 0 4px rgba(0,0,0,.5);
 background-image:
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.top{padding:8px 196px 8px 11px}
/* The trail name IS the trail picker, and it used to be styled as a
   heading sitting beside three things that obviously were buttons, so
   the eye learned "bordered means tappable" and then skipped straight
   past it. It wears the same chrome as the others now, with the
   chevron in its own segment behind a divider so it reads as a
   dropdown rather than as a title with a mark after it. */
.trailname{font-family:var(--pix);font-size:8px;letter-spacing:2px;color:var(--gold);
 display:inline-flex;align-items:stretch;gap:0;width:auto;flex:0 0 auto;
 padding:0;text-align:left;
 text-shadow:2px 2px 0 rgba(0,0,0,.7);
 /* the buttons are anchored to the bottom of the frame, so the top line
    can have the width back that the padding reserves for them */
 margin-right:-185px}
.trailname>span:first-child{padding:5px 8px}
.tchev{display:flex;align-items:center;padding:0 8px;color:var(--gold);
 border-left:2px solid var(--gold);background:rgba(245,198,81,.22);
 font-size:10px;line-height:1}
/* The picker button is taller than the bare text it replaced, which on
   a 320 pixel screen pushed the percent line down into the buttons
   anchored at the bottom of the frame. Everything on that line gives
   back a point or two below 360. */
}
.mile{font-family:var(--pix);font-size:17px;margin:7px 0 3px;letter-spacing:1px;
 white-space:nowrap;text-shadow:2px 2px 0 rgba(0,0,0,.75)}
.mile small{font-size:8px;color:var(--dim);letter-spacing:2px}
.biome{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;
 gap:4px 10px;font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.bpct{font-family:var(--pix);font-size:7px;letter-spacing:1px;color:var(--gold);
 white-space:nowrap;flex:none}
.btm{margin-top:auto;padding:8px 11px 9px}
.nextrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.nextname{font-family:var(--pix);font-size:8px;letter-spacing:1px;color:var(--gold);
 text-shadow:1px 1px 0 rgba(0,0,0,.7);line-height:1.5}
.nextdist{font-family:var(--pix);font-size:8px;white-space:nowrap}
.track{height:13px;background:#0a121c;border:2px solid var(--edge2);overflow:hidden;
 background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.fill{height:100%;background:linear-gradient(#9bf07a,#48b82e);width:0%;transition:width .5s ease-out}
/* Two lines, always: the count and the kit on one, the four numbers
   spread across the next. Letting them share a row put the stats on
   top of the step count at 375 wide and cut MAG off at the edge. */
.botrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px}
.steps{display:flex;align-items:baseline;gap:6px;flex:1 1 auto;min-width:0}
.steps b{font-family:var(--pix);font-size:13px;color:var(--xp);
 text-shadow:1px 1px 0 rgba(0,0,0,.7);white-space:nowrap}
.steps span{font-size:9px;letter-spacing:1px;color:var(--dim);white-space:nowrap}
.steps i{color:var(--gold);font-family:var(--pix);font-size:8px;font-style:normal}
/* lit while the screen is being held awake for the walk */
.wakedot{width:6px;height:6px;flex:0 0 auto;background:var(--edge);align-self:center}
.wakedot.on{background:var(--xp);box-shadow:0 0 5px rgba(116,232,79,.8)}
.statstrip{display:flex;gap:6px;flex:1 0 100%;order:3;
 justify-content:space-between;min-width:0}
.sc{font-family:var(--pix);font-size:7px;letter-spacing:1px;color:var(--dim);
 white-space:nowrap}
.sc b{font-weight:normal;font-size:9px}
/* the kit, six slots, tap to open the pack */
.kitstrip{display:flex;gap:2px;flex:0 0 auto;order:2;align-items:center;width:auto;
 padding:3px;background:rgba(0,0,0,.26);border:2px solid var(--edge);
 cursor:pointer;font:inherit;color:inherit}
.kitstrip:active{transform:translate(1px,1px)}
.kitstrip canvas{width:20px;height:20px;image-rendering:pixelated;display:block}
.kitstrip .ke{width:20px;height:20px;display:block;position:relative}
.kitstrip .ke::after{content:'';position:absolute;left:9px;top:9px;width:4px;height:4px;
 background:var(--edge2);opacity:.55}
/* shown only until the phone is actually counting */
.stepask{display:none;width:100%;margin-top:7px;padding:8px;font-family:var(--pix);
 font-size:8px;letter-spacing:2px;background:var(--solid2);color:var(--gold);
 border:2px solid var(--gold);cursor:pointer}
.stepask.on{display:block}
/* .dev{display:flex} is a class and [hidden] is the UA's attribute
   rule, so the class won and the prototype buttons were showing in the
   real game whatever the flag said. This has to be spelled out. */
.dev{margin-top:8px;display:flex;gap:6px}
.dev[hidden]{display:none}
.btn{font-family:var(--pix);font-size:7px;letter-spacing:1px;padding:8px 7px;flex:1;
 background:var(--solid2);color:var(--ink);border:2px solid var(--edge2);cursor:pointer;
 box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.devnote{font-size:9px;color:#5c6a7c;letter-spacing:1px;margin-top:7px;text-align:center}

/* ---- pack ---- */
.topbtns{position:absolute;right:9px;bottom:9px;display:flex;gap:6px}
.topbtns .btn{flex:0 0 auto;width:auto;padding:8px 9px}
.packbtn{color:var(--gold);border-color:var(--gold);background:rgba(60,46,12,.70)}
.jrnbtn{color:var(--ink);border-color:var(--edge2);background:rgba(26,38,54,.78)}
.musbtn{color:var(--gold);border-color:var(--edge2);background:rgba(26,38,54,.78);
 font-size:11px;padding:7px 8px}
.musbtn.off{color:var(--dim);opacity:.7}
#pack{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
 background:
  radial-gradient(130% 80% at 50% 0%,rgba(46,62,88,.55),transparent 70%),
  linear-gradient(180deg,#0a111b 0%,#070c14 60%,#05080e 100%);
 padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#pack.open{display:flex}
#pack::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
 padding-bottom:10px;margin-bottom:12px;
 border-bottom:2px solid var(--edge);position:relative}
.pbar::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;
 background:linear-gradient(90deg,var(--gold),transparent 60%);opacity:.35}
.ptitle{font-family:var(--pix);font-size:11px;letter-spacing:3px;color:var(--gold);flex:1;
 text-shadow:2px 2px 0 rgba(0,0,0,.8)}
.pcount{font-family:var(--pix);font-size:8px;color:var(--dim);letter-spacing:1px}
.pstones{font-family:var(--pix);font-size:8px;color:var(--gold);letter-spacing:1px;
 white-space:nowrap;flex:none}
.pclose{flex:0 0 auto;width:auto;padding:7px 11px}
.pbody{flex:1;display:flex;gap:14px;min-height:0}

/* the left column: a paper doll with the slots either side of it */
.pleft{flex:0 0 212px;display:flex;flex-direction:column;gap:10px;min-height:0}
.doll{position:relative;flex:0 0 auto;border:2px solid var(--edge2);
 background:
  radial-gradient(70% 55% at 50% 38%,rgba(120,160,210,.16),transparent 70%),
  linear-gradient(180deg,#0e1724,#0a1018);
 box-shadow:inset 0 0 0 2px rgba(0,0,0,.5);
 display:flex;align-items:flex-end;justify-content:center;padding:10px 0 12px;height:168px}
.doll canvas{image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.dollbase{position:absolute;left:18%;right:18%;bottom:9px;height:6px;border-radius:50%;
 background:radial-gradient(50% 100% at 50% 50%,rgba(0,0,0,.55),transparent 70%)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto;min-height:0}

/* the same four numbers on one line, for a single piece */

 font-family:var(--pix);font-size:7px;letter-spacing:1px;color:var(--dim)}

 letter-spacing:1px;margin-bottom:3px}
.pslotxt span{color:var(--ink);word-break:break-word;display:block;
 overflow:hidden;text-overflow:ellipsis}

/* the right column: tabs, grid, and the piece you are looking at */
.pright{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ptabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ptab{font-family:var(--pix);font-size:6px;letter-spacing:1px;padding:7px 7px;
 background:linear-gradient(180deg,#1b2736,#121a26);border:2px solid #243246;

 background:linear-gradient(180deg,#3a3016,#231c0c)}
.pgrid{flex:1;overflow-y:auto;display:grid;gap:7px;align-content:start;
 justify-content:center;grid-template-columns:repeat(auto-fill,76px);
 border:2px solid #1d293a;background:rgba(6,11,18,.66);padding:9px;
 box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
.pgrid::-webkit-scrollbar{width:8px}
.pgrid::-webkit-scrollbar-thumb{background:#243246}
.cell{position:relative;width:76px;height:76px;display:flex;align-items:center;
 justify-content:center;border:2px solid #243246;cursor:pointer;
 background:linear-gradient(180deg,#141f2d,#0c131d)}
.cell canvas{image-rendering:pixelated}
.cell::after{content:'';position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 45%)}
.cell.locked{opacity:.34}
.cell.locked canvas{filter:grayscale(1) brightness(.30)}
.cell.eq{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(245,198,81,.18)}
.cell.burning{--au:255,120,30;
 background:radial-gradient(60% 60% at 50% 55%,rgba(var(--au),.30),rgba(12,19,29,0) 72%),
 linear-gradient(180deg,#141f2d,#0c131d);
 animation:ember 1.8s ease-in-out infinite}
@keyframes ember{0%,100%{box-shadow:0 0 12px rgba(var(--au),.22),inset 0 0 8px rgba(var(--au),.12)}
 50%{box-shadow:0 0 22px rgba(var(--au),.44),inset 0 0 15px rgba(var(--au),.24)}}
.cell.sel{outline:2px solid #8fb6e8;outline-offset:1px}
.cell .dup{position:absolute;right:2px;bottom:1px;font-family:var(--pix);font-size:6px;
 color:var(--ink);text-shadow:1px 1px 0 #000;z-index:2}
.pdetail{margin-top:9px;border:2px solid #243246;
 background:linear-gradient(180deg,rgba(26,38,54,.72),rgba(10,16,25,.72));

 color:var(--dim);margin-top:9px}

.trailname{cursor:pointer;position:relative;z-index:3;

<script>
/* ===================================================================
   SUMMIT QUEST — DAILY TREK (prototype, perspective rebuild)

   You walk away from the camera, up a winding trail that recedes to the
   horizon, and the world comes at you continuously.

   The renderer is the pseudo-3D ground plane that racing games used:
   the trail is a chain of fixed-length segments in world space, each
   projected to a screen row by y = horizon + FOCAL/z. Drawing them from
   nearest to furthest and refusing to draw above the lowest row already
   covered gives hidden-surface removal for free, which is what lets the
   ground roll over hills instead of lying flat.

   Everything is on the same 1:3 pixel grid as the rest of the game.
   =================================================================== */

let PX     = 2;    // screen pixels per drawn pixel, set from the window
const SEG  = 0.5;    // world units per trail segment
const MPZ  = 160;    // world units per trail mile
const SPM  = 2100;   // steps per mile, ~30in stride
const NSEG = 620;  // segments drawn ahead

/* ---------- colour ---------- */
const _rgb=h=>{h=h.replace('#','');
 return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const _css=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const _mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const _dark=(a,t)=>_mix(a,[0,0,0],t), _lite=(a,t)=>_mix(a,[255,255,255],t);

/* Stateless. Every feature has to be derivable from its own world slot
   alone, because the world streams past the camera forever. */
function hash(n){let t=(n|0)+0x6D2B79F5|0;t=Math.imul(t^t>>>15,1|t);
 t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}

/* ---------- the trail, northbound from Springer ---------- */
/* Elevations are in feet. `w` is one line about the place, shown when you
   reach it and kept in the journal afterwards. The summits and gaps are
   the figures the guides print; the shelter elevations are close rather
   than surveyed. */
const AT_PTS=[
 {m:  0.0,n:'SPRINGER MOUNTAIN',      k:'summit', t:3,a:.18,e:3782,
  w:'Southern terminus. A bronze plaque set in bare rock, and a register in the stone beside it.'},
 {m:  2.8,n:'STOVER CREEK SHELTER',   k:'shelter',t:0,e:2870,
  w:'The creek below runs through old growth hemlock, rare now that the adelgid has been through.'},
 {m:  4.9,n:'THREE FORKS',            k:'water',  t:0,e:2530,
  w:'Three creeks meet here, and the Benton MacKaye Trail crosses the AT.'},
 {m:  5.2,n:'LONG CREEK FALLS',       k:'water',  t:1,e:2800,
  w:'A short blue blaze to the falls. Hardly anyone walks past it.'},
 {m:  8.1,n:'HAWK MOUNTAIN SHELTER',  k:'shelter',t:1,e:3200,
  w:'The Army Ranger camp is close enough that blank fire in the night is normal here.'},
 {m: 15.8,n:'GOOCH MOUNTAIN SHELTER', k:'shelter',t:1,e:2780,
  w:'About where a first pack gets opened up and made lighter.'},
 {m: 20.5,n:'WOODY GAP',              k:'gap',    t:1,e:3173,
  w:'GA 60. The first road crossing easy enough to hitch out of, down into Suches.'},
 {m: 28.8,n:'BLOOD MOUNTAIN',         k:'summit', t:4,a:1.0,e:4458,

   kind is one of summit, shelter, water, gap, town, border, mark.

   What is authored is the places that have a name and a reason. What is
   generated is everything else: a mark every hundred miles, a halfway
   mark, and unnamed waypoints wherever two authored places are more
   than nine miles apart, so there is always something inside a day's
   walk. A generated waypoint never borrows a real name and never claims
   an elevation.

   Mileages and elevations are written from knowledge, not from a
   guide. On the AT and PCT they should be within a few miles of what

const TQ=[];

   terrain, the way the tarns are. A source is picked on a coarse grid,
   checked for height and slope, and then the water is traced DOWN the
   gradient until the ground flattens out under it. Whatever tiles that
   trace crosses paint it, so it is continuous across tile seams for
   free, and the march shades and occludes it like any other ground. */

  const g0y=(terrainH(sx,sy+1.5)-terrainH(sx,sy-1.5))/3;

   const ay=(terrainH(x,y+1.5)-terrainH(x,y-1.5))/3;
   const m=Math.hypot(ax,ay);

      to it left the valley floor wearing a wide flat sheet of water,
      widest exactly where it was flattest, with tree crowns hanging
      over it: the grey slab with a white edge. Measured over ninety
      falls, the steep part runs out around 0.8 and everything below
      that is the sheet. Stopping there keeps about seven in ten falls

     is the other half of why the tail read as a slab. */

    const i=Math.round(px+nx*o)-ox, j=Math.round(py+ny*o)-oy;
    if(i<0||i>=TILE||j<0||j>=TILE) continue;
    const lat=1-Math.abs(o)/w;

      break: a single white patch at the bottom and nowhere else was
      the other half of the ribbon look. */

/* Tiles wanted soon, baked between frames rather than in the middle of
   one. The camera moves a few world units a frame, so the only tiles
   that newly matter are at the far edge of the view, which is exactly
   what can be seen coming. */
const TQS=new Set();
function queueAhead(camX,camY,FOC){
 /* Rebuilt every frame, nearest first. The view is a wedge, not a box:
    a tile row three hundred units out spans a third of the screen width
    that a row at nine hundred does, and queueing the far row's width
    for every row asked for three times the tiles that can ever be seen.
    The width is taken per row from that row's own distance. */
 TQ.length=0; TQS.clear();
 const reach=DFAR+TILE*2;
 const y0=Math.floor((camY-reach)/TILE), y1=Math.floor((camY+TILE)/TILE);
 for(let ty=y1;ty>=y0;ty--){
  const d=Math.max(TILE,camY-ty*TILE);
  const halfW=(W*0.5)*d/FOC+TILE;
  const x0=Math.floor((camX-halfW)/TILE), x1=Math.floor((camX+halfW)/TILE);
  for(let tx=x0;tx<=x1;tx++){
   const k=tx+','+ty;
   if(TILES.has(k)||TQS.has(k)) continue;
   TQS.add(k); TQ.push([tx,ty,k]);
  }
 }
}
function bakeBudget(budget){
 /* One tile a frame, normally. A tile cannot be baked in halves, so a
    budget shorter than a tile cannot stop one part way; what it can do
    is decline to start another. The camera needs about ten tiles every
    thirty frames, so one a frame stays comfortably ahead, and the deep
    queue at startup is allowed to churn through several. */
 if(!TQ.length) return;
 if(budget<=0&&TQ.length<24) return;
 const t0=performance.now();
 do{
  const e=TQ.shift(); if(!e) break;
  TQS.delete(e[2]);
  if(TILES.has(e[2])) continue;
  const T=buildTile(e[0],e[1]); T.tx=e[0]; T.ty=e[1]; TILES.set(e[2],T);
 }while(TQ.length>24&&performance.now()-t0<budget);
 if(TILES.size>TCAP) evictTiles();
}
let _tkx=1e9,_tky=1e9,_tcur=null;
function tileAt(tx,ty){
 if(tx===_tkx&&ty===_tky&&_tcur) return _tcur;
 const k=tx+','+ty;
 let T=TILES.get(k);
 if(!T){ T=buildTile(tx,ty); T.tx=tx; T.ty=ty; TILES.set(k,T);
  if(TILES.size>TCAP) evictTiles(); }
 _tkx=tx;_tky=ty;_tcur=T; return T;
}
function hAt(wx,wy){
 const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE), T=tileAt(tx,ty);
 return T.h[(((wy-ty*TILE)|0)*TILE)+((wx-tx*TILE)|0)];
}
function cAt(wx,wy){
 const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE), T=tileAt(tx,ty);
 return T.c[(((wy-ty*TILE)|0)*TILE)+((wx-tx*TILE)|0)];
}
/* Interpolated along the screen row only. Depth steps are a third of a
   world unit, so the vertical axis is already oversampled; it is the
   horizontal that staircases. Two lookups instead of four. */
const _S2=[0,0,0,0];
function sampleRow(wx,wy){
 const xi=Math.floor(wx), fx=wx-xi;
 const ty=Math.floor(wy/TILE), ly=((wy-ty*TILE)|0)*TILE;
 let tx=Math.floor(xi/TILE), T=tileAt(tx,ty);
 let k=ly+(xi-tx*TILE);
 const h0=T.h[k], c0=T.c[k];
 const xj=xi+1, tx2=Math.floor(xj/TILE);
 if(tx2!==tx){ T=tileAt(tx2,ty); k=ly+(xj-tx2*TILE); } else k++;
 const h1=T.h[k], c1=T.c[k];
 _S2[0]=h0+(h1-h0)*fx;
 const g=1-fx;
 _S2[1]=((c0&255)*g+(c1&255)*fx);
 _S2[2]=(((c0>>>8)&255)*g+((c1>>>8)&255)*fx);
 _S2[3]=(((c0>>>16)&255)*g+((c1>>>16)&255)*fx);
}

/* ===================================================================
   TREES — baked per species, per size, per variant.
   A tree is drawn once and blitted thereafter, so it can afford a trunk
   with branches, a canopy built from overlapping crowns, a lit side, a
   shaded side, sky holes punched through it, and an outline.
   =================================================================== */
const TC=new Map();
const hbucket=h=> h<10?Math.round(h):h<26?Math.round(h/2)*2:Math.round(h/6)*6;
function treeSprite(sp,h,B,s1,fogLv,tint,blaze,vr){
 vr=vr&3;
 const hb=hbucket(h), key=sp+'|'+hb+'|'+tint+'|'+(blaze?1:0)+'|'+vr;
 let c=TC.get(key); if(c) return c;
 const CW=Math.max(3,Math.ceil(hb*(sp==='fir'?1.0:1.35)))|1;
 const CHh=Math.max(3,Math.ceil(hb*1.08));
 c=document.createElement('canvas'); c.width=CW; c.height=CHh;
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const cx=(CW>>1), gy=CHh-1;
 const VT=[[0,0],[-0.05,.16],[.07,0],[-0.02,-.10]][vr];
 let base=sp==='birch'?_mix(B.cnp,_rgb('#a8cc62'),.46)
         :sp==='fir'  ?_mix(B.cnp,COOL,.14):B.cnp;
 base=_mix(base,_rgb(VT[0]>0?'#b9cc56':'#2f6a4e'),Math.abs(VT[0])*4);
 base=sh(base,VT[1]);
 const lit=sh(base,.38), mid=sh(base,.05), dk=sh(base,-.28), out=sh(base,-.54);
 const trk=sp==='birch'?_rgb('#d8d8cc'):B.trk;
 const F=c2=>_css(c2);
 const dot=(x,y,w2,h2,col)=>{q.fillStyle=col; q.fillRect(Math.round(x),Math.round(y),
   Math.max(1,Math.round(w2)),Math.max(1,Math.round(h2)));};
 const crown=(x,y,r,col)=>{q.fillStyle=col;
  for(let i=-r;i<=r;i++){const w2=Math.round(Math.sqrt(Math.max(0,r*r-i*i))*(1-Math.abs(i)/(r*3.4)));
   if(w2>0) q.fillRect(Math.round(x-w2),Math.round(y+i),w2*2+1,1);}};
 if(sp==='fir'){
  const th=hb*.14, tw=Math.max(1,Math.round(hb*.075));
  dot(cx-tw/2,gy-th,tw,th+1,F(sh(trk,-.18)));
  dot(cx-tw/2,gy-th,Math.max(1,tw/2),th+1,F(sh(trk,.10)));
  const ch2=hb-th, tiers=Math.max(4,Math.round(hb/5));
  for(let tt=tiers-1;tt>=0;tt--){
   const p=tt/(tiers-1), by=gy-th-ch2*p*0.90;
   const r=Math.max(1,hb*.40*(1-p*.80)+(hb>18?1:0));
   q.fillStyle=F(out);
   for(let i=0;i<=r*1.05;i++) q.fillRect(Math.round(cx-r+i*.5),Math.round(by-i*.9),
     Math.max(1,Math.round((r-i*.5)*2)),1);
   q.fillStyle=F(dk);
   for(let i=0;i<=r;i++) q.fillRect(Math.round(cx-r+i*.5)+1,Math.round(by-i*.9)-1,
     Math.max(1,Math.round((r-i*.5)*2)-1),1);
   q.fillStyle=F(mid);
   for(let i=0;i<=r*.9;i++) q.fillRect(Math.round(cx-r*.9+i*.5)+1,Math.round(by-i*.9)-2,
     Math.max(1,Math.round((r*.9-i*.5)*1.5)),1);
   q.fillStyle=F(lit);
   for(let i=0;i<=r*.6;i++) q.fillRect(Math.round(cx-r*.85+i*.4)+1,Math.round(by-i*.9)-2,
     Math.max(1,Math.round((r*.55-i*.35))),1);

  dot(cx,gy-hb,1,Math.max(1,hb*.09),F(lit));
 }else{
  const th=hb*.44, tw=Math.max(1,Math.round(hb*.085));
  dot(cx-tw/2,gy-th,tw,th+1,F(sh(trk,-.22)));
  dot(cx-tw/2,gy-th,Math.max(1,Math.round(tw*.45)),th+1,F(sh(trk,.14)));
  if(hb>14){
   q.fillStyle=F(sh(trk,-.14));
   for(let i=0;i<hb*.22;i++){q.fillRect(Math.round(cx-i*.8),Math.round(gy-th*.75-i*.55),1,1);
    q.fillRect(Math.round(cx+i*.75),Math.round(gy-th*.85-i*.5),1,1);}
   if(sp==='birch'){q.fillStyle=F(sh(trk,-.60));
    for(let i=0;i<4;i++) q.fillRect(cx-tw/2,Math.round(gy-th*(0.2+i*0.2)),Math.max(1,tw-1),1);}
  }
  const ch2=hb-th, w=hb*.52;
  const CLS=[
   [[0,-ch2*.62,.62],[-w*.54,-ch2*.44,.52],[w*.52,-ch2*.46,.50],
    [-w*.30,-ch2*.82,.44],[w*.30,-ch2*.80,.42],[0,-ch2*.95,.33],
    [-w*.62,-ch2*.68,.30],[w*.60,-ch2*.70,.28]],
   [[0,-ch2*.70,.55],[-w*.46,-ch2*.38,.60],[w*.58,-ch2*.52,.44],
    [-w*.18,-ch2*.92,.38],[w*.36,-ch2*.86,.34],[-w*.70,-ch2*.56,.26]],
   [[0,-ch2*.55,.70],[-w*.62,-ch2*.58,.44],[w*.44,-ch2*.40,.56],
    [w*.14,-ch2*.90,.40],[-w*.36,-ch2*.86,.30],[w*.66,-ch2*.74,.24]],
   [[0,-ch2*.78,.48],[-w*.40,-ch2*.52,.54],[w*.40,-ch2*.54,.54],
    [0,-ch2*.40,.62],[-w*.22,-ch2*1.0,.30],[w*.24,-ch2*.98,.28]]];
  const cl=CLS[vr];
  for(const o of cl) crown(cx+o[0],gy-th+o[1],Math.max(1,w*o[2]+1),F(out));
  for(const o of cl) crown(cx+o[0],gy-th+o[1],Math.max(1,w*o[2]),F(dk));
  for(const o of cl) crown(cx+o[0]-w*.13,gy-th+o[1]-w*.11,Math.max(1,w*o[2]*.80),F(mid));
  for(const o of cl) crown(cx+o[0]-w*.26,gy-th+o[1]-w*.22,Math.max(1,w*o[2]*.48),F(lit));
  if(hb>12){
   const im=q.getImageData(0,0,CW,CHh), DD=im.data;
   for(let i=0;i<Math.round(hb*1.3);i++){
    const px2=Math.round(cx+(hash(i*31+hb)*2-1)*w*.85);
    const py=Math.round(gy-th-ch2*(0.30+hash(i*17+hb)*0.60));

    const o=(py*CW+px2)<<2; if(DD[o+3]) DD[o+3]=0;}
   q.putImageData(im,0,0);

 }
 if(blaze&&hb>12){
  const bw=Math.max(1,Math.round(hb*.055)), bh2=Math.max(2,Math.round(hb*.11));
  q.fillStyle=_css(sh([248,250,254],.06));
  q.fillRect(cx-Math.ceil(bw/2),Math.round(gy-(sp==='fir'?hb*.11:hb*.40)*0.74)-bh2,bw,bh2);}
 if(TC.size>2400) TC.clear();

}

const UC=new Map();

   const w2=Math.round(rs*1.55*Math.sqrt(Math.max(0,1-(i/(rs*.34))*(i/(rs*.34)))));
   if(w2>0) q.fillRect(Math.round(cx+rs*.45-w2),Math.round(gy-rs*.12+i),w2*2,1);}
  const draw=(gx,gy3,shade)=>{for(const L of LOB)
   ell(L[0]*rs+gx,L[1]*rs+gy3,L[2]*rs,L[3]*rs,_css(sh(rock,shade)));};
  draw(0,0,-0.58);                          // outline / underside

  for(const L of LOB) ell(L[0]*rs-rs*.16,L[1]*rs-rs*.26,L[2]*rs*.70,L[3]*rs*.62,_css(sh(rock,.16)));
  for(const L of LOB) ell(L[0]*rs-rs*.28,L[1]*rs-rs*.40,L[2]*rs*.40,L[3]*rs*.34,_css(sh(rock,.42)));

              Math.max(1,Math.round(rs*(0.6+hash(f*13+s)*0.5))),1);}
  if(alp<.45){                              /* moss on the uphill side */
   q.fillStyle=_css(sh(_mix(B.fer,_rgb('#6f8f3e'),.5),-.02));
   for(let i=0;i<3;i++)
    q.fillRect(Math.round(cx-rs*(0.9-i*0.3)),Math.round(by2-rs*(0.55-i*0.12)),

  const dr=()=>{for(const o of cl){const rr=Math.max(1,r*o[2]);

    q.fillRect(Math.round(cx+o[0]-w2),Math.round(gy+o[1]+i),w2*2+1,1);}}};
  q.fillStyle=F(sh(B.cnp,-.52)); dr();

  q.fillStyle=F(sh(B.trk,.24));  q.fillRect(cx-lw/2,gy-lh,lw,Math.max(1,lh*.28));
 }else{
  q.fillStyle=F(sh(B.fer,-.10)); q.fillRect(cx,gy-s*4,Math.max(1,s*.8),s*4);
  const fc=_rgb(hash(s*7)<.5?'#e8dc84':'#d892b8');
  q.fillStyle=F(sh(fc,-.20)); q.fillRect(cx-s,gy-s*5,s*3,s);
  q.fillStyle=F(sh(fc,.32));  q.fillRect(cx-s,gy-s*5,s*1.5,s);

/* ---------- the climber, from behind ---------- */
/* ---------- the climber: the Summit Wizard, from behind ----------
   Palette lifted straight out of HERO_ART in the game, so he is the same
   character: yellow hair, red robe with a blue sash, white boots, and the
   staff with its cyan orb. The front-facing portrait is no use here since
   he is walking away from you, so this is the same wardrobe redrawn as a
   back view with a three frame shuffle under the hem. */
/* Three frames that differ only below the hem. The legs used to be
   separated by two outline pixels, which at this size reads as a black
   blob between his feet, and the third frame was a row shorter than the
   other two, so he bobbed a pixel every cycle on top of his own bob. */
/* Seen from behind, a stride is not the legs opening and closing: it is
   one foot planted and back while the other swings forward and lifts. The
   boots trade places vertically and the hem never moves, because a robe
   does not scissor. The cycle runs passing, left, passing, right. */
/* The legs run from under the hem to the ground without a break. There
   used to be an empty row between the two, which at this size reads as a
   pair of boots floating below the robe. A stride shows as one sole
   landing a row before the other, not as the feet moving apart. */
/* ===================================================================
   THE CLIMBER

   He used to be fourteen pixels wide, and "equipping" a helmet meant
   recolouring his hat, so a steel barbute and a straw sunhat looked
   identical on him. He is now sixty four pixels and built in layers:
   a body, and one drawn layer per slot, each painted in the palette of
   the actual item in that slot. Put a crown on and a crown is what
   walks up the trail.

   HERO holds them: 0-2 the body's three walk frames, 3 the wizard hat
   he wears when nothing is on his head, 4-10 the seven helms, 11-15 the
   five chest pieces, 16-19 the four boots. The weapon and the shield
   are not layers at all; they are the item's own icon, drawn at his
   hand and at his side, which is the most literal way for what you
   equipped to be what you see.
   =================================================================== */
const HERO_PAL = ['hero','x',0,0,'crimson','wood'];   // his own colours
const HSPR=new Map(), HLAY=new Map(), HCOMP=new Map();
function heroRows(i){
 const hit=HSPR.get(i); if(hit) return hit;
 const flat=_unrle(HERO[i]), n=Math.round(Math.sqrt(flat.length)), r=[];
 for(let y=0;y<n;y++) r.push(flat.slice(y*n,(y+1)*n));
 HSPR.set(i,r); return r;
}
function heroLayer(i,rec){
 const key=i+'@'+(rec.id||'base');
 const hit=HLAY.get(key); if(hit) return hit;
 const sp=heroRows(i), T=tones(rec), n=sp.length;
 const c=document.createElement('canvas'); c.width=n; c.height=n;
 const q=c.getContext('2d'), img=q.createImageData(n,n), P=img.data;
 for(let y=0;y<n;y++){const row=sp[y];
  for(let x=0;x<n;x++){
   const ch=row[x], o=(y*n+x)*4;
   if(ch==='.'){P[o+3]=0;continue;}
   const col=T[ch]||T.A;
   P[o]=col[0];P[o+1]=col[1];P[o+2]=col[2];P[o+3]=255;}}
 q.putImageData(img,0,0); HLAY.set(key,c); return c;
}
function heroSig(f){
 const eq=S.eq||{};
 return f+'|'+(S.plain?'p':'-')+'|'+SLOTS.map(k=>eq[k]||'-').join(',');
}
const HELMLAY=[4,5,6,7,8,9,10,22,31];
function heroCanvas(f){
 const sig=heroSig(f);
 const hit=HCOMP.get(sig); if(hit) return hit;
 const c=document.createElement('canvas'); c.width=64; c.height=64;
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const eq=S.eq||{}, get=k=>eq[k]&&BYID[eq[k]]?BYID[eq[k]]:null;
 q.drawImage(heroLayer(f%3,HERO_PAL),0,0);
 /* The arms are layers of their own so the side that is holding
    something can be left off. The right one always is: it is either
    closed on a weapon, which climberAt draws, or on his own walking
    staff just below. Drawn as part of the body, the moment he
    picked a sword up the body went on hanging that arm straight down
    while the gripping arm reached out over the top of it and he had
    two right arms. Sleeved in the chest piece's material when he has
    one on, bare in his own colours when he does not. */
 const bd0=get('body');
 const armPal=bd0||HERO_PAL;
 const armR=bd0?(bd0[3]===2?29:27):25;
 const armL=bd0?(bd0[3]===2?30:28):26;
 if(!eq.off)  q.drawImage(heroLayer(armL,armPal),0,0);
 /* Plain dress: no hat he did not earn and no staff he is not carrying,
    just the wanderer in his own clothes. */
 if(S.plain&&!eq.hand) q.drawImage(heroLayer(armR,armPal),0,0);
 /* Boots first, then the body piece. A fauld hangs OVER the top of the
    leg armour; drawn the other way round the greaves rode up over the
    skirt of the cuirass and the armour looked tucked into his trousers. */
 const ft=get('feet'); if(ft) q.drawImage(heroLayer(16+ft[3],ft),0,0);
 const bd=bd0; if(bd) q.drawImage(heroLayer(11+bd[3],bd),0,0);
 /* His own walking staff, and the same gripping arm an equipped
    weapon gets, so that an empty hand is a hand holding a stick rather
    than an arm hanging beside one. The staff already passes through
    where the fist closes. */
 if(!eq.hand&&!S.plain){ q.drawImage(heroLayer(20,HERO_PAL),0,0);
                         q.drawImage(heroLayer(23,armPal),0,0); }
 const hd=get('head');
 /* helm shapes 0-6 are layers 4-10; the ones added since have their
    own slots at the end of the table, so this is a lookup rather than
    arithmetic with an exception bolted onto it */
 if(hd) q.drawImage(heroLayer(HELMLAY[hd[3]],hd),0,0);
 else if(!S.plain) q.drawImage(heroLayer(3,HERO_PAL),0,0);
 HCOMP.set(sig,c);
 if(HCOMP.size>40) HCOMP.delete(HCOMP.keys().next().value);
 return c;
}
/* the equipment changed, so every composite built from it is stale */
function wizApply(){ HCOMP.clear(); }

/* Where his hands are, as a fraction of the 64 pixel sprite. Measured
   off the sprite rather than guessed, which is how they ended up
   floating at his shoulder the first time. */
const HAND_R=[0.695,0.655], HAND_L=[0.300,0.655];
/* A shield is not held in front of the fist, it hangs off the forearm
   outboard of the body. Anchored on the hand it disappeared behind his
   own torso, because his hands sit inside the silhouette. */
/* Pushed inboard these ended up with the grip buried inside his own
   silhouette, so only the far half of the blade showed and the thing
   read as stuck on behind him. The grip belongs AT the hand, just
   outside the body, with the mass of the piece clear of him and only
   its inner edge crossing his arm. */
/* He is walking AWAY, so a thing held in front of him is a thing on
   the far side of his body. Both are drawn behind the torso and
   centred on it, and what you see is the part that sticks out past his
   silhouette: the rim of the shield at his left and below his hip, the
   blade of the sword past his right shoulder, the head and heel of a
   staff above and below him. The body covering most of each one is the
   whole point. */
const SHIELD_A=[0.390,0.630];
/* where his gripping hand sits, as a fraction of the 64 pixel sprite */
const HAND=[0.760,0.648];
const WEAPON_A=[0.600,0.650];
const GRIPC=new Map();
/* and where an item is held, measured off the item: the centroid of its
   grip material, which is the wood or the leather you wrap your hand
   around. A shield has no grip to speak of, so it rides its centre. */
function gripPoint(item){
 const k=item[1]+'#'+item[3];
 const hit=GRIPC.get(k); if(hit) return hit;
 let p;
 if(item[1]==='shield') p=[0.5,0.5];
 else{
  const sp=spriteRows(item,false), n=sp.length;
  let sx=0,sy=0,c=0,ax=0,ay=0,ac=0;
  for(let y=0;y<n;y++){const row=sp[y];
   for(let x=0;x<n;x++){const ch=row[x];
    if(ch==='.') continue;
    ax+=x; ay+=y; ac++;
    if(ch==='j'||ch==='g'||ch==='G'||ch==='H'||ch==='K'){sx+=x;sy+=y;c++;}}}
  p = c>40 ? [sx/c/n, sy/c/n] : [ax/ac/n, ay/ac/n];
 }
 GRIPC.set(k,p); return p;
}
/* The far tip of a weapon: the lit pixel furthest up and to the right,
   which for everything in this set is the point of the blade or the top
   of the staff. */
const TIPC=new Map();
function tipPoint(item){
 const k=item[1]+'#'+item[3];
 const hit=TIPC.get(k); if(hit) return hit;
 const sp=spriteRows(item,false), n=sp.length;
 let bx=0,by=0,best=-1e9;
 for(let y=0;y<n;y++){const row=sp[y];
  for(let x=0;x<n;x++){
   if(row[x]==='.') continue;
   const v=x-y; if(v>best){best=v;bx=x;by=y;}}}
 const p=[bx/n,by/n]; TIPC.set(k,p); return p;
}
/* Anything mythic or legendary that you carry in a hand burns, or does
   whatever its material does instead of burning. The kind is read off
   the palette, so a piece added later gets the right one for free.

   c runs core, mid, outer, deep. rise is how far a tongue reaches as a
   fraction of the blade, speed how fast it flickers, sway how much it
   wanders, sparks how many motes come off the point. */
const AURA={
 flame :{c:[[255,252,228],[255,206,110],[255,146,38],[224, 66, 14]],rise:0.46,speed:0.0068,sway:0.055,n:20,sparks:7, glow:0.52},
 void  :{c:[[234,218,255],[184,134,245],[122, 63,208],[ 46, 18, 80]],rise:0.54,speed:0.0031,sway:0.095,n:16,sparks:10,glow:0.46},
 frost :{c:[[242,255,255],[185,236,255],[ 95,196,240],[ 31,111,168]],rise:0.34,speed:0.0026,sway:0.115,n:14,sparks:12,glow:0.44},
 arcane:{c:[[236,255,236],[152,240,172],[ 56,200,124],[ 14, 90, 60]],rise:0.42,speed:0.0048,sway:0.075,n:16,sparks:9, glow:0.46},
 halo  :{c:[[255,253,236],[255,228,150],[255,190, 70],[190,126, 20]],rise:0.30,speed:0.0019,sway:0.130,n:12,sparks:16,glow:0.60}};
const AURAPAL={sun:'flame',ember:'flame',crimson:'flame',blood:'flame',
 void:'void',obsid:'void',amethyst:'void',dusk:'void',
 frost:'frost',mithril:'frost',sea:'frost',storm:'frost',silver:'frost',cobalt:'frost',
 gold:'halo',ivory:'halo',sun:'halo'};
function auraOf(item){
 if(item[2]<3) return null;
 if(item[1]!=='sword'&&item[1]!=='staff'&&item[1]!=='shield'
  &&item[1]!=='helm'&&item[1]!=='shoes'&&item[1]!=='chest') return null;
 /* a blade that happens to be gold still burns; only a crown shines */
 if(item[1]!=='helm'&&item[4]==='sun') return 'flame';
 return AURAPAL[item[4]]||'arcane';
}
const _rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';

/* A staff and a shield do not have an edge for a flame to run along,
   and giving them one looked like the thing was on fire for no reason.
   They get spectral light instead: the piece's own silhouette, blown
   out a little and painted in its aura colour, laid over a soft field
   that breathes. It glows as the SHAPE it is rather than throwing
   tongues off a notional blade. */
const GLOWSIL=new Map();
function glowSil(item){
 const hit=GLOWSIL.get(item.id); if(hit) return hit;
 const a=gearArt(item,false), n=a.width;
 const c=document.createElement('canvas'); c.width=n; c.height=n;
 const q=c.getContext('2d');
 q.drawImage(a,0,0);
 q.globalCompositeOperation='source-in';
 const C=AURA[auraOf(item)||'arcane'].c[1];
 q.fillStyle='rgb('+C[0]+','+C[1]+','+C[2]+')';
 q.fillRect(0,0,n,n);
 GLOWSIL.set(item.id,c); return c;
}
/* `carry` overrides where the piece is being held. In the world that is
   carryOf(item), because the sprite is drawn offset into the hand. In
   the pack's showcase the piece fills its box, so the caller passes
   [0,0,1] and the light lands on the thing instead of beside it. */
/* Worn armour glows as the shape it is ON HIM, which means a silhouette
   taken from the hero layer he is actually wearing rather than from the
   item's own icon. The icon is a flat front-on chestplate; the layer is
   the one with his shoulders in it. */
/* The paper doll is a 140 pixel box and a full legendary set puts five
   of these on it at once: a flame, a shield's glow, a halo, a torso and
   two boots, all compositing with 'lighter'. At full strength the man
   disappears into a ball of gold. The world view is far enough from the
   camera that they never pile up like that, so the doll turns them
   down rather than every caller doing it. */
let AURAK=1;
const BODY_A=[0.500,0.560];
const BODYSIL=new Map();
function bodySil(bd){
 const key=bd.id+'|'+auraOf(bd);
 const hit=BODYSIL.get(key); if(hit) return hit;
 const src=heroLayer(11+bd[3],bd), n=src.width;
 const c=document.createElement('canvas'); c.width=n; c.height=n;
 const q=c.getContext('2d');
 q.drawImage(src,0,0);
 q.globalCompositeOperation='source-in';
 const C=AURA[auraOf(bd)||'arcane'].c[1];
 q.fillStyle='rgb('+C[0]+','+C[1]+','+C[2]+')';
 q.fillRect(0,0,n,n);
 if(BODYSIL.size>40) BODYSIL.clear();
 BODYSIL.set(key,c); return c;
}
function bodyGlow(ctx,bd,x,y,span,t){
 const A=AURA[auraOf(bd)||'arcane'], C=A.c;
 const pulse=0.70+0.30*Math.sin(t*0.0015);
 const cx=x+span*BODY_A[0], cy=y+span*BODY_A[1], r=span*0.42;
 ctx.save(); ctx.globalCompositeOperation='lighter';
 const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
 rg.addColorStop(0,   _rgba(C[1],(0.24*pulse*AURAK).toFixed(3)));
 rg.addColorStop(0.46,_rgba(C[2],(0.12*pulse*AURAK).toFixed(3)));
 rg.addColorStop(1,   _rgba(C[3],0));
 ctx.fillStyle=rg; ctx.fillRect(cx-r,cy-r,r*2,r*2);
 const sil=bodySil(bd);
 ctx.imageSmoothingEnabled=true;
 for(const [k,a] of [[1.09,0.14],[1.045,0.19],[1.00,0.23]]){
  const d=span*(k-1)/2; ctx.globalAlpha=a*pulse*AURAK;
  ctx.drawImage(sil,x-d,y-d,span*k,span*k);
 }
 ctx.globalAlpha=1; ctx.imageSmoothingEnabled=false; ctx.restore();
}
function drawGlow(ctx,item,x,y,span,t,carry){
 const A=AURA[auraOf(item)||'arcane'], C=A.c;
 const p=carry||carryOf(item), s=span*p[2];
 const bx=x+span*p[0], by=y+span*p[1];
 const pulse=0.70+0.30*Math.sin(t*0.0015);
 const cx=bx+s*0.5, cy=by+s*0.5;
 ctx.save(); ctx.globalCompositeOperation='lighter';
 const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,s*0.60);
 rg.addColorStop(0,   _rgba(C[1],(0.30*pulse*AURAK).toFixed(3)));
 rg.addColorStop(0.46,_rgba(C[2],(0.15*pulse*AURAK).toFixed(3)));
 rg.addColorStop(1,   _rgba(C[3],0));
 ctx.fillStyle=rg; ctx.fillRect(cx-s*0.72,cy-s*0.72,s*1.44,s*1.44);
 const sil=glowSil(item);
 ctx.imageSmoothingEnabled=true;
 for(const [k,a] of [[1.14,0.16],[1.07,0.22],[1.00,0.26]]){
  const d=s*(k-1)/2;
  ctx.globalAlpha=a*pulse*AURAK;
  ctx.drawImage(sil,bx-d,by-d,s*k,s*k);
 }
 ctx.globalAlpha=1; ctx.imageSmoothingEnabled=false;
 ctx.restore();
}
function drawAura(ctx,item,anchor,x,y,span,size,t,carry){
 /* Armour and a shield have no edge to run a flame along, so they glow
    as the shape they are. A blade gets the flame. */
 if(item[1]==='staff'||item[1]==='shield'||item[1]==='chest'
  ||item[1]==='shoes'){ drawGlow(ctx,item,x,y,span,t,carry); return; }
 const A=AURA[auraOf(item)||'arcane'], C=A.c;
 const cp=carry||carryOf(item), s=span*cp[2];
 /* A shield has no point to run a flame along, so it burns up its face
    instead: bottom edge to top edge. */
 const shield=(item[1]==='shield');
 const tp=shield?[0.5,0.12]:tipPoint(item);
 const bp=shield?[0.5,0.88]:gripPoint(item);
 const ax=x+span*cp[0], ay=y+span*cp[1];
 const gx=ax+bp[0]*s, gy=ay+bp[1]*s;
 const tx=ax+tp[0]*s, ty=ay+tp[1]*s;
 const L=Math.hypot(tx-gx,ty-gy);
 ctx.save();
 ctx.globalCompositeOperation='lighter';
 const mx=(gx+tx)/2, my=(gy+ty)/2;
 const rg=ctx.createRadialGradient(mx,my,0,mx,my,L*0.85);
 rg.addColorStop(0,   _rgba(C[1],(A.glow*AURAK).toFixed(3)));
 rg.addColorStop(0.40,_rgba(C[2],(A.glow*0.5*AURAK).toFixed(3)));
 rg.addColorStop(1,   _rgba(C[3],0));
 ctx.fillStyle=rg; ctx.fillRect(mx-L,my-L,L*2,L*2);
 /* tongues licking off the edge, in blocks rather than gradients so
    they belong to the same world as everything else here */
 const N=A.n, unit=Math.max(2,Math.round(s*0.085));
 for(let i=0;i<N;i++){
  const u=(i+0.5)/N;
  const bx=gx+(tx-gx)*u, by=gy+(ty-gy)*u;
  const ph=t*A.speed+i*1.73;
  const h=(0.40+0.60*Math.abs(Math.sin(ph)))*L*A.rise+L*0.10;
  const sway=Math.sin(ph*1.27+i)*L*A.sway;
  const steps=6;
  for(let k=0;k<steps;k++){
   const q=(k+0.5)/steps;
   const w=Math.max(1,Math.round(unit*(1.25-q*0.95)));
   const px=Math.round(bx+sway*q*q-w/2);
   const py=Math.round(by-h*q-w/2);
   ctx.fillStyle = q<0.26 ? _rgba(C[0],0.95)
                 : q<0.52 ? _rgba(C[1],0.86)
                 : q<0.78 ? _rgba(C[2],0.66)
                          : _rgba(C[3],0.42);
   ctx.fillRect(px,py,w,w);
  }
 }
 /* motes coming off the point */
 for(let i=0;i<A.sparks;i++){
  const ph=t*0.0011+i*0.91, dec=(ph%1);
  const w=Math.max(1,Math.round(unit*0.5));
  const ex=tx+Math.sin(ph*9+i)*L*(0.14+A.sway), ey=ty-dec*L*0.60;
  const cc=dec<0.5?C[0]:C[1];
  ctx.fillStyle=_rgba(cc,(0.75*(1-dec)).toFixed(2));
  ctx.fillRect(Math.round(ex),Math.round(ey),w,w);
 }
 ctx.restore();
}

/* HOW EACH PIECE IS CARRIED

   Anchoring everything on the centroid of its grip material put every
   shape somewhere different. A katana, whose grip sits in the corner of
   its icon, flew off the right of the frame; a cleaver with a stubby
   handle ended up above his head; a falchion whose grip had been erased
   by its own knuckle bow fell back to the sprite centroid and vanished
   into his hip. Nothing was wrong with the grip finder. The problem is
   that where a weapon is HELD tells you nothing about where it should
   SIT on a sixty four pixel man.

   So placement is worked out per shape from what the sprite actually
   occupies: measure the content box, scale it to suit the category, and
   put it where that category belongs on him.

     sword   blade into the top right corner, hilt trailing down behind
             him, so the blade always clears his shoulder
     staff   upright at his right side, head above him and heel below
     shield  square on his left, between shoulder and hip

   Computed once per shape, so editing a builder moves it. */
const CARRY=new Map();
function carryOf(item){
 const k=item[1]+'#'+item[3];
 const hit=CARRY.get(k); if(hit) return hit;
 const sp=spriteRows(item,false), n=sp.length;
 let x0=n,x1=-1,y0=n,y1=-1;
 for(let y=0;y<n;y++){const row=sp[y];
  for(let x=0;x<n;x++){ if(row[x]==='.') continue;
   if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }}
 const bw=(x1-x0+1)/n, bh=(y1-y0+1)/n;
 let s,tx,ty;
 /* A hand piece hangs from his hand, so its GRIP goes there and the
    rest follows; a shield rides his forearm, so its middle does. */
 let p;
 if(item[1]==='shield'){
  /* Centred at 0.285 the shield sat half inside the torso, which is
     exactly the strip of frame the grip arm has to show in, so he read
     as a man with a shield strapped to his hip and no arm on it. Out
     to 0.235 and a touch smaller leaves the forearm crossing its face
     with the shield standing clear of him on the far side. */
  s=0.42/Math.max(bw,bh);
  p=[0.235-bw*s*0.5-(x0/n)*s, 0.618-bh*s*0.5-(y0/n)*s, s];
 }else{
  s=(item[1]==='staff') ? 0.98/bh : 0.80/Math.max(bw,bh);
  const gp=gripPoint(item);
  p=[HAND[0]-gp[0]*s, HAND[1]-gp[1]*s, s];
 }
 CARRY.set(k,p); return p;
}
function wield(g,item,unused,x,y,span,size){
 const p=carryOf(item);
 blitGear(g,item,false,Math.round(x+span*p[0]),Math.round(y+span*p[1]),
          Math.round(span*p[2]));
}

/* A head piece gets a ring of light around it rather than tongues off
   an edge: rays out from the crown, and motes turning slowly round it. */
function drawHalo(ctx,item,cx,cy,r,t){
 const A=AURA[auraOf(item)||'halo'], C=A.c;
 ctx.save(); ctx.globalCompositeOperation='lighter';
 const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.9);
 rg.addColorStop(0,   _rgba(C[1],(A.glow*0.85*AURAK).toFixed(3)));
 rg.addColorStop(0.42,_rgba(C[2],(A.glow*0.42*AURAK).toFixed(3)));
 rg.addColorStop(1,   _rgba(C[3],0));
 ctx.fillStyle=rg; ctx.fillRect(cx-r*2,cy-r*2,r*4,r*4);
 const unit=Math.max(1,Math.round(r*0.17));
 for(let i=0;i<10;i++){                       /* rays off the points */
  const a=-Math.PI/2+(i-4.5)*0.30;
  const ph=t*A.speed+i*1.31;
  const L=r*(0.72+0.42*Math.abs(Math.sin(ph)));
  for(let k=0;k<4;k++){
   const q2=(k+0.5)/4, w=Math.max(1,Math.round(unit*(1.2-q2*0.85)));
   ctx.fillStyle = q2<0.3?_rgba(C[0],0.92):q2<0.65?_rgba(C[1],0.76):_rgba(C[2],0.48);
   ctx.fillRect(Math.round(cx+Math.cos(a)*L*q2-w/2),
                Math.round(cy+Math.sin(a)*L*q2-w/2),w,w);
  }
 }
 for(let i=0;i<A.sparks;i++){                 /* motes turning round it */
  const a=t*0.00042+i*(6.283/A.sparks);
  const rr=r*(1.05+0.22*Math.sin(t*0.0013+i));
  const w=Math.max(1,Math.round(unit*0.6));
  ctx.fillStyle=_rgba(i%2?C[0]:C[1],0.70);
  ctx.fillRect(Math.round(cx+Math.cos(a)*rr), Math.round(cy+Math.sin(a)*rr*0.72), w, w);
 }
 ctx.restore();
}
/* his head sits here in the 64 pixel sprite */
const HEAD_A=[0.500,0.172];   // the crown band, now that it sits higher

/* pxH is the height he should stand, in screen pixels */
/* ---------- what the high boots leave behind ----------
   He walks AWAY from the camera, so anything trailing off his heels
   comes back toward the viewer, which on screen is downward. The
   positions are the leg centres measured off the hero sprite (legs sit
   at CX +/- 5.5 of 64) rather than guessed. */
const FOOT_A=[[0.414,0.952],[0.586,0.952]];
function bootFX(ctx,item,x,y,span,t,f,lamp,over){
 const A=AURA[auraOf(item)||'arcane'], C=A.c;
 const lift=[0,2,0][f%3]/64;          // the raised foot, from the walk cycle
 ctx.save(); ctx.globalCompositeOperation='lighter';
 const unit=Math.max(1,Math.round(span/52));
 const night=lamp?1.35:1;
 for(let i=0;i<2;i++){
  const up=(i===1?lift:0)*span;
  const fx=x+span*FOOT_A[i][0], fy=y+span*FOOT_A[i][1]-up;
  const ph=t*A.speed*1.4+i*2.3;
  const beat=0.62+0.38*Math.sin(ph);
  if(!over){
   /* the pool of light the foot is standing in, under the boot so it
      reads as light spilling onto the ground rather than paint on the
      leather */
   const r=span*0.26*(0.80+0.30*beat);
   const rg=ctx.createRadialGradient(fx,fy,0,fx,fy,r);
   rg.addColorStop(0,   _rgba(C[1],(0.80*beat*night).toFixed(3)));
   rg.addColorStop(0.38,_rgba(C[2],(0.42*beat*night).toFixed(3)));
   rg.addColorStop(1,   _rgba(C[3],0));
   ctx.fillStyle=rg; ctx.fillRect(fx-r,fy-r,r*2,r*2);
   continue;
  }
  /* two shining stones set into the boot, on the ankle and the toe.
     These go OVER the hero: drawn under him the boot covered them. */
  for(const [sx,sy,k] of [[-0.030,-0.060,1.0],[0.026,-0.018,0.80]]){
   const b=0.55+0.45*Math.sin(ph*1.7+k*2.1);
   const w=Math.max(1,Math.round(unit*1.5*k));
   const gx=Math.round(fx+span*sx), gy=Math.round(fy+span*sy);
   const rr=w*3.2;
   const sg=ctx.createRadialGradient(gx,gy,0,gx,gy,rr);
   sg.addColorStop(0,_rgba(C[0],(0.70*b*night).toFixed(3)));
   sg.addColorStop(1,_rgba(C[2],0));
   ctx.fillStyle=sg; ctx.fillRect(gx-rr,gy-rr,rr*2,rr*2);
   ctx.fillStyle=_rgba(C[0],Math.min(1,0.72+0.28*b).toFixed(2));
   ctx.fillRect(gx-(w>>1),gy-(w>>1),w,w);
  }
  /* and a short trail off the heel, toward the viewer. Eight steps,
     each a touch narrower and dimmer, wandering with the aura's sway. */

/* ===================================================================
   THE FRAME
   =================================================================== */
/* How tall the bottom frame is, in canvas rows. Measured rather than
   assumed: it changes when the step prompt goes away and when the
   fight bar appears, and the walker has to stay above it either way. */
let BTMH=0;
function measureBtm(){
 const el=document.querySelector('.btm');
 if(!el||!cv.clientHeight||!H) return;
 BTMH=el.getBoundingClientRect().height*(H/cv.clientHeight);
}
let ZB=null, TOPY=null;
function ensureBufs(){
 if(!ZB||ZB.length!==W*H) ZB=new Float32Array(W*H);
 /* The topmost painted row per column, terrain and billboards both.
    The night wash follows this instead of the horizon row, because a
    flat rectangle from the horizon down drew a hard line across every
    ridge and tree that stood above it. */
 if(!TOPY||TOPY.length!==W) TOPY=new Int32Array(W);
}

/* Sprites are rasterised into the same buffer the terrain is, so a tree
   is occluded by the ridge in front of it and occludes the one behind.
   That needs their pixels, not their canvases. */
const PXC=new Map();
function pixOf(key,cnv){
 let S=PXC.get(key); if(S) return S;
 const q=cnv.getContext('2d');
 const d=q.getImageData(0,0,cnv.width,cnv.height);
 S={w:cnv.width,h:cnv.height,px:new Uint32Array(d.data.buffer.slice(0))};
 if(PXC.size>900) PXC.clear();
 PXC.set(key,S); return S;
}
/* ONE drawing per tree, box filtered down to each size it is seen at.
   Every size used to be its own drawing, so a tree coming toward you
   changed SHAPE each time its height crossed a bucket, and a hillside
   of them crawled and flickered as the camera moved. Now the shape
   never changes, only its scale, and filtering the smaller ones stops
   the canopy fizzing between frames. */
const CANON=54;
/* Finer than the generic bucket, because a tree is drawn at exactly
   the size of the level it picks: no resampling, so no crawling
   pixels, and the price of that is a size that steps instead of
   sliding. Small steps keep the stepping invisible. */
const tbucket=h=> h<16?Math.max(1,Math.round(h))
                : h<40?Math.round(h/2)*2 : Math.round(h/4)*4;
function _shrink(S,h2){
 const w2=Math.max(1,Math.round(S.w*h2/S.h));
 const out=new Uint32Array(w2*h2);
 const sxr=S.w/w2, syr=S.h/h2;
 for(let y=0;y<h2;y++){
  const y0=(y*syr)|0, y1=Math.max(y0+1,((y+1)*syr)|0);
  for(let x=0;x<w2;x++){
   const x0=(x*sxr)|0, x1=Math.max(x0+1,((x+1)*sxr)|0);
   let r=0,g2=0,b=0,a=0,n2=0;
   for(let yy=y0;yy<y1;yy++){const row=yy*S.w;
    for(let xx=x0;xx<x1;xx++){
     const sp2=S.px[row+xx];
     if((sp2>>>24)>=128){ r+=sp2&255; g2+=(sp2>>>8)&255; b+=(sp2>>>16)&255; a++; }
     n2++;
    }}
   /* a pixel survives only where the block it covers was mostly solid,
      which keeps the canopy edge crisp instead of fraying into a halo */
   out[y*w2+x]=(a&&a*2>=n2)?(0xff000000|(((b/a)|0)<<16)|(((g2/a)|0)<<8)|((r/a)|0)):0;
  }
 }
 return {w:w2,h:h2,px:out};
}
/* Fill single pixel pinholes: a see-through pixel with solid canopy on
   all four sides. The tree art leaves a dozen or so of these in every
   canopy and _shrink carries them down to every size, and on screen
   they are the light speckles in the forest where the ground behind
   shows through. A pinhole is never meant, so it is filled with the
   average of its four neighbours. Silhouettes are left alone. */
function _plug(S){
 const {w,h,px}=S, so=i=>(px[i]>>>24)>=128, fill=[];
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
  const i=y*w+x;
  if(so(i)||!so(i-1)||!so(i+1)||!so(i-w)||!so(i+w)) continue;
  let r=0,g2=0,b=0;
  for(const j of [i-1,i+1,i-w,i+w]){const c=px[j]; r+=c&255; g2+=(c>>>8)&255; b+=(c>>>16)&255;}
  fill.push(i,0xff000000|((b>>2)<<16)|((g2>>2)<<8)|(r>>2));
 }
 for(let k=0;k<fill.length;k+=2) px[fill[k]]=fill[k+1];

}
const MIP=new Map();
function treePix(spc,hgt,B,tint,blaze,vr){
 const key='T'+spc+tint+(blaze?1:0)+vr;
 let M=MIP.get(key);
 if(!M){ if(MIP.size>220) MIP.clear(); M=new Map(); MIP.set(key,M); }
 const hb=Math.min(CANON,tbucket(hgt));
 let S=M.get(hb); if(S) return S;
 let base=M.get(CANON);
 if(!base){ base=_plug(pixOf(key+'|b',treeSprite(spc,CANON,B,[0,0,0],0,tint,blaze,vr)));
            M.set(CANON,base); }
 S=(hb>=CANON)?base:_plug(_shrink(base,hb));
 M.set(hb,S); return S;
}
/* ---- the fire tower ----
   A timber lookout on a high shoulder: four splayed legs with X bracing
   between them, a stair running up one side, and a glazed cab with a
   railed catwalk round it. Rare enough that meeting one is an event,
   and tall enough to break the skyline from a long way off. */
function towerArt(v){
 const W2=30, H2=52, c=document.createElement('canvas');
 c.width=W2; c.height=H2;
 const q=c.getContext('2d');
 const WOOD='#6b4a2c', WOODL='#9a6e3e', WOODD='#3c2a19';
 const CAB='#7d5b38', CABL='#a87f4c', ROOF='#49545d', ROOFL='#76838f';
 const GLASS='#cfe6f0', DARK='#241c14';
 const R=(x,y,w,h,col)=>{q.fillStyle=col;q.fillRect(Math.round(x),Math.round(y),w,h);};
 const CX2=15;
 /* Legs two pixels wide, not one. At the distance these are seen from,
    a one pixel leg falls through the nearest-neighbour sampling and all
    that survives is the catwalk, which reads as a floating T. */
 for(const side of [-1,1]){
  for(const back of [0,1]){
   const x0=CX2+side*(4+back*2), x1=CX2+side*(10+back*3);
   for(let y=18;y<H2;y++){
    const t=(y-18)/(H2-18);
    R(x0+(x1-x0)*t-1, y, 2, 1, back?WOODD:WOOD);
   }
  }
 }
 /* bracing: three storeys of X, two pixels thick */
 for(let b=0;b<3;b++){
  const y0=21+b*10, y1=y0+10;
  const w0=5+b*2.4, w1=5+(b+1)*2.4;
  for(let t=0;t<=14;t++){
   const f=t/14, y=y0+(y1-y0)*f;
   R(CX2-w0+(w0+w1)*f-1, y, 2, 1, WOODD);
   R(CX2+w0-(w0+w1)*f-1, y, 2, 1, WOODD);
  }
  R(CX2-w1, y1, w1*2, 2, WOOD);
  R(CX2-w1, y1, w1*2, 1, WOODL);
 }
 /* catwalk and railing */
 R(1,16,28,3,WOOD); R(1,16,28,1,WOODL);
 for(let x=2;x<29;x+=4) R(x,12,2,4,WOODD);
 R(1,11,28,2,WOODD); R(1,11,28,1,WOOD);
 /* the cab */
 R(7,5,16,11,CAB); R(7,5,16,2,CABL);
 R(8,8,14,6,GLASS);
 for(let x=8;x<22;x+=5) R(x,8,2,6,CAB);
 R(8,8,14,1,'#f0fbff');
 /* roof, overhanging, with a lightning rod */
 R(4,2,22,3,ROOF); R(4,2,22,1,ROOFL);
 R(11,0,8,2,ROOF); R(11,0,8,1,ROOFL);
 R(14,0,2,3,DARK);
 /* the stair up the near face */
 for(let b=0;b<3;b++){
  const y0=21+b*10, dir=(b%2)?1:-1;
  for(let t=0;t<=10;t++){
   const f=t/10;
   R(CX2+dir*((6+b*2.4)*(1-f)+2*f)-1, y0+10-10*f, 2, 1, WOODL);
  }
 }
 return pixOf('TWR'+v, c);
}

/* ---------- the two big pieces of scenery ----------
   These were drawn inline here with flat fillRect calls and looked it,
   in a world where everything else runs through model/ao/rim/dither/
   outline. They are sprites now, out of shapes_scen.py, and all this
   does is pick a palette for them.

   The ramp is the same letter map tones() builds for gear, except the
   colours come from the biome rather than from a PAL entry:
     tree   body = canopy   grip = trunk   accent = vine */
function ramp(A,B2,C,Q0,Q1){

  o:_mix(A,DARK,.88), n:_mix(A,DARK,.66), q:_mix(A,DARK,.54),
  d:_mix(A,DARK,.34), e:_mix(A,DARK,.15), A:A, B:B2,
  W:_lite(B2,.42), V:_lite(B2,.76),
  x:_mix(C,DARK,.56), c:_mix(C,DARK,.27), C:C, Y:_lite(C,.32), Z:_lite(C,.66),
  j:_mix(Q0,DARK,.56), g:_mix(Q0,DARK,.30), G:Q0, H:Q1, K:_lite(Q1,.42),
  u:[132,94,70], m:[196,148,114], M:[228,190,158]

}
const SCROW=new Map(), SCEN=new Map();
function scenRows(i){

}
/* Quantised on the biome so a walk does not build a new 96x96 canvas

const _qc=c=>((c[0]>>4)<<8)|((c[1]>>4)<<4)|(c[2]>>4);
function scenArt(v,B){

function drawBill(S,sx,sy,scale,d,fog,hz3,bias){
 /* `bias` is how far in front of a billboard the terrain has to be
    before it hides it. Without one a tree is occluded by the very
    ground it stands on: the march writes one depth for every row a
    step fills, so the ZB value under a tree jumps between step depths
    as the camera moves, and a tree whose own depth sits near that
    boundary blinks in and out every frame. */
 const dw=Math.max(1,Math.round(S.w*scale)), dh=Math.max(1,Math.round(S.h*scale));
 if(dw>W*2||dh>H*2) return;
 const x0=Math.round(sx-dw/2), y0=Math.round(sy-dh);
 if(x0>W||x0+dw<0||y0>H) return;
 const nf=1-fog, r0=hz3[0]*fog, g0=hz3[1]*fog, b0=hz3[2]*fog;
 const dz2=d-(bias||0);
 const sxr=S.w/dw, syr=S.h/dh;
 for(let yy=0;yy<dh;yy++){
  const py=y0+yy; if(py<0||py>=H) continue;
  const row=((yy*syr)|0)*S.w, base=py*W;
  for(let xx=0;xx<dw;xx++){
   const px2=x0+xx; if(px2<0||px2>=W) continue;
   const i=base+px2; if(dz2>=ZB[i]) continue;
   const s=S.px[row+((xx*sxr)|0)];
   if((s>>>24)<128) continue;
   const r=((s&255)*nf+r0)|0, g2=(((s>>>8)&255)*nf+g0)|0, b=(((s>>>16)&255)*nf+b0)|0;
   terBuf[i]=0xff000000|(b<<16)|(g2<<8)|r;
   ZB[i]=d;
   if(py<TOPY[px2]) TOPY[px2]=py;
  }
 }
}

 for(let L=0;L<3;L++){
  const n=[6,7,8][L], spd=[0.0038,0.0078,0.0142][L], sc=[1.0,0.78,0.58][L];
  const yb=hz*[0.18,0.40,0.62][L], al=[0.92,0.76,0.58][L]*(S2.day?1:0.48);
  for(let k=0;k<n;k++){
   const cw=Math.round((W*0.26+hash(k*17+L*53)*W*0.44)*sc);
   const ch2=(hz*0.075+hash(k*41+L*7)*hz*0.11)*sc;
   let cx2=((hash(k*11+L*31)*W*2.6-now*spd)%(W+cw*1.4));
   if(cx2<-cw*1.2) cx2+=W+cw*1.4;
   const cy=yb+hash(k*23+L*13)*hz*0.14;
   const sd=k*7+L*101+3, m=3+((hash(sd*31)*3)|0), LB=[];
   for(let q=0;q<m;q++) LB.push({x:(q+0.5)/m*cw+(hash(sd*17+q*7)-0.5)*cw*0.16,
                                 r:ch2*(0.62+hash(sd*13+q*11)*0.85)});
   g.fillStyle='rgba('+(shd[0]|0)+','+(shd[1]|0)+','+(shd[2]|0)+','+(al*0.58).toFixed(2)+')';
   const colH=new Float32Array(cw);
   for(let x=0;x<cw;x++){let mx=ch2*0.26;
    for(const o of LB){const dx=x-o.x, v=o.r*o.r-dx*dx*0.72; if(v>0) mx=Math.max(mx,Math.sqrt(v));}
    colH[x]=mx;
    const hh=Math.round(mx); if(hh>0) g.fillRect(Math.round(cx2+x),Math.round(cy-hh),1,hh);}
   g.fillStyle='rgba('+(lit[0]|0)+','+(lit[1]|0)+','+(lit[2]|0)+','+(al*0.94).toFixed(2)+')';
   for(let x=0;x<cw;x++){const hh=Math.round(colH[x]); if(hh>0)
    g.fillRect(Math.round(cx2+x),Math.round(cy-hh),1,Math.max(1,Math.round(hh*0.40)));}
  }
 }
 return hor;
}

/* ---------- wildlife ---------- */
let fauna=[], nextSpawn=0;
function spawn(now,alp,camX,camY){
 /* birds only. A deer bounding past at this scale reads as a cartoon;
    something riding the updraught off the ridge does not. */
 const type='bird';
 const side=Math.random()<.5?-1:1;
 const d=120+Math.random()*220;
 const n=1+((Math.random()*3)|0);            // they travel in loose groups
 const hzY=HZN0();
 for(let i=0;i<n;i++){
  const wx=camX+side*(70+Math.random()*120)+i*(8+Math.random()*14);
  const wy=camY-d+i*(10+Math.random()*22);
  fauna.push({type,air:true,wx,wy,
   vx:-side*(11+Math.random()*18), vy:4+Math.random()*14,
   /* its height is held in screen terms, so closing on it makes it
      bigger without lifting it out of the frame */
   ty:hzY*(0.52+Math.random()*0.38), vty:(Math.random()-0.5)*3.0,
   born:Math.random()*6.28, flip:side>0});
 }
 nextSpawn=now+3200+Math.random()*6000;
}

function paint(now,dt){
 const g=ctx; ensureBufs();
 const S2=solar();
 const mi=shownMi, B=biomeAt(Math.max(0,mi)), alp=alpineAt(Math.max(0,mi));
 const hzY=HZN(), FOC=Math.max(H*FOCV,W*0.62);
 const camY=camWY(), camX=trailX(camY);
 const camZ=terrainH(camX,camY)+EYE;

 queueAhead(camX,camY,FOC);
 const hor=paintSky(g,now,S2,B);
 const HZC=[hor[0],hor[1],hor[2]];

 /* ---- the ray march ---- */
 terBuf.fill(0); ZB.fill(1e9);
 for(let x=0;x<W;x++) YB[x]=H;
 const dFar=Math.max(430,Math.min(DFAR,FOC*4.2));
 let d=DNEAR, dz=0.32;
 while(d<dFar){
  const sc=FOC/d, wy=camY-d, stepW=1/sc;
  const fog=Math.min(0.74,Math.max(0,(d-150)/620));
  const nf=1-fog, r0=HZC[0]*fog, g0=HZC[1]*fog, b0=HZC[2]*fog;
  let wx=camX-(W*0.5)*stepW;
  for(let x=0;x<W;x++,wx+=stepW){
   sampleRow(wx,wy);
   const sy=hzY+(camZ-_S2[0])*sc;
   const yb=YB[x];
   if(sy<yb){
    const lum=(_S2[1]+_S2[2]+_S2[3])*0.00131;        // 0..1
    const gn=((hash(((wx*167)|0)*7919+((wy*1193)|0))-0.5)
             +(hash(((wx*613)|0)*5471+((wy*389)|0))-0.5)*0.6)
             *(15-lum*9)*nf;
    const r=(_S2[1]*nf+r0+gn)|0, g2=(_S2[2]*nf+g0+gn)|0, b=(_S2[3]*nf+b0+gn)|0;
    const cc=0xff000000|(b<<16)|(g2<<8)|r;
    let top=sy<0?0:sy|0; const bot=yb>H?H:yb|0;
    for(let y=top;y<bot;y++){const i=y*W+x; terBuf[i]=cc; ZB[i]=d;}
    YB[x]=sy;
   }
  }
  /* How far to walk before the next sample. Opening this step up with
     distance looks like an obvious saving, and it is not: on a slope
     facing the camera a single sample fills every row between its own
     screen line and whatever the column already holds, so a step that
     covers several pixels paints the hillside in vertical bands. The
     gentle geometric growth is what keeps distant ground from
     streaking. The cost of this march is inherent; it was bought back
     elsewhere, by baking tiles off the frame instead. */
  d+=dz; dz*=1.0085;
 }

 for(let x=0;x<W;x++) TOPY[x]=YB[x];

 /* ---- scenery, far to near, straight into the same buffer ---- */
 const DOBJ=460, DTOWER=980;
 const halfW=(W*0.5)*DTOWER/FOC;
 const t0=Math.floor((camX-halfW)/TILE), t1=Math.floor((camX+halfW)/TILE);
 const r0t=Math.floor((camY-DTOWER)/TILE), r1t=Math.floor((camY-DNEAR)/TILE);
 const vis=[];
 for(let ty=r0t;ty<=r1t;ty++)for(let tx=t0;tx<=t1;tx++){
  const T=tileAt(tx,ty);
  for(const o of T.objs){
   const dd=camY-o.wy;
   const reach=o.kind==='tower'?DTOWER
              :o.kind==='giant'?DTOWER*0.78:DOBJ;
   if(dd<36||dd>reach) continue;
   const sc=FOC/dd, sx=W*0.5+(o.wx-camX)*sc;
   if(sx<-60||sx>W+60) continue;
   vis.push({o,dd,sc,sx});
  }
 }
 vis.sort((a,b)=>b.dd-a.dd);
 for(const v of vis){
  const o=v.o, sy=hzY+(camZ-o.h)*v.sc;
  let fog=Math.min(0.74,Math.max(0,(v.dd-150)/620));
  /* A billboard appearing at full contrast on the far edge of its range
     is the pop you see as the world comes toward you. Over the last
     fifth of that range it is taken the rest of the way into the haze,
     so it arrives as a shape in the mist and resolves out of it. */
  if(o.kind!=='tower'&&o.kind!=='giant'){
   const edge=(v.dd-DOBJ*0.80)/(DOBJ*0.20);
   if(edge>0) fog=fog+(1-fog)*Math.min(1,edge)*0.92;
  }
  const Bb=biomeAt(Math.max(0,o.mi));
  if(o.kind==='tower'){
   /* A lookout is three or four times a tree, and below about sixteen
      pixels there is not enough of one left to read; better absent than
      a smear of white on a hillside. */
   const worldH=64+(o.s%11), pxH=Math.min(H*0.92,worldH*v.sc);
   if(pxH<16) continue;
   drawBill(towerArt(o.s&3),v.sx,sy,pxH/52,v.dd,fog*0.80,HZC,Math.max(4,v.dd*0.035));
  }else if(o.kind==='giant'){
   const worldH=46+(o.s%14), pxH=Math.min(H*1.5,worldH*v.sc);
   if(pxH<14) continue;
   const S3=scenArt(o.s,Bb);
   drawBill(S3,v.sx,sy,pxH/S3.h,v.dd,fog*0.92,HZC,Math.max(3,v.dd*0.030));
  }else if(o.kind==='tree'){
   /* one tree in twenty three is an old one that got above the rest,
      which is most of what stops a canopy reading as a green carpet */
   const worldH=(7+(o.s%10))*((o.s%23)===0?1.85:1);
   const pxH=Math.min(H*0.70,worldH*v.sc);
   if(pxH<2) continue;
   const vr=o.s&3;
   const spc=o.alp>0.42?'fir':Bb.tree==='fir'?(vr<3?'fir':'hard')
                              :(vr===0?'birch':vr===1?'fir':'hard');
   const S3=treePix(spc,Math.min(60,pxH),Bb,Math.round(o.mi/7),(o.s%37)<6,vr);
   /* Blitted one for one at the level's own size. Scaling the level to
      the exact height resampled it with nearest neighbour, so the rows
      that got doubled moved from frame to frame and the whole canopy
      crawled. */
   drawBill(S3,v.sx,sy,1,v.dd,fog,HZC,Math.max(3,v.dd*0.035));
  }else{
   const worldH=(o.alp>0.5?2.6:1.5)+(o.s%4)*(o.alp>0.5?0.9:0.5);
   const pxH=Math.min(H*0.25,worldH*v.sc);
   if(pxH<2) continue;
   const S3=underPix(o.kind,Math.max(1,Math.min(5,Math.round(pxH/4))),Bb,
                     Math.round(o.alp*4),(o.s>>2)&3);
   drawBill(S3,v.sx,sy,pxH/S3.h,v.dd,fog,HZC,Math.max(2,v.dd*0.030));
  }
 }

 /* ---- whatever is barring the trail ----
    During a fight it is held at a distance that closes as the fight
    goes on, so it arrives in your face by the end instead of being a
    thing you walk through. Out of a fight the next one stands on its
    own mileage and you watch it come. */
 (function(){
  /* Two things can be in front of you at once: whatever is barring the
     trail, and an encounter standing off it. This used to be one slot
     with the boss taking it, which did not show while an encounter
     lasted only the last few steps, but now that its box rides the
     approach the overlap is common enough to see: the box was up with
     nothing beside the trail to look at. Both are collected and drawn
     far to near, so the nearer one lies over the further. */
  const items=[];
  if(S.fight){ items.push({B:BOSS[S.fight.b], dd:70+260*S.fight.close,
                           isEnc:0, side:1}); }
  else{
   /* Only while it is still far off. A fight picks it up at 330 and
      closes from there, so drawing the approach any nearer than that
      put the thing in your face for the mile and a half before it and
      then jumped it backwards when the fight began. */
   /* Measured from your real mileage, not from the camera, because
      the fight triggers on real mileage: ENGAGE is 330 units, and the
      fight then draws it at 330 and closes. Mixing the two frames left
      a gap where the approach had already stopped drawing and the
      fight had not started, which is the thing that looked like the
      boss blinking out. */
   const nb=nextBoss(miles());
   if(nb){ const d2=(nb.m-miles())*RPM;
           if(d2>330) items.push({B:BOSS[nb.b], dd:d2, isEnc:0, side:1}); }
  }
  if(enc) items.push({B:ENC[enc.k], dd:camY-(-enc.m*RPM),
                      isEnc:1, side:enc.side});
  items.sort((a,b)=>b.dd-a.dd);
  for(const it of items) one(it.B,it.dd,it.isEnc,it.side);

  function one(B,dd,isEnc,side){
  /* Its own range, not the scenery's. Computing the haze against DOBJ
     while drawing out to half again as far faded every approaching boss
     to nothing well before you could see it. */
  const BD=900;
  if(dd<BILL_NEAR||dd>BD) return;
  const sc=FOC/dd;
  /* an encounter stands off the tread, on one side or the other */
  const wx=trailX(camY-dd)+(isEnc?side*13:(B.air?26:8));
  const sx=W*0.5+(wx-camX)*sc;
  if(sx<-200||sx>W+200) return;
  const gh=terrainH(wx,camY-dd);
  const bob=isEnc?0:Math.sin(now*0.0011+B.tier)*(B.air?5.2:1.1);
  const h=gh+(!isEnc&&B.air?62+bob*2:0)+bob;
  const sy=hzY+(camZ-h)*sc;
  /* A boss was first given the height of a big tree and came out 31
     pixels tall in the middle of a forest, which is not a boss, it is a
     shrub. These are three or four times a tree on purpose. */
  const worldH=(isEnc?30:(B.air?96:112))*B.sz;
  const pxH=Math.min(H*1.60,worldH*sc);
  if(pxH<6) return;
  /* pixOf, not the canvas: drawBill scales by S.h, and a canvas has
     .height rather than .h, so passing it straight through made every
     dimension NaN and the blit loop ran zero times in silence. */
  const P=bossPix(B,isEnc,pxH);
  /* Blitted at the level's own size. Building a filtered copy and then
     letting drawBill rescale it by a few percent put the point sampler
     back in the path and the grain with it, which is the same reason
     the trees are drawn one for one. */
  const bscale=P.h>=bossArt(B,isEnc).height ? pxH/P.h : 1;
  let fog=Math.min(0.66,Math.max(0,(dd-180)/900));
  const edge=(dd-BD*0.82)/(BD*0.18);
  if(edge>0) fog=fog+(1-fog)*Math.min(1,edge)*0.90;
  drawBill(P,sx,sy,bscale,dd,fog,HZC,Math.max(2,dd*0.02));
  }
 })();

 /* the terrain and everything standing in it go down in one blit */
 terCtx.putImageData(terImg,0,0);
 g.drawImage(terCan,0,0);

 /* ---- landmarks, on their real mileage ----
    Drawn on the canvas rather than into the buffer: there are a handful
    of them and they are always the thing you are meant to see. */
 for(const L of TRAIL){
  const wy=rowOfMile(L.m), dd=camY-wy;
  if(dd<DNEAR||dd>DOBJ) continue;
  const sc=FOC/dd, side=hash(Math.round(L.m*10))<0.5?-1:1;
  const lwx=trailX(wy)+side*TRAILW*2.6;
  const sx=W*0.5+(lwx-camX)*sc, sy=hzY+(camZ-hAt(lwx,wy))*sc;
  if(sx<-70||sx>W+70||sy<-40||sy>H+40) continue;
  const fog=Math.min(0.68,Math.max(0,(dd-150)/620));
  landmark(g,sx,sy,Math.max(0.30,sc*1.15),L.k,biomeAt(L.m));
  if(fog>0.02){ g.fillStyle='rgba('+(HZC[0]|0)+','+(HZC[1]|0)+','+(HZC[2]|0)+','+fog.toFixed(2)+')';
   g.fillRect(Math.round(sx-sc*9),Math.round(sy-sc*20),Math.round(sc*18),Math.round(sc*21)); }
  if(L.m>mi&&dd<DOBJ*0.8){
   const pul=.5+.5*Math.sin(now/330);
   g.fillStyle='rgba(245,198,81,'+(pul*.9).toFixed(2)+')';
   g.fillRect(Math.round(sx),Math.round(sy-sc*26),1,Math.max(2,sc*5));}
 }

 /* ---- wildlife ---- */
 for(const A of fauna){
  const dd=camY-A.wy; if(dd<DNEAR||dd>DOBJ) continue;
  const sc=FOC/dd, sx=W*0.5+(A.wx-camX)*sc;
  const sy=A.ty-pitch;        // held in the sky band, and rides the tilt
  if(sy<-30) continue;        // tilted up out of the frame
  if(sx<-40||sx>W+40) continue;
  const F=FAUNA[A.type];
  const per=135;
  const rows=F.f?F.f[(Math.floor(now/per+A.born*2.7)%F.f.length+F.f.length)%F.f.length]:F.r;
  const ss=Math.max(2,Math.round(F.s*0.75*sc));
  const run=Math.sin(now/260+A.born)*ss*1.6;   // a slow rise and fall
  const top=Math.round(sy-ss*rows.length-run), bw2=rows[0].length*ss;
  const x0=Math.round(sx-bw2/2);
  /* clear of the skyline across its whole span, or it is not in the sky */
  let clear=true;
  for(let q=0;q<=bw2;q+=2){
   const cx2=x0+q; if(cx2<0||cx2>=W) continue;
   if(top+ss*rows.length>=YB[cx2]){clear=false;break;}}
  if(!clear) continue;
  sprite(g,rows,F.p,x0,top,ss,A.flip);
 }

 /* ---- the climber, always in front ---- */
 /* He is a 64 pixel sprite now. Drawn at the old 35-odd pixels he
    read worse than the 14 pixel version did, because downscaling
    detailed pixel art just muddies it. He stands taller. */
 /* 1.84 put him a shade large for the tread. */
 {const CHAR=1.72;
  const dd0=Math.max(34,EYE*FOC/(0.62*(H-hzY)));
  const sc=FOC/dd0;
  /* His SIZE comes off the untilted horizon, never the tilted one.
     Tilting a camera moves what you can see; it does not resize it.
     Taken off hzY his height grew with the pitch, 67 pixels on the
     flat to 96 at full tilt, so he swelled on every descent. */
  const scS=FOC/Math.max(34,EYE*FOC/(0.62*(H-HZN0())));
  /* The band still has to clear the bottom frame, and the companion
     lands about 0.62 of his own height below his feet, so the floor is
     measured from the frame rather than assumed. */
  const floor=H-BTMH-Math.max(6,H*0.012);
  const hi=Math.min(hzY+0.70*(H-hzY), floor-11*scS*CHAR*0.62);
  const lo=Math.min(hzY+0.42*(H-hzY), hi-1);
  const want=Math.min(hzY+0.66*(H-hzY), hi);
  /* Rather than drawing him at a fixed distance and clamping whatever
     screen position that gives, which lifted him off the ground on
     anything but the flat, the DISTANCE is chosen so the trail under
     his feet lands where he should be. On a descent that stands him a
     little further back up the slope, on it, instead of hanging in the
     air above it. Height along the trail is not monotonic in distance,
     so this scans rather than bisects. */
  const syAt=d=>{ const w=camY-d; return hzY+(camZ-hAt(trailX(w),w))*(FOC/d); };
  /* Out to four times the nominal distance rather than 2.2. Coming
     off a summit the trail ahead drops away faster than the magnifier
     falls off, so his feet only land on it from a long way back, and
     the old range simply could not reach: at the worst spots every
     one of the 22 samples was wrong and it took the furthest, still
     90 pixels adrift, which is the clamp below holding him in the air
     over a slope that had gone out from under him.

     Swept over fourteen miles of trail: the median walker was already
     dead on the ground and stays there, the 95th percentile is about
     7 pixels off either way, and the worst case comes down from 90
     pixels to roughly 50. Reaching further still (six times) would
     take the worst to 30, but it stands him up to 366 units out,
     where a sprite drawn at a fixed height reads as a giant on ground
     that far away. Four is where those two stop fighting. */
  let dd=dd0, bestE=Infinity;
  for(let k=0;k<26;k++){
   const d=dd0*(0.45+k*0.082);
   const e=Math.abs(syAt(d)-want);
   if(e<bestE){ bestE=e; dd=d; }
  }
  /* How far ahead of the CAMERA he is standing. The camera is well
     behind him, so this is not a constant and it is not zero: it is
     the distance at which something is level with him. The encounter
     box is timed off it. */
  /* Eased, because the scan picks from 32 discrete distances and so
     the raw value hops between adjacent buckets from one frame to the
     next without the walker having moved. Fed to the box timing raw, that
     jitter ate most of the lead: the box fired 3 steps ahead instead
     of 8, and a hop the wrong way could have put it behind him. */
  walkDD+=(dd-walkDD)*0.18;
  const scP=FOC/dd;
  const wy=camY-dd, cx=trailX(wy);
  const sx=W*0.5+(cx-camX)*scP;
  const rawSy=syAt(dd);
  const sy=Math.max(lo,Math.min(hi,rawSy));
  /* How far the clamp moved him. Anything that walks with him moves
     the same amount, or it keeps its own honest position while he is
     held and the two drift into each other. */
  const slide=sy-rawSy; walkAt=dd;
  /* Constant, and it stays constant. Scaling this by the solved
     distance made him flicker: climberAt turns image smoothing on
     below 64 pixels, so a height wandering either side of 64 swapped
     the sprite between crisp and blurred every frame, which is what
     read as glitching between big and small and as his boots going
     still. The descent problem belongs to the camera, not to him. */
  const pxH=Math.max(26,11*scS*CHAR);
  const bob=Math.sin(walkPhase*Math.PI*0.5)*pxH*0.030;
  g.fillStyle='rgba(10,16,30,.34)';
  g.fillRect(Math.round(sx-pxH*0.19),Math.round(sy-pxH*0.025),
             Math.round(pxH*0.38),Math.max(1,Math.round(pxH*0.05)));
  climberAt(g,sx,sy+bob,pxH,[0,1,0,2][(walkPhase|0)%4],S2.dark>.45);
 /* the companion */
 const pid=S.eq&&S.eq.pet, pg=pid?BYID[pid]:null;
 if(pg){
  /* 4 songbird, 5 raptor, 6 eagle, 9 drake. Everything else has feet.
     This used to test the old five shape numbering, which had the frogs
     airborne and the dragons walking. */
  const fly=(pg[3]===4||pg[3]===5||pg[3]===6||pg[3]===9);
  const ps=Math.max(7,pxH*(fly?0.72:0.50));
  const pf=(((walkPhase*(fly?1.4:0.5))|0)%2)===1;
  g.imageSmoothingEnabled=false;
  if(fly){
   /* it holds station over the trail, up just above the treeline, which
      is where you look when you are trying to find it */
   const top=hzY+(sy-hzY)*0.16;
   const sway=Math.sin(now*0.00039)*pxH*0.70;
   const rise=Math.sin(now*0.00117)*ps*0.13;
   blitGear(g,pg,pf,Math.round(sx-ps*0.5+sway),Math.round(top+rise-ps*0.5),Math.round(ps));
  }else{
   /* Anything with feet follows him down the trail rather than floating
      beside him. It gets its own depth, nearer the camera than he is,
      and is projected the same way he is, so it stands on the path at
      the size that depth deserves and tracks the trail's bends. */
   const pdd=dd*0.74, psc=FOC/pdd;
   const pwy=camY-pdd, pcx=trailX(pwy)+Math.sin(now*0.00052)*3.0;
   const psx=W*0.5+(pcx-camX)*psc;
   const pz=Math.max(10,11*psc*CHAR*0.52);
   /* It walks a little behind him, which on flat ground is about
      fifty pixels lower on the screen. On a steep climb the ground
      under HIS feet is well above the camera and the clamp holds him
      down, so an unshifted companion came out 46 pixels ABOVE him and
      read as sitting on his shoulders. It takes the same slide, and
      then is kept below his feet whatever the ground does. */
   const psy=Math.max(hzY+(camZ-hAt(pcx,pwy))*psc+slide, sy+pxH*0.30);
   const pb=Math.sin(walkPhase*Math.PI*0.5+1.2)*pz*0.05;
   g.fillStyle='rgba(10,16,30,.30)';
   g.fillRect(Math.round(psx-pz*0.22),Math.round(psy-pz*0.02),
              Math.round(pz*0.44),Math.max(1,Math.round(pz*0.05)));
   blitGear(g,pg,pf,Math.round(psx-pz*0.5),Math.round(psy+pb-pz),Math.round(pz));}}
 }

 /* ---- the hour, and the air ---- */
 if(S2.dark>0.02){
  /* Down each column from whatever the topmost painted pixel is, so
     the wash ends on the skyline rather than on a horizontal line
     drawn through it. A short fade at the top of each column keeps
     the edge from reading as a cut. */
  const a=S2.dark*0.46;
  g.fillStyle='rgba(16,26,60,'+a.toFixed(3)+')';
  for(let x=0;x<W;x++){
   const y=TOPY[x];

   g.fillRect(x,Math.max(0,y+2),1,H-Math.max(0,y+2));
  }
  /* the two rows at the skyline itself, at half, so it feathers */
  g.fillStyle='rgba(16,26,60,'+(a*0.5).toFixed(3)+')';

 vg.addColorStop(0,'rgba(8,12,24,0.38)'); vg.addColorStop(1,'rgba(8,12,24,0)');
