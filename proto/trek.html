:root{
 --pix:'Press Start 2P','Courier New',monospace;
 --body:'Courier New',Courier,monospace;
 --bg:#080d14; --solid:#111823; --solid2:#1a2432;
 --panel:rgba(14,22,33,.60); --panel2:rgba(24,34,48,.52);
 --edge:#33445c; --edge2:#5a7392; --ink:#e9f0f6; --dim:#8695a8;
 --gold:#f5c651; --xp:#74e84f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
 overflow:hidden;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
 padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.frame{background:var(--panel);border:3px solid var(--edge);position:relative;
 box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--edge2),4px 4px 0 4px rgba(0,0,0,.5);
 background-image:
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.top{padding:8px 11px}
.trailname{font-family:var(--pix);font-size:8px;letter-spacing:2px;color:var(--gold);
 text-shadow:2px 2px 0 rgba(0,0,0,.7)}
.mile{font-family:var(--pix);font-size:17px;margin:7px 0 3px;letter-spacing:1px;
 text-shadow:2px 2px 0 rgba(0,0,0,.75)}
.mile small{font-size:8px;color:var(--dim);letter-spacing:2px}
.biome{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.btm{margin-top:auto;padding:10px 11px 11px}
.nextrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.nextname{font-family:var(--pix);font-size:8px;letter-spacing:1px;color:var(--gold);
 text-shadow:1px 1px 0 rgba(0,0,0,.7);line-height:1.5}
.nextdist{font-family:var(--pix);font-size:8px;white-space:nowrap}
.track{height:13px;background:#0a121c;border:2px solid var(--edge2);overflow:hidden;
 background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.fill{height:100%;background:linear-gradient(#9bf07a,#48b82e);width:0%;transition:width .5s ease-out}
.steprow{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;
 letter-spacing:1px;color:var(--dim)}
.steprow b{color:var(--xp);font-family:var(--pix);font-size:9px}
.steprow i{color:var(--gold);font-family:var(--pix);font-size:9px;font-style:normal}
.dev{margin-top:8px;display:flex;gap:6px}
.btn{font-family:var(--pix);font-size:7px;letter-spacing:1px;padding:8px 7px;flex:1;
 background:var(--solid2);color:var(--ink);border:2px solid var(--edge2);cursor:pointer;
 box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.devnote{font-size:9px;color:#5c6a7c;letter-spacing:1px;margin-top:7px;text-align:center}

/* ---- pack ---- */
.packbtn{position:absolute;right:9px;bottom:9px;flex:0 0 auto;width:auto;
 padding:8px 10px;color:var(--gold);border-color:var(--gold);
 background:rgba(60,46,12,.70)}
#pack{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
 background:
  radial-gradient(130% 80% at 50% 0%,rgba(46,62,88,.55),transparent 70%),
  linear-gradient(180deg,#0a111b 0%,#070c14 60%,#05080e 100%);
 padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#pack.open{display:flex}
#pack::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.pbar{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:12px;
 border-bottom:2px solid var(--edge);position:relative}
.pbar::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;
 background:linear-gradient(90deg,var(--gold),transparent 60%);opacity:.35}
.ptitle{font-family:var(--pix);font-size:11px;letter-spacing:3px;color:var(--gold);flex:1;
 text-shadow:2px 2px 0 rgba(0,0,0,.8)}
.pcount{font-family:var(--pix);font-size:8px;color:var(--dim);letter-spacing:1px}
.pclose{flex:0 0 auto;width:auto;padding:7px 11px}
.pbody{flex:1;display:flex;gap:14px;min-height:0}

/* the left column: a paper doll with the slots either side of it */
.pleft{flex:0 0 212px;display:flex;flex-direction:column;gap:10px;min-height:0}
.doll{position:relative;flex:0 0 auto;border:2px solid var(--edge2);
 background:
  radial-gradient(70% 55% at 50% 38%,rgba(120,160,210,.16),transparent 70%),
  linear-gradient(180deg,#0e1724,#0a1018);
 box-shadow:inset 0 0 0 2px rgba(0,0,0,.5);
 display:flex;align-items:flex-end;justify-content:center;padding:10px 0 12px;height:168px}
.doll canvas{image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.dollbase{position:absolute;left:18%;right:18%;bottom:9px;height:6px;border-radius:50%;
 background:radial-gradient(50% 100% at 50% 50%,rgba(0,0,0,.55),transparent 70%)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto;min-height:0}
.pslot{display:flex;align-items:center;gap:7px;border:2px solid #243246;
 background:linear-gradient(180deg,rgba(26,38,54,.75),rgba(14,22,33,.75));
 padding:5px 6px;cursor:pointer;min-height:40px;position:relative}
.pslot.on{border-color:var(--gold);
 box-shadow:inset 0 0 0 1px rgba(245,198,81,.22),0 0 10px rgba(245,198,81,.10)}
.pslot:active{transform:translate(1px,1px)}
.pslot canvas{flex:0 0 auto;image-rendering:pixelated}
.pslotxt{font-size:9px;line-height:1.3;letter-spacing:.5px;overflow:hidden;min-width:0}
.pslotxt b{display:block;font-family:var(--pix);font-size:6px;color:#6d7d92;
 letter-spacing:1px;margin-bottom:3px}
.pslotxt span{color:var(--ink);word-break:break-word;display:block;
 overflow:hidden;text-overflow:ellipsis}

/* the right column: tabs, grid, and the piece you are looking at */
.pright{flex:1;display:flex;flex-direction:column;min-width:0}
.ptabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ptab{font-family:var(--pix);font-size:6px;letter-spacing:1px;padding:7px 7px;
 background:linear-gradient(180deg,#1b2736,#121a26);border:2px solid #243246;
 color:#73839a;cursor:pointer}
.ptab.on{border-color:var(--gold);color:var(--gold);
 background:linear-gradient(180deg,#3a3016,#231c0c)}
.pgrid{flex:1;overflow-y:auto;display:grid;gap:7px;align-content:start;
 justify-content:center;grid-template-columns:repeat(auto-fill,76px);
 border:2px solid #1d293a;background:rgba(6,11,18,.66);padding:9px;
 box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
.pgrid::-webkit-scrollbar{width:8px}
.pgrid::-webkit-scrollbar-thumb{background:#243246}
.cell{position:relative;width:76px;height:76px;display:flex;align-items:center;
 justify-content:center;border:2px solid #243246;cursor:pointer;
 background:linear-gradient(180deg,#141f2d,#0c131d)}
.cell canvas{image-rendering:pixelated}
.cell::after{content:'';position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 45%)}
.cell.locked{opacity:.34}
.cell.locked canvas{filter:grayscale(1) brightness(.30)}
.cell.eq{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(245,198,81,.18)}
.cell.sel{outline:2px solid #8fb6e8;outline-offset:1px}
.cell .dup{position:absolute;right:2px;bottom:1px;font-family:var(--pix);font-size:6px;
 color:var(--ink);text-shadow:1px 1px 0 #000;z-index:2}
.pdetail{margin-top:9px;border:2px solid #243246;
 background:linear-gradient(180deg,rgba(26,38,54,.72),rgba(10,16,25,.72));
 padding:10px;min-height:92px;font-size:11px;letter-spacing:.5px;color:var(--dim);
 display:flex;gap:12px;align-items:center}
.dart{flex:0 0 auto;width:112px;height:112px;border:2px solid #2b3a50;
 background:radial-gradient(60% 60% at 42% 36%,rgba(120,160,210,.14),transparent 70%),#0a1119;
 display:flex;align-items:center;justify-content:center}
.dart canvas{image-rendering:pixelated}
.dq{font-family:var(--pix);font-size:26px;color:#2b3a50}
.dtxt{flex:1;min-width:0;line-height:1.6}
.dtxt b{font-family:var(--pix);font-size:9px;letter-spacing:1px;display:block;
 margin-bottom:6px;text-shadow:2px 2px 0 rgba(0,0,0,.7)}
.rr{font-family:var(--pix);font-size:6px;letter-spacing:1px}
.wearbtn{display:block;margin-top:10px;font-family:var(--pix);font-size:7px;letter-spacing:1px;
 padding:8px 12px;background:var(--solid2);color:var(--ink);

<script>
/* ===================================================================
   SUMMIT QUEST — DAILY TREK (prototype, perspective rebuild)

   You walk away from the camera, up a winding trail that recedes to the
   horizon, and the world comes at you continuously.

   The renderer is the pseudo-3D ground plane that racing games used:
   the trail is a chain of fixed-length segments in world space, each
   projected to a screen row by y = horizon + FOCAL/z. Drawing them from
   nearest to furthest and refusing to draw above the lowest row already
   covered gives hidden-surface removal for free, which is what lets the
   ground roll over hills instead of lying flat.

   Everything is on the same 1:3 pixel grid as the rest of the game.
   =================================================================== */

let PX     = 2;    // screen pixels per drawn pixel, set from the window
const SEG  = 0.5;    // world units per trail segment
const MPZ  = 160;    // world units per trail mile
const SPM  = 2100;   // steps per mile, ~30in stride
const NSEG = 620;  // segments drawn ahead

/* ---------- colour ---------- */
const _rgb=h=>{h=h.replace('#','');
 return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const _css=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const _mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const _dark=(a,t)=>_mix(a,[0,0,0],t), _lite=(a,t)=>_mix(a,[255,255,255],t);

/* Stateless. Every feature has to be derivable from its own world slot
   alone, because the world streams past the camera forever. */
function hash(n){let t=(n|0)+0x6D2B79F5|0;t=Math.imul(t^t>>>15,1|t);
 t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}

/* ---------- the trail, northbound from Springer ---------- */
const TRAIL=[
 {m:  0.0,n:'SPRINGER MOUNTAIN',      k:'summit', t:3,a:.18},
 {m:  2.8,n:'STOVER CREEK SHELTER',   k:'shelter',t:0},
 {m:  4.9,n:'THREE FORKS',            k:'water',  t:0},
 {m:  5.2,n:'LONG CREEK FALLS',       k:'water',  t:1},
 {m:  8.1,n:'HAWK MOUNTAIN SHELTER',  k:'shelter',t:1},
 {m: 15.8,n:'GOOCH MOUNTAIN SHELTER', k:'shelter',t:1},
 {m: 20.5,n:'WOODY GAP',              k:'gap',    t:1},
 {m: 28.8,n:'BLOOD MOUNTAIN',         k:'summit', t:4,a:1.0},
 {m: 31.7,n:'NEEL GAP',               k:'town',   t:3},
 {m: 37.4,n:'HOGPEN GAP',             k:'gap',    t:1},
 {m: 43.2,n:'LOW GAP SHELTER',        k:'shelter',t:1},
 {m: 50.5,n:'BLUE MOUNTAIN SHELTER',  k:'shelter',t:1},
 {m: 52.9,n:'UNICOI GAP',             k:'gap',    t:2},
 {m: 56.0,n:'TRAY MOUNTAIN',          k:'summit', t:3,a:.60},
 {m: 69.6,n:'DICKS CREEK GAP',        k:'town',   t:2},
 {m: 78.1,n:'BLY GAP',                k:'border', t:4},
 {m: 85.5,n:'STANDING INDIAN',        k:'summit', t:3,a:.70},
 {m: 99.6,n:'ALBERT MOUNTAIN',        k:'summit', t:4,a:.80},
 {m:100.0,n:'ONE HUNDRED MILES',      k:'mark',   t:4,a:.45},
 {m:106.4,n:'ROCK GAP',               k:'gap',    t:1},
 {m:109.8,n:'WINDING STAIR GAP',      k:'town',   t:3}];

/* ---------- biomes, a keyframed ramp by mile ---------- */
const BIOMES=[
 {m:  0,n:'Georgia hardwood',      sky:['#2c6cb4','#aed8f0'],mtn:'#5d7fa2',fst:'#2f5c3a',
  gnd:'#527f3c',gn2:'#467134',pth:'#8f6e41',cnp:'#3f7d36',trk:'#4c3722',fer:'#63a043',rck:'#857f74'},
 {m: 22,n:'Laurel ridge',          sky:['#2a68b0','#a6d2ec'],mtn:'#57799c',fst:'#2b5536',
  gnd:'#4c7838',gn2:'#406a31',pth:'#88683d',cnp:'#397532',trk:'#48331f',fer:'#5d9a3f',rck:'#7f7a70'},
 {m: 28,n:'Blood Mountain bald',   sky:['#3376bc','#bcdff2'],mtn:'#6c8aa8',fst:'#4a5a44',
  gnd:'#7a7a58',gn2:'#6e7150',pth:'#9c8a66',cnp:'#5a6646',trk:'#5c4e38',fer:'#8a8a58',rck:'#a39d92'},
 {m: 34,n:'Chattahoochee ridge',   sky:['#2764ac',"#a1cfea"],mtn:'#53759a',fst:'#285234',
  gnd:'#487434',gn2:'#3d662e',pth:'#84653a',cnp:'#357130',trk:'#45311d',fer:'#58953b',rck:'#7b766c'},
 {m: 56,n:'Tray Mountain spruce',  sky:['#235ea6','#96c6e6'],mtn:'#4a6c92',fst:'#20472e',
  gnd:'#3d6a30',gn2:'#345c2a',pth:'#7a5c35',cnp:'#2a6630',trk:'#3b2a1a',fer:'#4c8a38',rck:'#737066'},
 {m: 78,n:'North Carolina balsam', sky:['#1f58a0','#8dbfe2'],mtn:'#44648a',fst:'#1c4229',
  gnd:'#36612b',gn2:'#2d5325',pth:'#715437',cnp:'#245c2c',trk:'#352618',fer:'#448030',rck:'#6d6a62'},
 {m: 99,n:'Nantahala high country',sky:['#1b529a','#85b9de'],mtn:'#3e5c82',fst:'#193d26',
  gnd:'#315a28',gn2:'#294d22',pth:'#6b4f33',cnp:'#1f5628',trk:'#312317',fer:'#3e7a2c',rck:'#67645c'}];
const BK=['mtn','fst','gnd','gn2','pth','cnp','trk','fer','rck'];
function biomeAt(mi){
 let a=BIOMES[0],b=BIOMES[0];
 for(let i=0;i<BIOMES.length;i++){ if(BIOMES[i].m<=mi) a=BIOMES[i];
  if(BIOMES[i].m>mi){b=BIOMES[i];break;} b=a; }
 const t=Math.min(1,Math.max(0,(mi-a.m)/Math.max(.001,b.m-a.m)));
 const o={name:(t<.5?a.n:b.n),tree:(t<.5?a.tree:b.tree),
  sky0:_mix(_rgb(a.sky[0]),_rgb(b.sky[0]),t), sky1:_mix(_rgb(a.sky[1]),_rgb(b.sky[1]),t)};
 for(const k of BK) o[k]=_mix(_rgb(a[k]),_rgb(b[k]),t);
 return o;
}

/* ===================================================================
   RENDER CORE  —  voxel space

   You walk away from the camera, into the screen. The ground is a
   heightfield and every screen column is a ray marched from near to far:
   at each step the sample's height projects to a screen row, and if that
   row is above anything already drawn in that column it fills the gap
   downward. One y-buffer per column gives occlusion for free and means
   every pixel is written exactly once.

   This is the renderer Comanche used, and it is the only approach that
   gives a mountain a real silhouette against the sky while it is still a
   long way off, then lets it grow and pass by as you close on it.

   Terrain is a pure function of world position, baked into tiles of
   height and colour so the ray march only ever reads an array. Trees and
   rocks are billboards rasterised into the same buffer at the depth they
   belong to, which is what makes them occlude correctly against the
   ridges in front of and behind them.
   =================================================================== */
const RPM  = 2600;   // world units per trail mile
const TILE = 256;    // heightfield tile edge, world units
const HSTEP= 4;      // coarse height sampling inside a tile
const FOCV = 0.472;  // focal length, as a multiple of screen HEIGHT
const EYE  = 44;     // camera height above the ground it stands on
const DNEAR= 28, DFAR = 980;

const _qh=new URLSearchParams(location.search).get('t');
const _qm=new URLSearchParams(location.search).get('m');
function TOD(){
 if(_qh!==null) return (+_qh)%24;
 const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
}
const HOUR=()=> Math.floor(TOD());
/* Sunrise at six, sunset at half past seven. The whole palette hangs off
   one number: how high the sun is. */
const SUNUP=6.0, SUNDN=19.5;
function solar(){
 const h=TOD(), day=(h>=SUNUP&&h<SUNDN);
 const tt=day?(h-SUNUP)/(SUNDN-SUNUP):((h-SUNDN+24)%24)/(24-(SUNDN-SUNUP));
 const el=Math.sin(tt*Math.PI);
 return {day,tt,el,x:0.06+0.88*tt,y:1-el,
  warm:Math.min(0.78,Math.max(0,1-el*2.6))*(day?1:0.30),
  dark:day?0:Math.min(1,0.30+el*0.78)};
}
const SKYR={
 night:['#070c1e','#0e1832','#1d2949'],
 dawn :['#16305e','#4d6ea0','#eaa471'],
 day  :['#1a5cb6','#3d85d2','#aed6ef'],
 dusk :['#14264e','#524d8a','#f08a5c']};

/* ---- light ---- */
const COOL=[44,52,76], WARM=[255,243,205];
const sh=(c,t)=> t<0?_mix(c,COOL,Math.min(.72,-t*.80)):_mix(c,WARM,Math.min(.86,t*.82));
const LX=-0.62, LY=-0.50, LZ=0.60;

function vnoise(x,y){
 const xi=Math.floor(x), yi=Math.floor(y), fx=x-xi, fy=y-yi;
 const h00=hash(xi*374761+yi*668265), h10=hash((xi+1)*374761+yi*668265);
 const h01=hash(xi*374761+(yi+1)*668265), h11=hash((xi+1)*374761+(yi+1)*668265);
 const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
 return (h00*(1-sx)+h10*sx)*(1-sy)+(h01*(1-sx)+h11*sx)*sy;
}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.28+vnoise(x*4.3,y*4.3)*.17;}
function ridged(x,y){
 let s=0,a=1,f=1,w=0;
 for(let i=0;i<5;i++){const n=1-Math.abs(vnoise(x*f,y*f)*2-1);
  s+=n*n*a; w+=a; a*=.52; f*=2.07;}
 return s/w;
}

/* ---------- state ---------- */
const KEY='sq_trek_proto4';
let S={steps:0,today:0,day:1,opened:[],own:{},eq:{}};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
/* the outfit slot was retired; a save made before that still names its
   pieces, so forget anything the table no longer knows about */
function prune(){
 if(S.own) for(const k in S.own) if(!BYID[k]) delete S.own[k];
 if(S.eq)  for(const k in S.eq)  if(S.eq[k]&&!BYID[S.eq[k]]) S.eq[k]=null;
}
const miles=()=>S.steps/SPM;
if(_qm!==null) S.steps=Math.round((+_qm)*SPM);
let shownMi=miles(), drift=0, surge=0, walkPhase=0;

const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
let W=0,H=0,terCan=null,terCtx=null,terImg=null,terBuf=null,YB=null;
function HZN(){return Math.round(H*0.345);}
function resize(){
 const w=cv.clientWidth||innerWidth, h=cv.clientHeight||innerHeight;
 /* a wide window gets chunkier pixels rather than a wider ray march */
 PX=Math.max(2,Math.round(w/240));
 W=Math.max(1,Math.ceil(w/PX)); H=Math.max(1,Math.ceil(h/PX));
 cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;
 terCan=document.createElement('canvas'); terCan.width=W; terCan.height=H;
 terCtx=terCan.getContext('2d'); terCtx.imageSmoothingEnabled=false;
 terImg=terCtx.createImageData(W,H);
 terBuf=new Uint32Array(terImg.data.buffer);
 YB=new Float32Array(W);
 TILES.clear(); TC.clear(); UC.clear();
}

/* ---- where you are ----
   World runs along -wy as you climb, so everything ahead of you has a
   smaller wy and depth is simply camY minus it. */
const progress=()=> shownMi*RPM+drift;
const camWY=()=> -progress();
const rowOfMile=m=> -m*RPM;
const mileOfRow=Y=> -Y/RPM;
function alpineAt(mi){
 let v=0;
 for(const L of TRAIL){ if(!L.a) continue;
  const d=Math.abs(L.m-mi); if(d>2.6) continue;
  v=Math.max(v,L.a*(1-d/2.6)); }
 return Math.max(0,Math.min(1,v));
}

/* ---- the trail, and the spine it follows ----
   The crest rises and falls along its length, so summits roll toward you,
   grow, and pass under your feet. That is the whole motion of the thing. */
function trailX(wy){
 return 210*Math.sin(wy*0.00062)
      + 78*Math.sin(wy*0.00171+1.7)
      + 26*Math.sin(wy*0.00430+4.1);
}
function spineH(wy){
 return 66
  + 42*Math.sin(wy*0.00128)
  + 15*Math.sin(wy*0.00305+1.3)
  + 7*Math.sin(wy*0.00760+3.1);
}
const TRAILW=3.2;
function terrainH(wx,wy){
 const cx=trailX(wy), dx=wx-cx;
 const wd=78+28*Math.sin(wy*0.00105);
 const fall=Math.exp(-Math.pow(Math.abs(dx)/wd,1.55));
 let h=spineH(wy)*fall;
 /* the range either side, strongest off the crest */
 h+=ridged(wx*0.00108,wy*0.00108)*96*(0.22+0.78*(1-fall));
 h+=ridged(wx*0.00330+7,wy*0.00330)*30;
 h+=fbm(wx*0.0155,wy*0.0155)*5;
 return h;
}

/* ===================================================================
   TILES — height, colour and scenery, baked once per patch of world
   =================================================================== */
const MAT={ROCK:0,SCREE:1,MEADOW:2,FOREST:3,SNOW:4,PATH:5};
const TILES=new Map();
const TQ=[];
function buildTile(tx,ty){
 const ox=tx*TILE, oy=ty*TILE;
 const GN=(TILE/HSTEP)+3;
 const G=new Float32Array(GN*GN);
 for(let j=0;j<GN;j++)for(let i=0;i<GN;i++)
  G[j*GN+i]=terrainH(ox+(i-1)*HSTEP,oy+(j-1)*HSTEP);
 const gAt=(u,v)=>{                     // bilinear, u/v in tile-local units
  const fu=u/HSTEP+1, fv=v/HSTEP+1;
  const iu=Math.min(GN-2,Math.max(0,Math.floor(fu))), iv=Math.min(GN-2,Math.max(0,Math.floor(fv)));
  const tu=fu-iu, tv=fv-iv, o=iv*GN+iu;
  return (G[o]*(1-tu)+G[o+1]*tu)*(1-tv)+(G[o+GN]*(1-tu)+G[o+GN+1]*tu)*tv;
 };
 const Hh=new Float32Array(TILE*TILE);
 for(let j=0;j<TILE;j++)for(let i=0;i<TILE;i++)
  Hh[j*TILE+i]=gAt(i,j)+(hash(((ox+i)*73856+(oy+j)*19349)|0)-0.5)*0.55;

 /* cast shadow: one scan per row, carrying the highest horizon seen so
    far and decaying it by the sun's slope. A ridge that throws no shadow
    into its own valley never reads as having height. */
 const SHD=new Float32Array(TILE*TILE);
 const SUNSL=0.55;
 for(let j=0;j<TILE;j++){
  let hor=-1e9;
  for(let i=0;i<TILE;i++){
   hor-=SUNSL;
   const hv=Hh[j*TILE+i];
   if(hv>=hor){hor=hv; SHD[j*TILE+i]=0;}
   else SHD[j*TILE+i]=Math.min(1,(hor-hv)/9);
  }
 }

 const C=new Uint32Array(TILE*TILE);
 for(let j=0;j<TILE;j++){
  const wy=oy+j, mi=Math.max(0,mileOfRow(wy));
  const B=biomeAt(mi), alp=alpineAt(mi);
  const cx=trailX(wy);
  const rock=_mix(B.rck,_rgb('#9c968a'),.24);
  for(let i=0;i<TILE;i++){
   const wx=ox+i, k=j*TILE+i, h=Hh[k];
   const hx=(Hh[k+(i<TILE-1?1:0)]-Hh[k-(i>0?1:0)])*0.5/1;
   const hy=(Hh[k+(j<TILE-1?TILE:0)]-Hh[k-(j>0?TILE:0)])*0.5/1;
   const inv=1/Math.sqrt(hx*hx+hy*hy+1);
   let lam=(-hx*LX-hy*LY+LZ)*inv;
   const steep=Math.sqrt(hx*hx+hy*hy);
   const open=Math.max(0,Math.min(1,(h-52)/145));
   lam=Math.max(-0.42,lam)*1.05+(0.34+0.30*inv+0.22*open)*0.30;

   const grain=fbm(wx*0.0085,wy*0.0085);
   const fine =fbm(wx*0.075,wy*0.075);
   const dpx=Math.abs(wx-cx);
   let col;
   if(dpx<TRAILW*(0.9+grain*0.4)){
    const e=dpx/(TRAILW*(0.9+grain*0.4));
    col=sh(_mix(_mix(B.pth,_rgb('#6b5a46'),alp*0.55),rock,0.18),
           -0.06-e*0.50+(fine-0.5)*0.30);
    if(hash((wx*7+wy*131)|0)<0.14) col=sh(col,0.30);
    else if(hash((wx*13+wy*71)|0)<0.10) col=sh(col,-0.26);
   }else if(steep>1.05-grain*0.3){
    const facet=Math.sin(wx*0.42+h*0.3)*Math.sin(wy*0.37+fine*2.2);
    col=sh(_mix(_rgb('#6e6a78'),_rgb('#b0a9bb'),fine*0.7+(facet>0?0.16:0)),
           -0.04+(fine-0.5)*0.38+facet*0.16);
   }else if(alp>0.60&&grain>0.46&&steep<0.55){
    /* old snow lying in the hollows, not a cap at some altitude the ridge
       never actually reaches */
    col=sh(_mix(_rgb('#d4e2f6'),_rgb('#ffffff'),fine),0.14+(fine-0.5)*0.16);
   }else if(alp>0.44||open>0.84){
    /* granite: a wide value range and visible facets, because a bald is
       boulders and lichen rather than sand */
    const fct=Math.sin(wx*0.31+h*0.42)*Math.sin(wy*0.27+fine*2.4);
    const g3=_mix(_rgb('#5f6472'),_rgb('#b6b3ad'),fine*0.78+(fct>0?0.18:0));
    col=sh(_mix(g3,B.gn2,Math.max(0,0.22-alp*0.22)+grain*0.14),

 /* scenery, placed on a coarse lattice and thinned hard */
 const objs=[];
 for(let j=0;j<TILE;j+=3)for(let i=0;i<TILE;i+=3){
  const wx=ox+i, wy=oy+j;

let _tkx=1e9,_tky=1e9,_tcur=null;
function tileAt(tx,ty){
 if(tx===_tkx&&ty===_tky&&_tcur) return _tcur;
 const k=tx+','+ty;
 let T=TILES.get(k);
 if(!T){ T=buildTile(tx,ty); T.tx=tx; T.ty=ty; TILES.set(k,T);
  if(TILES.size>84){
   const cx=trailX(camWY())/TILE, cy=camWY()/TILE;
   let worst=null,wd=-1;
   for(const [kk,v] of TILES){
    const dx=v.tx-cx, dy=v.ty-cy, dd2=dx*dx+dy*dy;
    if(dd2>wd){wd=dd2;worst=kk;}}
   if(worst) TILES.delete(worst); } }
 _tkx=tx;_tky=ty;_tcur=T; return T;
}
function hAt(wx,wy){
 const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE), T=tileAt(tx,ty);
 return T.h[(((wy-ty*TILE)|0)*TILE)+((wx-tx*TILE)|0)];
}
function cAt(wx,wy){
 const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE), T=tileAt(tx,ty);
 return T.c[(((wy-ty*TILE)|0)*TILE)+((wx-tx*TILE)|0)];
}
/* Interpolated along the screen row only. Depth steps are a third of a
   world unit, so the vertical axis is already oversampled; it is the
   horizontal that staircases. Two lookups instead of four. */
const _S2=[0,0,0,0];
function sampleRow(wx,wy){
 const xi=Math.floor(wx), fx=wx-xi;
 const ty=Math.floor(wy/TILE), ly=((wy-ty*TILE)|0)*TILE;
 let tx=Math.floor(xi/TILE), T=tileAt(tx,ty);
 let k=ly+(xi-tx*TILE);
 const h0=T.h[k], c0=T.c[k];
 const xj=xi+1, tx2=Math.floor(xj/TILE);
 if(tx2!==tx){ T=tileAt(tx2,ty); k=ly+(xj-tx2*TILE); } else k++;
 const h1=T.h[k], c1=T.c[k];
 _S2[0]=h0+(h1-h0)*fx;
 const g=1-fx;
 _S2[1]=((c0&255)*g+(c1&255)*fx);
 _S2[2]=(((c0>>>8)&255)*g+((c1>>>8)&255)*fx);
 _S2[3]=(((c0>>>16)&255)*g+((c1>>>16)&255)*fx);
}

/* ---------- the climber, from behind ---------- */
/* ---------- the climber: the Summit Wizard, from behind ----------
   Palette lifted straight out of HERO_ART in the game, so he is the same
   character: yellow hair, red robe with a blue sash, white boots, and the
   staff with its cyan orb. The front-facing portrait is no use here since
   he is walking away from you, so this is the same wardrobe redrawn as a
   back view with a three frame shuffle under the hem. */
/* Three frames that differ only below the hem. The legs used to be
   separated by two outline pixels, which at this size reads as a black
   blob between his feet, and the third frame was a row shorter than the
   other two, so he bobbed a pixel every cycle on top of his own bob. */
/* Seen from behind, a stride is not the legs opening and closing: it is
   one foot planted and back while the other swings forward and lifts. The
   boots trade places vertically and the hem never moves, because a robe
   does not scissor. The cycle runs passing, left, passing, right. */
/* The legs run from under the hem to the ground without a break. There
   used to be an empty row between the two, which at this size reads as a
   pair of boots floating below the robe. A stride shows as one sole
   landing a row before the other, not as the feet moving apart. */
/* ===================================================================
   THE CLIMBER

   He used to be fourteen pixels wide, and "equipping" a helmet meant
   recolouring his hat, so a steel barbute and a straw sunhat looked
   identical on him. He is now sixty four pixels and built in layers:
   a body, and one drawn layer per slot, each painted in the palette of
   the actual item in that slot. Put a crown on and a crown is what
   walks up the trail.

   HERO holds them: 0-2 the body's three walk frames, 3 the wizard hat
   he wears when nothing is on his head, 4-10 the seven helms, 11-15 the
   five chest pieces, 16-19 the four boots. The weapon and the shield
   are not layers at all; they are the item's own icon, drawn at his
   hand and at his side, which is the most literal way for what you
   equipped to be what you see.
   =================================================================== */
const HERO_PAL = ['hero','x',0,0,'crimson','wood'];   // his own colours
const HSPR=new Map(), HLAY=new Map(), HCOMP=new Map();
function heroRows(i){
 const hit=HSPR.get(i); if(hit) return hit;
 const flat=_unrle(HERO[i]), n=Math.round(Math.sqrt(flat.length)), r=[];
 for(let y=0;y<n;y++) r.push(flat.slice(y*n,(y+1)*n));
 HSPR.set(i,r); return r;
}
function heroLayer(i,rec){
 const key=i+'@'+(rec.id||'base');
 const hit=HLAY.get(key); if(hit) return hit;
 const sp=heroRows(i), T=tones(rec), n=sp.length;
 const c=document.createElement('canvas'); c.width=n; c.height=n;
 const q=c.getContext('2d'), img=q.createImageData(n,n), P=img.data;
 for(let y=0;y<n;y++){const row=sp[y];
  for(let x=0;x<n;x++){
   const ch=row[x], o=(y*n+x)*4;
   if(ch==='.'){P[o+3]=0;continue;}
   const col=T[ch]||T.A;
   P[o]=col[0];P[o+1]=col[1];P[o+2]=col[2];P[o+3]=255;}}
 q.putImageData(img,0,0); HLAY.set(key,c); return c;
}
function heroSig(f){
 const eq=S.eq||{};
 return f+'|'+SLOTS.map(k=>eq[k]||'-').join(',');
}
function heroCanvas(f){
 const sig=heroSig(f);
 const hit=HCOMP.get(sig); if(hit) return hit;
 const c=document.createElement('canvas'); c.width=64; c.height=64;
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const eq=S.eq||{}, get=k=>eq[k]&&BYID[eq[k]]?BYID[eq[k]]:null;
 q.drawImage(heroLayer(f%3,HERO_PAL),0,0);
 const bd=get('body'); if(bd) q.drawImage(heroLayer(11+bd[3],bd),0,0);
 const ft=get('feet'); if(ft) q.drawImage(heroLayer(16+ft[3],ft),0,0);
 if(!eq.hand) q.drawImage(heroLayer(20,HERO_PAL),0,0);
 const hd=get('head');
 q.drawImage(hd?heroLayer(4+hd[3],hd):heroLayer(3,HERO_PAL),0,0);
 HCOMP.set(sig,c);
 if(HCOMP.size>40) HCOMP.delete(HCOMP.keys().next().value);
 return c;
}
/* the equipment changed, so every composite built from it is stale */
function wizApply(){ HCOMP.clear(); }

/* Where his hands are, as a fraction of the 64 pixel sprite. Measured
   off the sprite rather than guessed, which is how they ended up
   floating at his shoulder the first time. */
const HAND_R=[0.695,0.655], HAND_L=[0.300,0.655];
/* A shield is not held in front of the fist, it hangs off the forearm
   outboard of the body. Anchored on the hand it disappeared behind his
   own torso, because his hands sit inside the silhouette. */
const SHIELD_A=[0.215,0.590];
const GRIPC=new Map();
/* and where an item is held, measured off the item: the centroid of its
   grip material, which is the wood or the leather you wrap your hand
   around. A shield has no grip to speak of, so it rides its centre. */
function gripPoint(item){
 const k=item[1]+'#'+item[3];
 const hit=GRIPC.get(k); if(hit) return hit;
 let p;
 if(item[1]==='shield') p=[0.5,0.5];
 else{
  const sp=spriteRows(item,false), n=sp.length;
  let sx=0,sy=0,c=0,ax=0,ay=0,ac=0;
  for(let y=0;y<n;y++){const row=sp[y];
   for(let x=0;x<n;x++){const ch=row[x];
    if(ch==='.') continue;
    ax+=x; ay+=y; ac++;
    if(ch==='j'||ch==='g'||ch==='G'||ch==='H'||ch==='K'){sx+=x;sy+=y;c++;}}}
  p = c>40 ? [sx/c/n, sy/c/n] : [ax/ac/n, ay/ac/n];
 }
 GRIPC.set(k,p); return p;
}
/* put the item's grip exactly on the given hand */
function wield(g,item,hand,x,y,span,size){
 const gp=gripPoint(item), s=span*size;
 blitGear(g,item,false,
  Math.round(x+span*hand[0]-s*gp[0]),
  Math.round(y+span*hand[1]-s*gp[1]), Math.round(s));
}

/* pxH is the height he should stand, in screen pixels */
function climberAt(g,cx,footY,pxH,f,lamp){
 const c=heroCanvas(f), sc=pxH/64, dw=64*sc;
 const x=cx-dw*0.5, y=footY-pxH;
 const eq=S.eq||{};
 const hand=eq.hand&&BYID[eq.hand]?BYID[eq.hand]:null;
 const off =eq.off &&BYID[eq.off ]?BYID[eq.off ]:null;
 /* the light at the top of whatever he is carrying */
 const T=hand?tones(hand):tones(HERO_PAL);
 const oc=T.Z||T.C, ocs=(oc[0]|0)+','+(oc[1]|0)+','+(oc[2]|0);
 let ox=x+dw*0.78, oy=y+pxH*0.33;
 if(hand){const gp=gripPoint(hand), s=pxH*0.78;
  ox=x+dw*HAND_R[0]+s*(0.56-gp[0]); oy=y+pxH*HAND_R[1]-s*gp[1];}
 const glow=lamp?0.55:0.22, rr=Math.max(4,pxH*0.26);
 const rg=g.createRadialGradient(ox,oy,0,ox,oy,rr);
 rg.addColorStop(0,'rgba('+ocs+','+glow.toFixed(2)+')');
 rg.addColorStop(0.45,'rgba('+ocs+','+(glow*0.30).toFixed(2)+')');
 rg.addColorStop(1,'rgba('+ocs+',0)');
 g.fillStyle=rg; g.fillRect(ox-rr,oy-rr,rr*2,rr*2);
 g.imageSmoothingEnabled = pxH<64;
 g.drawImage(c,Math.round(x),Math.round(y),Math.round(dw),Math.round(pxH));
 g.imageSmoothingEnabled=false;
 /* Both carried pieces go in FRONT of him. Behind the body the shield
    disappeared into his own silhouette; in front, with the anchors set
    outboard, his arm still crosses the inner edge of each one, which is
    all the overlap needed to read as carried rather than pasted on. */
 if(off)  wield(g,off, SHIELD_A,x,y,pxH,0.52);
 if(hand) wield(g,hand,HAND_R,  x,y,pxH,0.78);
}
/* ---------- wildlife ---------- */
/* One species. The hawk was big enough that its silhouette had to hold up
   to a proper look, and it did not; everything else in here stopped being
   spawned when the ground animals came out. */
const FAUNA={
 bird:{s:0.34,p:{o:'#2b3340',w:'#99a6b8'},
  r:['.........','ooo...ooo','..ooooo..','....o....','.........'],
  f:[['oo.....oo','.oo...oo.','..oo.oo..','...ooo...','....o....'],
     ['.........','ooo...ooo','..ooowo..','....o....','.........'],
     ['.........','.........','.ooo.ooo.','oo..w..oo','....o....'],
     ['.........','ooo...ooo','..ooowo..','....o....','.........']]}};
function sprite(g,rows,pal,x,y,s,flip){
 const w=rows[0].length;
 for(let r=0;r<rows.length;r++){const row=rows[r];
  for(let c=0;c<w;c++){const ch=row[c]; if(!ch||ch==='.')continue;
   const col=pal[ch]; if(!col)continue;
   g.fillStyle=col;
   g.fillRect(x+(flip?(w-1-c):c)*s,y+r*s,s,s);}}
}


/* ===================================================================
   THE FRAME
   =================================================================== */
let ZB=null;
function ensureBufs(){ if(!ZB||ZB.length!==W*H) ZB=new Float32Array(W*H); }

/* Sprites are rasterised into the same buffer the terrain is, so a tree
   is occluded by the ridge in front of it and occludes the one behind.
   That needs their pixels, not their canvases. */
const PXC=new Map();
function pixOf(key,cnv){
 let S=PXC.get(key); if(S) return S;
 const q=cnv.getContext('2d');
 const d=q.getImageData(0,0,cnv.width,cnv.height);
 S={w:cnv.width,h:cnv.height,px:new Uint32Array(d.data.buffer.slice(0))};
 if(PXC.size>900) PXC.clear();
 PXC.set(key,S); return S;
}
function treePix(spc,hgt,B,tint,blaze,vr){
 const hb=hbucket(hgt);
 return pixOf('T'+spc+hb+tint+(blaze?1:0)+vr,
              treeSprite(spc,hgt,B,[0,0,0],0,tint,blaze,vr));
}
function underPix(kind,s,B,alpLv,vb){
 return pixOf('U'+kind+s+alpLv+vb, undergrowth(kind,s,B,[0,0,0],0,alpLv,vb));
}

function drawBill(S,sx,sy,scale,d,fog,hz3){
 const dw=Math.max(1,Math.round(S.w*scale)), dh=Math.max(1,Math.round(S.h*scale));
 if(dw>W*2||dh>H*2) return;
 const x0=Math.round(sx-dw/2), y0=Math.round(sy-dh);
 if(x0>W||x0+dw<0||y0>H) return;
 const nf=1-fog, r0=hz3[0]*fog, g0=hz3[1]*fog, b0=hz3[2]*fog;
 const sxr=S.w/dw, syr=S.h/dh;
 for(let yy=0;yy<dh;yy++){
  const py=y0+yy; if(py<0||py>=H) continue;
  const row=((yy*syr)|0)*S.w, base=py*W;
  for(let xx=0;xx<dw;xx++){
   const px2=x0+xx; if(px2<0||px2>=W) continue;
   const i=base+px2; if(d>=ZB[i]) continue;
   const s=S.px[row+((xx*sxr)|0)];
   if((s>>>24)<128) continue;
   const r=((s&255)*nf+r0)|0, g2=(((s>>>8)&255)*nf+g0)|0, b=(((s>>>16)&255)*nf+b0)|0;
   terBuf[i]=0xff000000|(b<<16)|(g2<<8)|r;
   ZB[i]=d;
  }
 }
}

/* ---------- the sky ---------- */
function paintSky(g,now,S2,B){
 const hz=HZN();
 let A,Bk,mt;
 if(S2.day){
  if(S2.tt<0.15){A=SKYR.dawn;Bk=SKYR.day;mt=S2.tt/0.15;}
  else if(S2.tt>0.85){A=SKYR.day;Bk=SKYR.dusk;mt=(S2.tt-0.85)/0.15;}
  else {A=SKYR.day;Bk=SKYR.day;mt=0;}
 }else{
  if(S2.tt<0.20){A=SKYR.dusk;Bk=SKYR.night;mt=S2.tt/0.20;}
  else if(S2.tt>0.80){A=SKYR.night;Bk=SKYR.dawn;mt=(S2.tt-0.80)/0.20;}
  else {A=SKYR.night;Bk=SKYR.night;mt=0;}
 }
 const bd=i=>_mix(_rgb(A[i]),_rgb(Bk[i]),mt);
 const zen=bd(0), mid=bd(1), hor=bd(2);
 const gr=g.createLinearGradient(0,0,0,hz+2);
 gr.addColorStop(0,_css(zen)); gr.addColorStop(0.58,_css(mid)); gr.addColorStop(1,_css(hor));
 g.fillStyle=gr; g.fillRect(0,0,W,hz+3);
 /* below the horizon the sky is only ever seen through haze */
 g.fillStyle=_css(hor); g.fillRect(0,hz+2,W,H-hz);

 const starA=S2.day?Math.max(0,1-S2.el*5):Math.min(1,0.32+S2.el);
 if(starA>0.03) for(let i=0;i<200;i++){
  const b=hash(i*3+9), tw=0.62+0.38*Math.sin(now/((i%7)*170+430)+i);
  const y=(hash(i*13+5)*hz)|0;
  g.fillStyle='rgba(255,255,255,'+((b<.10?.9:b<.42?.5:.24)*starA*tw*(1-y/hz*0.5)).toFixed(3)+')';
  g.fillRect((hash(i*7+1)*W)|0,y,1,1);}

 const sx=Math.round(W*S2.x), sy=Math.round(hz*S2.y*0.92);
 const disc=S2.day?_mix(_rgb('#fff6cc'),_rgb('#ffb55e'),S2.warm):_rgb('#eef3ff');
 const halo=S2.day?_mix(_rgb('#ffd98a'),_rgb('#ff8a4a'),S2.warm):_rgb('#9fb6e0');
 const rg=g.createRadialGradient(sx,sy,0,sx,sy,W*(S2.day?0.46:0.28));
 rg.addColorStop(0,'rgba('+(halo[0]|0)+','+(halo[1]|0)+','+(halo[2]|0)+','+(S2.day?0.58:0.30)+')');
 rg.addColorStop(0.34,'rgba('+(halo[0]|0)+','+(halo[1]|0)+','+(halo[2]|0)+','+(S2.day?0.18:0.09)+')');
 rg.addColorStop(1,'rgba('+(halo[0]|0)+','+(halo[1]|0)+','+(halo[2]|0)+',0)');
 g.fillStyle=rg; g.fillRect(0,0,W,hz+3);
 const R2=Math.round(W*(S2.day?0.040:0.032));
 g.fillStyle=_css(disc);
 for(let y=-R2;y<=R2;y++){const w2=Math.round(Math.sqrt(Math.max(0,R2*R2-y*y)));
  if(sy+y<hz+3) g.fillRect(sx-w2,sy+y,w2*2+1,1);}
 if(!S2.day){g.fillStyle=_css(_mix(disc,_rgb('#9aa8c4'),.34));
  g.fillRect(sx-R2*.45,sy-R2*.35,R2*.42,R2*.36);
  g.fillRect(sx+R2*.12,sy+R2*.22,R2*.38,R2*.32);}

 /* cloud, three ranks. One column at a time so the alpha never doubles
    where lobes overlap, which is what makes a soft shape out of hard
    pixels. */
 const lit=_mix(_rgb('#ffffff'),_mix(_rgb('#ffd3a0'),_rgb('#5c6f9a'),S2.day?0:0.75),
                S2.warm*0.8+(S2.day?0:0.45));
 const shd=_mix(_mix(hor,zen,.42),_rgb('#59688f'),0.32);
 for(let L=0;L<3;L++){
  const n=[6,7,8][L], spd=[0.0038,0.0078,0.0142][L], sc=[1.0,0.78,0.58][L];
  const yb=hz*[0.18,0.40,0.62][L], al=[0.92,0.76,0.58][L]*(S2.day?1:0.48);
  for(let k=0;k<n;k++){
   const cw=Math.round((W*0.26+hash(k*17+L*53)*W*0.44)*sc);
   const ch2=(hz*0.075+hash(k*41+L*7)*hz*0.11)*sc;
   let cx2=((hash(k*11+L*31)*W*2.6-now*spd)%(W+cw*1.4));
   if(cx2<-cw*1.2) cx2+=W+cw*1.4;
   const cy=yb+hash(k*23+L*13)*hz*0.14;
   const sd=k*7+L*101+3, m=3+((hash(sd*31)*3)|0), LB=[];
   for(let q=0;q<m;q++) LB.push({x:(q+0.5)/m*cw+(hash(sd*17+q*7)-0.5)*cw*0.16,
                                 r:ch2*(0.62+hash(sd*13+q*11)*0.85)});
   g.fillStyle='rgba('+(shd[0]|0)+','+(shd[1]|0)+','+(shd[2]|0)+','+(al*0.58).toFixed(2)+')';
   const colH=new Float32Array(cw);
   for(let x=0;x<cw;x++){let mx=ch2*0.26;
    for(const o of LB){const dx=x-o.x, v=o.r*o.r-dx*dx*0.72; if(v>0) mx=Math.max(mx,Math.sqrt(v));}
    colH[x]=mx;
    const hh=Math.round(mx); if(hh>0) g.fillRect(Math.round(cx2+x),Math.round(cy-hh),1,hh);}
   g.fillStyle='rgba('+(lit[0]|0)+','+(lit[1]|0)+','+(lit[2]|0)+','+(al*0.94).toFixed(2)+')';
   for(let x=0;x<cw;x++){const hh=Math.round(colH[x]); if(hh>0)
    g.fillRect(Math.round(cx2+x),Math.round(cy-hh),1,Math.max(1,Math.round(hh*0.40)));}
  }
 }
 return hor;
}

/* ---------- wildlife ---------- */
let fauna=[], nextSpawn=0;
function spawn(now,alp,camX,camY){
 /* birds only. A deer bounding past at this scale reads as a cartoon;
    something riding the updraught off the ridge does not. */
 const type='bird';
 const side=Math.random()<.5?-1:1;
 const d=120+Math.random()*220;
 const n=1+((Math.random()*3)|0);            // they travel in loose groups
 const hzY=HZN();
 for(let i=0;i<n;i++){
  const wx=camX+side*(70+Math.random()*120)+i*(8+Math.random()*14);
  const wy=camY-d+i*(10+Math.random()*22);
  fauna.push({type,air:true,wx,wy,
   vx:-side*(11+Math.random()*18), vy:4+Math.random()*14,
   /* its height is held in screen terms, so closing on it makes it
      bigger without lifting it out of the frame */
   ty:hzY*(0.52+Math.random()*0.38), vty:(Math.random()-0.5)*3.0,
   born:Math.random()*6.28, flip:side>0});
 }
 nextSpawn=now+3200+Math.random()*6000;
}

function paint(now,dt){
 const g=ctx; ensureBufs();
 const S2=solar();
 const mi=shownMi, B=biomeAt(Math.max(0,mi)), alp=alpineAt(Math.max(0,mi));
 const hzY=HZN(), FOC=Math.max(H*FOCV,W*0.62);
 const camY=camWY(), camX=trailX(camY);
 const camZ=terrainH(camX,camY)+EYE;

 const hor=paintSky(g,now,S2,B);
 const HZC=[hor[0],hor[1],hor[2]];

 /* ---- the ray march ---- */
 terBuf.fill(0); ZB.fill(1e9);
 for(let x=0;x<W;x++) YB[x]=H;
 const dFar=Math.max(430,Math.min(DFAR,FOC*4.2));
 let d=DNEAR, dz=0.32;
 while(d<dFar){
  const sc=FOC/d, wy=camY-d, stepW=1/sc;
  const fog=Math.min(0.74,Math.max(0,(d-150)/620));
  const nf=1-fog, r0=HZC[0]*fog, g0=HZC[1]*fog, b0=HZC[2]*fog;
  let wx=camX-(W*0.5)*stepW;
  for(let x=0;x<W;x++,wx+=stepW){
   sampleRow(wx,wy);
   const sy=hzY+(camZ-_S2[0])*sc;
   const yb=YB[x];
   if(sy<yb){
    const lum=(_S2[1]+_S2[2]+_S2[3])*0.00131;        // 0..1
    const gn=((hash(((wx*167)|0)*7919+((wy*1193)|0))-0.5)
             +(hash(((wx*613)|0)*5471+((wy*389)|0))-0.5)*0.6)
             *(15-lum*9)*nf;
    const r=(_S2[1]*nf+r0+gn)|0, g2=(_S2[2]*nf+g0+gn)|0, b=(_S2[3]*nf+b0+gn)|0;
    const cc=0xff000000|(b<<16)|(g2<<8)|r;
    let top=sy<0?0:sy|0; const bot=yb>H?H:yb|0;
    for(let y=top;y<bot;y++){const i=y*W+x; terBuf[i]=cc; ZB[i]=d;}
    YB[x]=sy;
   }
  }
  d+=dz; dz*=1.0085;
 }

 /* ---- scenery, far to near, straight into the same buffer ---- */
 const DOBJ=460;
 const halfW=(W*0.5)*DOBJ/FOC;
 const t0=Math.floor((camX-halfW)/TILE), t1=Math.floor((camX+halfW)/TILE);
 const r0t=Math.floor((camY-DOBJ)/TILE), r1t=Math.floor((camY-DNEAR)/TILE);
 const vis=[];
 for(let ty=r0t;ty<=r1t;ty++)for(let tx=t0;tx<=t1;tx++){
  const T=tileAt(tx,ty);
  for(const o of T.objs){
   const dd=camY-o.wy; if(dd<36||dd>DOBJ) continue;
   const sc=FOC/dd, sx=W*0.5+(o.wx-camX)*sc;
   if(sx<-60||sx>W+60) continue;
   vis.push({o,dd,sc,sx});
  }
 }
 vis.sort((a,b)=>b.dd-a.dd);
 for(const v of vis){
  const o=v.o, sy=hzY+(camZ-o.h)*v.sc;
  const fog=Math.min(0.74,Math.max(0,(v.dd-150)/620));
  const Bb=biomeAt(Math.max(0,o.mi));
  if(o.kind==='tree'){
   const worldH=7+(o.s%10); const pxH=Math.min(H*0.55,worldH*v.sc);
   if(pxH<2) continue;
   const vr=o.s&3;
   const spc=o.alp>0.42?'fir':Bb.tree==='fir'?(vr<3?'fir':'hard')
                              :(vr===0?'birch':vr===1?'fir':'hard');
   const S3=treePix(spc,Math.min(60,pxH),Bb,Math.round(o.mi/7),(o.s%37)<6,vr);
   drawBill(S3,v.sx,sy,pxH/S3.h,v.dd,fog,HZC);
  }else{
   const worldH=(o.alp>0.5?2.6:1.5)+(o.s%4)*(o.alp>0.5?0.9:0.5);
   const pxH=Math.min(H*0.25,worldH*v.sc);
   if(pxH<2) continue;
   const S3=underPix(o.kind,Math.max(1,Math.min(5,Math.round(pxH/4))),Bb,
                     Math.round(o.alp*4),(o.s>>2)&3);
   drawBill(S3,v.sx,sy,pxH/S3.h,v.dd,fog,HZC);
  }
 }

 /* the terrain and everything standing in it go down in one blit */
 terCtx.putImageData(terImg,0,0);
 g.drawImage(terCan,0,0);

 /* ---- landmarks, on their real mileage ----
    Drawn on the canvas rather than into the buffer: there are a handful
    of them and they are always the thing you are meant to see. */
 for(const L of TRAIL){
  const wy=rowOfMile(L.m), dd=camY-wy;
  if(dd<DNEAR||dd>DOBJ) continue;
  const sc=FOC/dd, side=hash(Math.round(L.m*10))<0.5?-1:1;
  const lwx=trailX(wy)+side*TRAILW*2.6;
  const sx=W*0.5+(lwx-camX)*sc, sy=hzY+(camZ-hAt(lwx,wy))*sc;
  if(sx<-70||sx>W+70||sy<-40||sy>H+40) continue;
  const fog=Math.min(0.68,Math.max(0,(dd-150)/620));
  landmark(g,sx,sy,Math.max(0.30,sc*1.15),L.k,biomeAt(L.m));
  if(fog>0.02){ g.fillStyle='rgba('+(HZC[0]|0)+','+(HZC[1]|0)+','+(HZC[2]|0)+','+fog.toFixed(2)+')';
   g.fillRect(Math.round(sx-sc*9),Math.round(sy-sc*20),Math.round(sc*18),Math.round(sc*21)); }
  if(L.m>mi&&dd<DOBJ*0.8){
   const pul=.5+.5*Math.sin(now/330);
   g.fillStyle='rgba(245,198,81,'+(pul*.9).toFixed(2)+')';
   g.fillRect(Math.round(sx),Math.round(sy-sc*26),1,Math.max(2,sc*5));}
 }

 /* ---- wildlife ---- */
 for(const A of fauna){
  const dd=camY-A.wy; if(dd<DNEAR||dd>DOBJ) continue;
  const sc=FOC/dd, sx=W*0.5+(A.wx-camX)*sc;
  const sy=A.ty;                              // held in the sky band
  if(sx<-40||sx>W+40) continue;
  const F=FAUNA[A.type];
  const per=135;
  const rows=F.f?F.f[(Math.floor(now/per+A.born*2.7)%F.f.length+F.f.length)%F.f.length]:F.r;
  const ss=Math.max(2,Math.round(F.s*0.75*sc));
  const run=Math.sin(now/260+A.born)*ss*1.6;   // a slow rise and fall
  const top=Math.round(sy-ss*rows.length-run), bw2=rows[0].length*ss;
  const x0=Math.round(sx-bw2/2);
  /* clear of the skyline across its whole span, or it is not in the sky */
  let clear=true;
  for(let q=0;q<=bw2;q+=2){
   const cx2=x0+q; if(cx2<0||cx2>=W) continue;
   if(top+ss*rows.length>=YB[cx2]){clear=false;break;}}

 }

 /* ---- the climber, always in front ---- */
 /* He is a 64 pixel sprite now. Drawn at the old 35-odd pixels he
    read worse than the 14 pixel version did, because downscaling
    detailed pixel art just muddies it. He stands taller. */
 {const CHAR=2.05;
  /* pick the depth that puts his feet where we want them on screen, rather
     than fixing the depth and hoping: on a short window a fixed depth lands
     him below the frame */
  const dd=Math.max(34,EYE*FOC/(0.62*(H-hzY)));
  const sc=FOC/dd;
  const wy=camY-dd, cx=trailX(wy);
  const sx=W*0.5+(cx-camX)*sc, sy=hzY+(camZ-hAt(cx,wy))*sc;
  const pxH=Math.max(26,11*sc*CHAR);
  const bob=Math.sin(walkPhase*Math.PI*0.5)*pxH*0.030;
  g.fillStyle='rgba(10,16,30,.34)';
  g.fillRect(Math.round(sx-pxH*0.19),Math.round(sy-pxH*0.025),
             Math.round(pxH*0.38),Math.max(1,Math.round(pxH*0.05)));
  climberAt(g,sx,sy+bob,pxH,[0,1,0,2][(walkPhase|0)%4],S2.dark>.45);
 /* the companion */
 const pid=S.eq&&S.eq.pet, pg=pid?BYID[pid]:null;
 if(pg){
  /* 4 songbird, 5 raptor, 6 eagle, 9 drake. Everything else has feet.
     This used to test the old five shape numbering, which had the frogs
     airborne and the dragons walking. */
  const fly=(pg[3]===4||pg[3]===5||pg[3]===6||pg[3]===9);
  const ps=Math.max(7,pxH*(fly?0.72:0.50));
  const pf=(((walkPhase*(fly?1.4:0.5))|0)%2)===1;
  g.imageSmoothingEnabled=false;
  if(fly){
   /* it holds station over the trail, up just above the treeline, which
      is where you look when you are trying to find it */
   const top=hzY+(sy-hzY)*0.16;
   const sway=Math.sin(now*0.00039)*pxH*0.70;
   const rise=Math.sin(now*0.00117)*ps*0.13;
   blitGear(g,pg,pf,Math.round(sx-ps*0.5+sway),Math.round(top+rise-ps*0.5),Math.round(ps));
  }else{
   /* Anything with feet follows him down the trail rather than floating
      beside him. It gets its own depth, nearer the camera than he is,
      and is projected the same way he is, so it stands on the path at
      the size that depth deserves and tracks the trail's bends. */
   const pdd=dd*0.74, psc=FOC/pdd;
   const pwy=camY-pdd, pcx=trailX(pwy)+Math.sin(now*0.00052)*3.0;
   const psx=W*0.5+(pcx-camX)*psc;
   const psy=hzY+(camZ-hAt(pcx,pwy))*psc;
   const pz=Math.max(10,11*psc*CHAR*0.52);
   const pb=Math.sin(walkPhase*Math.PI*0.5+1.2)*pz*0.05;
   g.fillStyle='rgba(10,16,30,.30)';
   g.fillRect(Math.round(psx-pz*0.22),Math.round(psy-pz*0.02),
              Math.round(pz*0.44),Math.max(1,Math.round(pz*0.05)));
   blitGear(g,pg,pf,Math.round(psx-pz*0.5),Math.round(psy+pb-pz),Math.round(pz));}}
 }

 /* ---- the hour, and the air ---- */
 if(S2.dark>0.02){
  g.fillStyle='rgba(16,26,60,'+(S2.dark*0.46).toFixed(3)+')'; g.fillRect(0,hzY,W,H-hzY);}
 if(S2.warm>0.02&&S2.day){
  g.fillStyle='rgba(255,150,80,'+(S2.warm*0.16).toFixed(3)+')'; g.fillRect(0,0,W,H);}
 const vw=Math.round(W*0.13);
 let vg=g.createLinearGradient(0,0,vw,0);
 vg.addColorStop(0,'rgba(8,12,24,0.38)'); vg.addColorStop(1,'rgba(8,12,24,0)');

 vg.addColorStop(0,'rgba(8,12,24,0.38)'); vg.addColorStop(1,'rgba(8,12,24,0)');
 g.fillStyle=vg; g.fillRect(W-vw,0,vw,H);
}

/* ---------- motion ---------- */
function step(dt,now){
 const target=miles(), d=target-shownMi;
 /* The mountain keeps coming while you watch. The mile count underneath
    is still only ever your real steps. */
 surge=Math.max(0,surge-dt*.00070);
 drift+=(15+surge*620)*dt/1000;
 if(Math.abs(d)>0.0004) shownMi+=d*Math.min(1,dt/900);
 walkPhase+=dt/330*(1+surge*4.5);
 const camY=camWY(), camX=trailX(camY);
 const alp=alpineAt(Math.max(0,shownMi));
 if(now>nextSpawn) spawn(now,alp,camX,camY);
 for(const A of fauna){
  A.wx+=A.vx*dt/1000; A.wy+=A.vy*dt/1000;
  A.ty+=A.vty*dt/1000;                        // a slow rise and fall
  const lo=HZN()*0.44, hi=HZN()*0.95;
  if(A.ty<lo){A.ty=lo; A.vty=Math.abs(A.vty);}
  if(A.ty>hi){A.ty=hi; A.vty=-Math.abs(A.vty);}
 }
 fauna=fauna.filter(A=>Math.abs(A.wx-camX)<420&&(camY-A.wy)>0&&(camY-A.wy)<520).slice(-8);
}

const GID=g=>g[1][0]+g[0].toLowerCase().replace(/[^a-z0-9]/g,'');

const DARK=[12,11,18];

/* Three ramps, each running dark to light, out of the two materials a
   piece is made of: what it is, and what you hold it by.

   q d e A B W V   the body
   x c C Y Z       the brass, the gem, the glow
   j g G H K       the wood or the leather
   o n             the ink line and the soft edge under it

   Four tones was a cartoon. The boss art in the main game carries sixty
   colours a sprite; this is how far a palette-swapped system can go in
   the same direction, and it is far enough that a cuirass now has a
   lit shoulder and a shadowed waist instead of one flat grey. */
function tones(g){
 const P=PAL[g[4]].map(_rgb), Q=(PAL[g[5]]||PAL.leather).map(_rgb);
 const A=P[0], B=P[1], C=P[2];
 return {
  o:_mix(A,DARK,.88), n:_mix(A,DARK,.66),
  q:_mix(A,DARK,.54), d:_mix(A,DARK,.34), e:_mix(A,DARK,.15),
  A:A, B:B, W:_lite(B,.42), V:_lite(B,.76),
  x:_mix(C,DARK,.56), c:_mix(C,DARK,.27), C:C, Y:_lite(C,.32), Z:_lite(C,.66),
  j:_mix(Q[0],DARK,.56), g:_mix(Q[0],DARK,.30), G:Q[0], H:Q[1], K:_lite(Q[1],.42),
  u:[132,94,70], m:[196,148,114], M:[228,190,158]
 };
}
/* ===================================================================
   DRAWING A PIECE

   Crisp pixel art, which means the sprite carries its own shading and
   the renderer adds nothing. An earlier version of this file upscaled a
   small mask and synthesised the form with a bevel, a specular and a
   procedural material texture. It was the wrong aesthetic: it produced
   smooth plastic objects, and a plastic sword next to a pixel world
   reads as a mistake rather than a style.

   So the sprites are authored at 64x64 with an explicit tone ramp, and
   this does nothing but map a character to a colour. Two tones of metal
   plus a highlight, two tones of grip, and an accent for the brass. The
   palette per item is what makes a hundred pieces out of forty shapes.
   =================================================================== */
/* A 64x64 sprite is 4096 characters and most of them are nothing, so
   the table is stored run length encoded as <char><count> and unpacked
   once, on first use. */
const SPC=new Map();
function _unrle(s){
 let out='', i=0;
 while(i<s.length){
  const c=s[i++]; let n=0, has=false;
  while(i<s.length){const d=s.charCodeAt(i); if(d<48||d>57) break; n=n*10+(d-48); i++; has=true;}
  out+=c.repeat(has?n:1);
 }
 return out;
}
function spriteRows(g,alt){
 const pet=(alt&&g[1]==='pet');
 const key=pet?('p#'+g[3]):(g[1]+'#'+g[3]);
 const hit=SPC.get(key); if(hit) return hit;
 const raw=pet?PETALT[g[3]]:SHAPE[g[1]][g[3]];
 let r;
 if(Array.isArray(raw)) r=raw;                 /* already plain rows */
 else{
  const flat=_unrle(raw), n=Math.round(Math.sqrt(flat.length));
  r=[]; for(let y=0;y<n;y++) r.push(flat.slice(y*n,(y+1)*n));
 }
 SPC.set(key,r); return r;
}
const ART=new Map(), ARTMAX=260;
function gearArt(g,alt){
 const key=g.id+(alt?'#a':'');
 const hit=ART.get(key);
 if(hit){ART.delete(key);ART.set(key,hit);return hit;}
 const sp=spriteRows(g,alt);
 const T=tones(g), N=sp.length;
 const c=document.createElement('canvas'); c.width=N; c.height=N;
 const q=c.getContext('2d'), img=q.createImageData(N,N), P=img.data;
 for(let y=0;y<N;y++){const row=sp[y];
  for(let x=0;x<N;x++){
   const ch=row[x], i=(y*N+x)*4;
   if(ch==='.'){P[i+3]=0;continue;}
   const col=T[ch]||T.A;
   P[i]=col[0]; P[i+1]=col[1]; P[i+2]=col[2]; P[i+3]=255;}}
 q.putImageData(img,0,0);
 ART.set(key,c);
 if(ART.size>ARTMAX) ART.delete(ART.keys().next().value);
 return c;
}
/* Nearest neighbour when the piece is being shown at or above its own
   size, because that is the whole point of pixel art; a real filter on
   the way DOWN, because dropping every other row of a 64px sprite to
   fit a 32px slot loses limbs. */
function blitGear(ctx2,g,alt,x,y,size){
 const c=gearArt(g,alt);
 ctx2.imageSmoothingEnabled = size < c.width;
 if(size<c.width) ctx2.imageSmoothingQuality='high';
 ctx2.drawImage(c,x,y,size,size);
 ctx2.imageSmoothingEnabled=false;
}

/* ===================================================================
   CHEST — opened, not awarded
   =================================================================== */
const fx=document.getElementById('fx'), fg=fx.getContext('2d');
const fxh=document.getElementById('fxhi'), hg=fxh.getContext('2d');
let anim=null, chestQ=[];

function startChest(){
 if(!chestQ.length) return;
 const L=chestQ[0], d=roll(L.t), R=RAR[d[2]];
 const isNew=grant(d);
 anim={L,d,R,t0:performance.now(),done:false,sp:[]};
 const box=document.getElementById('chest');
 box.classList.add('open');
 document.getElementById('clm').innerHTML=L.n+'<br>MILE '+L.m.toFixed(1);
 document.getElementById('crar').textContent=R[0];
 document.getElementById('crar').style.color=R[1];
 document.getElementById('citem').textContent=d[0];
 document.getElementById('citem').style.color=R[1];
 document.getElementById('ckind').textContent=
  (isNew?'NEW · ':'ALREADY YOURS · ')+SLOTNAME[CAT2SLOT[d[1]]];
 for(const id of ['clm','crar','citem','ckind','cok'])
  document.getElementById(id).classList.remove('show');
 setTimeout(()=>document.getElementById('clm').classList.add('show'),250);
 requestAnimationFrame(fxFrame);
}
/* The mile you are at tilts the roll. It does not guarantee anything,
   and a legendary can fall out of the first chest on Springer. */
function roll(tier){
 const r=Math.random()+tier*0.085;
 let rar=r>1.34?4:r>1.14?3:r>0.88?2:r>0.52?1:0;
 /* about one chest in six holds a companion instead of a piece of kit */
 const pet=Math.random()<0.17;
 const pool=GEAR.filter(g=>(g[1]==='pet')===pet);
 let at=pool.filter(g=>g[2]===rar);
 while(!at.length&&rar>0){rar--; at=pool.filter(g=>g[2]===rar);}
 if(!at.length) at=pool;
 return at[(Math.random()*at.length)|0];
}

/* the whole reveal, on one timeline, in milliseconds */
const T_DROP=420, T_SHAKE=1750, T_BURST=1900, T_RISE=2700, T_SETTLE=3150;
function fxFrame(now){
 if(!anim) return;
 const r=fx.getBoundingClientRect();
 const w=r.width||fx.clientWidth||innerWidth, h=r.height||fx.clientHeight||innerHeight;
 const FW=Math.max(8,Math.ceil(w/PX)), FH=Math.max(8,Math.ceil(h/PX));
 if(fx.width!==FW||fx.height!==FH){fx.width=FW;fx.height=FH;}
 fg.imageSmoothingEnabled=false; fg.clearRect(0,0,FW,FH);
 /* the piece itself is drawn on its own layer at device resolution, so
    128x128 of detail is not thrown away by the pixel buffer */
 const HD=Math.min(2,window.devicePixelRatio||1);
 const HW=Math.round(w*HD), HH=Math.round(h*HD);
 if(fxh.width!==HW||fxh.height!==HH){fxh.width=HW;fxh.height=HH;}
 hg.clearRect(0,0,HW,HH);
 hg.imageSmoothingEnabled=true; hg.imageSmoothingQuality='high';
 const t=now-anim.t0, R=anim.R, col=_rgb(R[1]);
 /* the chest sits in the middle of the room left above the caption,
    so the lid and the item always have somewhere to go */
 const info=document.querySelector('.cinfo');
 const capTop=info?Math.max(FH*0.52,(info.getBoundingClientRect().top-r.top)/PX):FH*0.62;
 const cx=Math.round(FW/2), cy=Math.round(capTop-FH*0.06);
 const S=Math.max(2,Math.round(Math.min(FW/22,FH/34)));

 /* --- 1. it falls in and lands --- */
 let dy=0, squash=0;
 if(t<T_DROP){ const p=t/T_DROP; dy=-(1-p)*(1-p)*Math.min(FH*.45,cy-S*6); }
 else if(t<T_DROP+140){ const p=(t-T_DROP)/140; squash=Math.sin(p*Math.PI)*.45; }

 /* --- 2. it shakes, harder and harder, and light leaks out --- */
 let sx=0, lid=0, glow=0;
 if(t>T_DROP && t<T_SHAKE){
  const p=(t-T_DROP)/(T_SHAKE-T_DROP);
  sx=Math.sin(t/(46-p*30))*S*(.18+p*.85);
  glow=p*p;
  if(p>.55) lid=(p-.55)/.45*0.30;
 }
 /* --- 3. the lid goes, and the flash --- */
 if(t>=T_SHAKE && t<T_BURST){ const p=(t-T_SHAKE)/(T_BURST-T_SHAKE); lid=.30+p*1.4; glow=1; }
 if(t>=T_BURST){ lid=1.7; glow=1; }

 /* flash ring */
 if(t>T_SHAKE-60 && t<T_SHAKE+320){
  const p=Math.max(0,Math.min(1,(t-(T_SHAKE-60))/380));
  fg.fillStyle='rgba(255,255,255,'+((1-p)*.85).toFixed(2)+')';
  const r=p*FW*.9;
  fg.fillRect(cx-r/2,cy-r/2*.5,r,r*.5);
 }

 /* --- the beam --- */
 if(glow>0){
  const bw=Math.max(1,Math.round(S*(1.2+glow*2.4)));
  for(let i=0;i<10;i++){
   const a=(glow*(.22-i*.02)*(0.6+0.4*Math.sin(now/180+i))).toFixed(3);
   fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a+')';
   fg.fillRect(cx-bw/2-i*2,cy-S*2-i*S*1.1,bw+i*4,S*2+i*S*1.1);
  }
 }

 /* --- the chest itself ---
    Planked body, iron bands, a lock plate, and a half-round lid hinged at
    the back. Drawn as pixel art rather than as stacked rectangles, because
    this is the thing the whole animation is about. */
 const by=cy+dy;
 const woodD=_rgb('#3f2714'), woodM=_rgb('#7a5430'), woodL=_rgb('#a37747');
 const iron =_rgb('#4a4a58'),  ironL=_rgb('#9a9aae'), out=_rgb('#17110a');
 const bw=Math.round(S*7)|1, bh=Math.round(S*4.2*(1-squash)+S*4.2*squash*0.55);
 const RC=(x,y,w,h,c2)=>{fg.fillStyle=_css(c2);
  fg.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
 const drawBox=()=>{
  const x0=cx-bw/2+sx, y0=by-bh;
  RC(x0-1,y0-1,bw+2,bh+2,out);
  for(let i=0;i<bw;i++){
   const plank=Math.floor(i/Math.max(1,S*1.4))%2;
   const edge=(i%Math.max(1,Math.round(S*1.4))===0);
   let c2=plank?woodM:_mix(woodM,woodL,.35);
   if(edge) c2=woodD;
   for(let j=0;j<bh;j++){
    const v=j/bh;
    RC(x0+i,y0+j,1,1,_mix(c2,v>0.78?woodD:_mix(c2,woodL,(1-v)*0.30),v>0.78?0.7:0.4));}
  }
  /* iron bands and the corner straps */
  RC(x0,y0,Math.max(1,S*.7),bh,iron); RC(x0,y0,Math.max(1,S*.7),Math.max(1,bh*.4),ironL);
  RC(x0+bw-S*.7,y0,Math.max(1,S*.7),bh,iron);
  RC(x0+bw-S*.7,y0,Math.max(1,S*.7),Math.max(1,bh*.4),_mix(iron,ironL,.5));
  RC(x0,y0+bh-S*.5,bw,Math.max(1,S*.5),_mix(iron,out,.45));
  /* the lock plate, in the rarity colour */
  const lw=Math.max(2,S*1.7);
  RC(cx-lw/2+sx,by-bh*.62,lw,lw*.95,_css?_mix(col,out,.35):col);
  RC(cx-lw/2+sx,by-bh*.62,lw,Math.max(1,lw*.34),_lite(col,.40));
  RC(cx-lw*.17+sx,by-bh*.62+lw*.30,Math.max(1,lw*.34),Math.max(1,lw*.40),out);
 };
 const lidOpen=Math.max(0,Math.min(1,lid/1.55));
 const drawLid=()=>{
  const lh=Math.max(2,Math.round(S*2.6*(1-lidOpen*0.80)));
  const ly=Math.round(by-bh-lh-lidOpen*S*1.6);
  const x0=cx-bw/2+sx;
  for(let j=0;j<lh;j++){
   /* u is 1 at the crown and 0 where the lid meets the box, so the widest
      row is the bottom one. The other way round gives an upturned bowl. */
   const u=1-(j+0.5)/lh;
   const w2=Math.round(bw*0.5*Math.sqrt(Math.max(0,1-u*u*0.72)));
   const yy=ly+j;
   fg.fillStyle=_css(out); fg.fillRect(cx+sx-w2-1,yy,w2*2+3,1);
   for(let i=-w2;i<=w2;i++){
    const lat=(i+w2)/(2*w2+.001);
    let c2=_mix(woodM,woodL,u*0.46+(1-lat)*0.34);
    if(Math.floor((i+w2)/Math.max(1,S*1.4))%2) c2=_mix(c2,woodD,.22);
    fg.fillStyle=_css(c2); fg.fillRect(cx+sx+i,yy,1,1);}
  }
  fg.fillStyle=_css(iron);
  fg.fillRect(cx+sx-Math.max(1,S*.8),ly,Math.max(2,S*1.6),lh);
  fg.fillStyle=_css(_lite(col,.34));
  fg.fillRect(cx+sx-Math.max(1,S*.5),ly,Math.max(1,S*1.0),lh);
  fg.fillStyle=_css(ironL);
  fg.fillRect(cx+sx-Math.max(1,S*.8),ly,Math.max(2,S*1.6),1);
  fg.fillStyle=_css(out); fg.fillRect(x0-1,ly+lh,bw+2,1);
 };
 /* the dark inside, revealed as the lid lifts */
 const drawInside=()=>{
  if(lidOpen<0.08) return;
  const ih=Math.round(S*1.9*lidOpen);
  fg.fillStyle=_css(_mix(out,[0,0,0],.4));
  fg.fillRect(cx-bw/2+sx+Math.round(S*.7),by-bh-ih,bw-Math.round(S*1.4),ih+1);
  fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(0.5*lidOpen).toFixed(2)+')';
  fg.fillRect(cx-bw/2+sx+Math.round(S*.9),by-bh-Math.max(1,ih*.5),bw-Math.round(S*1.8),Math.max(1,ih*.5));
 };
 /* light spilling out of an open chest, from behind the lid */
 if(lidOpen>0.18){
  const op=Math.min(1,(lidOpen-0.18)/0.6), BH=S*11;
  for(let j=0;j<BH;j++){
   const u=j/BH;
   const w2=Math.round(bw*0.46*(1-u*0.30));
   const a2=op*0.42*Math.pow(1-u,1.5);
   fg.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a2.toFixed(3)+')';
   fg.fillRect(cx+sx-w2,Math.round(by-bh-j),w2*2,1);}
 }
 /* once it is open the lid sits behind the box */
 if(lidOpen>0.3){ drawLid(); drawInside(); drawBox(); }
 else { drawBox(); drawLid(); }
 /* dust kicked up on landing */
 if(t>T_DROP&&t<T_DROP+420){
  const p=(t-T_DROP)/420;
  fg.fillStyle='rgba(190,178,160,'+((1-p)*.55).toFixed(2)+')';
  for(let i=0;i<14;i++){
   const a2=(i/14)*Math.PI*2, rr=p*S*7*(0.5+hash(i*13)*0.8);
   fg.fillRect(Math.round(cx+Math.cos(a2)*rr),Math.round(by-p*S*2.2*hash(i*7)),
               1+(hash(i*3)<.3?1:0),1);}
 }

 /* --- the item rises out, glowing --- */
 if(t>T_BURST){
  const p=Math.min(1,(t-T_BURST)/(T_RISE-T_BURST));
  const e=1-Math.pow(1-p,3);
  const hover=(t>T_RISE)?Math.sin((t-T_RISE)/420)*S*.4:0;
  const iy=by-bh-e*S*6.4+hover;
  const IS=Math.max(1,Math.round(S*.38*e));
  /* a halo in the rarity colour, as a real radial glow */
  const rg=fg.createRadialGradient(cx,iy-IS*8,0,cx,iy-IS*8,IS*17);
  rg.addColorStop(0,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(.55*e).toFixed(3)+')');
  rg.addColorStop(.45,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(.18*e).toFixed(3)+')');
  rg.addColorStop(1,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+',0)');
  fg.fillStyle=rg; fg.fillRect(cx-IS*18,iy-IS*26,IS*36,IS*36);
  const k=PX*HD, side=IS*16*k;
  blitGear(hg,anim.d,false,(cx-IS*8)*k,(iy-IS*16)*k,side);

  /* sparkles orbiting it */
  if(!anim.sp.length) for(let i=0;i<26;i++)
   anim.sp.push({a:Math.random()*6.28,r:S*(1.2+Math.random()*3.4),
                 v:(Math.random()<.5?-1:1)*(.6+Math.random()*1.5),
                 o:Math.random()*6.28,s:Math.random()<.3?2:1});
  for(const q of anim.sp){
   const ang=q.a+(t-T_BURST)/900*q.v;
   const rr=q.r*(0.6+0.4*Math.sin(ang*2+q.o));
   const px=cx+Math.cos(ang)*rr, py=iy-IS*6+Math.sin(ang)*rr*.55;
   fg.fillStyle='rgba(255,255,255,'+(.25+.55*Math.abs(Math.sin(ang+q.o))).toFixed(2)+')';
   fg.fillRect(px|0,py|0,q.s,q.s);}
 }

 /* --- the text, after the item has arrived --- */
 if(t>T_SETTLE && !anim.done){
  anim.done=true;
  document.getElementById('crar').classList.add('show');
  setTimeout(()=>document.getElementById('citem').classList.add('show'),180);
  setTimeout(()=>document.getElementById('ckind').classList.add('show'),340);
  setTimeout(()=>document.getElementById('cok').classList.add('show'),560);
 }
 requestAnimationFrame(fxFrame);
}
document.getElementById('cok').onclick=()=>{
 chestQ.shift(); anim=null; hg.clearRect(0,0,fxh.width,fxh.height);
 document.getElementById('chest').classList.remove('open');
 if(chestQ.length) setTimeout(startChest,260);
};

/* ---------- hud ---------- */
function hud(){
 const mi=miles();
 document.getElementById('mile').textContent=mi.toFixed(1);
 document.getElementById('biome').textContent=biomeAt(mi).name;
 document.getElementById('today').textContent=S.today.toLocaleString();
 document.getElementById('day').textContent=S.day;
 let prev={m:0}, next=null;
 for(const L of TRAIL){ if(L.m<=mi) prev=L; else {next=L;break;} }
 if(next){
  document.getElementById('nextname').textContent=next.n;
  document.getElementById('nextdist').textContent=(next.m-mi).toFixed(1)+' MI';
  document.getElementById('fill').style.width=
   Math.max(0,Math.min(100,((mi-prev.m)/Math.max(.01,next.m-prev.m))*100)).toFixed(1)+'%';
 }else{
  document.getElementById('nextname').textContent='TRAIL END (PROTOTYPE)';
  document.getElementById('nextdist').textContent='—';
  document.getElementById('fill').style.width='100%';
 }
}
function addSteps(n){
 const before=miles(); S.steps+=n; S.today+=n; const after=miles();
 for(const L of TRAIL)
  if(L.m>before && L.m<=after && S.opened.indexOf(L.m)<0){S.opened.push(L.m);chestQ.push(L);}
 surge=Math.min(.55,surge+n/22000);
 save(); hud();
 if(chestQ.length && !anim) setTimeout(startChest,1100);
}
document.getElementById('b1k').onclick=()=>addSteps(1000);
document.getElementById('b5k').onclick=()=>addSteps(5000);
document.getElementById('bday').onclick=()=>{
 S.day++; S.today=0; save(); addSteps(3000+((Math.random()*6000)|0));};
document.getElementById('brst').onclick=()=>{
 S={steps:0,today:0,day:1,opened:[],own:{},eq:{}}; chestQ=[]; anim=null;
 shownMi=0; drift=0; wizApply(); save(); hud(); drawPack();};

/* ---------- loop ---------- */
let last=performance.now();
let _errs=0;
function frame(now){
 const dt=Math.min(60,now-last); last=now;
 try{ step(dt,now); paint(now,dt); }
 catch(e){ if(_errs++<3) console.error('frame',e); }
 requestAnimationFrame(frame);
}

/* ===================================================================
   THE PACK — what the chests are for

   A chest that hands you a thing you cannot look at again is a slot
   machine. This is the other half: everything you have found, what is
   still missing, and the five slots that decide who walks the trail.
   =================================================================== */
const CATS=[['all','ALL'],['sword','SWORDS'],['staff','STAFFS'],['shield','SHIELDS'],
            ['helm','HELMS'],['chest','ARMOR'],['shoes','BOOTS'],['pet','PETS']];
let pcat='all', psel=null;
const CELL=()=>innerWidth<430?46:64;
const pack=document.getElementById('pack');

function owned(id){return (S.own&&S.own[id])|0;}
function grant(g){
 if(!S.own) S.own={};
 const was=owned(g.id); S.own[g.id]=was+1;
 /* A new piece goes straight on if the slot is empty or if it outranks
    what is already there, so the reward shows up without a trip through
    a menu. It never quietly takes a legendary off you. */
 if(!was){
  if(!S.eq) S.eq={};
  const sl=CAT2SLOT[g[1]], cur=S.eq[sl]?BYID[S.eq[sl]]:null;
  if(!cur||g[2]>cur[2]){S.eq[sl]=g.id; wizApply();}
 }
 save(); return !was;
}
function equip(g){
 if(!owned(g.id)) return;
 if(!S.eq) S.eq={};
 const sl=CAT2SLOT[g[1]];
 S.eq[sl]=(S.eq[sl]===g.id)?null:g.id;
 wizApply(); save(); drawPack();
}

const DPR=()=>Math.min(2,window.devicePixelRatio||1);
/* size is in CSS pixels; the backing store is a whole multiple of it so
   that a sprite shown at or above its own size lands on exact pixels */
function iconCell(g,size){
 const d=DPR(), n=Math.round(size*d);
 const c=document.createElement('canvas');
 c.width=n; c.height=n; c.style.width=size+'px'; c.style.height=size+'px';
 blitGear(c.getContext('2d'),g,false,0,0,n);
 return c;
}
function drawSlots(){
 const L=document.getElementById('pleft'); L.innerHTML='';
 for(const sl of SLOTS){
  const id=S.eq&&S.eq[sl], g=id?BYID[id]:null;
  const d=document.createElement('div');
  d.className='pslot'+(g?' on':'');
  const box=document.createElement('div');
  box.style.cssText='width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center';
  if(g) box.appendChild(iconCell(g,30));
  else box.innerHTML='<span style="color:#32425a;font-size:15px">\u00b7</span>';
  const t=document.createElement('div'); t.className='pslotxt';
  t.innerHTML='<b>'+SLOTNAME[sl]+'</b><span style="color:'+(g?RAR[g[2]][1]:'#45566e')+'">'
             +(g?g[0]:'empty')+'</span>';
  d.appendChild(box); d.appendChild(t);
  d.onclick=()=>{ if(g){psel=g; drawPack();} };
  L.appendChild(d);
 }
 drawDoll();
}
/* the paper doll is the same composite that walks the trail, so what
   you see here is literally what is out there */
function drawDoll(){
 const c=document.getElementById('doll'); if(!c) return;
 const box=c.parentElement.getBoundingClientRect();
 const H=Math.max(96,Math.min(144,Math.round((box.height||150)-26)));
 const d=DPR(), n=Math.round(H*d);
 c.width=n; c.height=n; c.style.width=H+'px'; c.style.height=H+'px';
 const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
 const eq=S.eq||{};
 const off=eq.off&&BYID[eq.off]?BYID[eq.off]:null;
 const hand=eq.hand&&BYID[eq.hand]?BYID[eq.hand]:null;
 const SP=n*0.74, X0=Math.round(n*0.11), Y0=Math.round(n*0.14);
 q.drawImage(heroCanvas(0),X0,Y0,SP,SP);
 if(off)  wield(q,off, SHIELD_A,X0,Y0,SP,0.52);
 if(hand) wield(q,hand,HAND_R,  X0,Y0,SP,0.78);
}
function drawTabs(){
 const T=document.getElementById('ptabs'); T.innerHTML='';
 for(const [k,label] of CATS){
  const b=document.createElement('div');
  b.className='ptab'+(k===pcat?' on':''); b.textContent=label;
  b.onclick=()=>{pcat=k; drawPack();};
  T.appendChild(b);
 }
}
function drawGrid(){
 const G=document.getElementById('pgrid'); G.innerHTML='';
 const list=GEAR.filter(g=>pcat==='all'||g[1]===pcat)
   .sort((a,b)=>CATS.findIndex(c=>c[0]===a[1])-CATS.findIndex(c=>c[0]===b[1])||a[2]-b[2]);
 for(const g of list){
  const n=owned(g.id), has=n>0;
  const d=document.createElement('div');
  d.className='cell'+(has?'':' locked')+((S.eq&&S.eq[CAT2SLOT[g[1]]]===g.id)?' eq':'');
  if(has) d.style.borderColor=RAR[g[2]][1];
  d.appendChild(iconCell(g,CELL()));
  if(n>1){const s=document.createElement('span'); s.className='dup'; s.textContent='x'+n; d.appendChild(s);}
  if(psel&&psel.id===g.id) d.classList.add('sel');
  d.onclick=()=>{psel=g; drawPack();};
  d.ondblclick=()=>{if(has) equip(g);};
  G.appendChild(d);
 }
}
const MATNAME={metal:'forged',wood:'turned wood',leather:'oiled leather',
 cloth:'woven cloth',stone:'cut stone',bone:'bone',arcane:'something else',
 fur:'',feather:'',scale:'',skin:''};
function drawDetail(){
 const D=document.getElementById('pdetail');
 D.innerHTML='';
 if(!psel){D.innerHTML='<div class="dtxt">Every piece is cosmetic. '
  +'Nothing here walks for you.</div>'; return;}
 const g=psel, has=owned(g.id), R=RAR[g[2]], n=owned(g.id);
 const art=document.createElement('div'); art.className='dart';
 if(has){
  const d=DPR(), px=Math.round(128*d);
  const c=document.createElement('canvas');
  c.width=px; c.height=px; c.style.width='128px'; c.style.height='128px';
  c.style.imageRendering='pixelated';
  blitGear(c.getContext('2d'),g,false,0,0,px);
  art.appendChild(c);
 }else art.innerHTML='<span class="dq">?</span>';
 art.style.borderColor=has?R[1]:'#2b3a50';
 const txt=document.createElement('div'); txt.className='dtxt';
 txt.innerHTML='<b style="color:'+R[1]+'">'+(has?g[0]:'? ? ?')+'</b>'
  +'<span class="rr" style="color:'+R[1]+'">'+R[0]+'</span> &nbsp;·&nbsp; '
  +SLOTNAME[CAT2SLOT[g[1]]]
  +(has?'<br><span style="color:#5c6a7c">'+(MATNAME[g[6]]||'')
        +(n>1?(MATNAME[g[6]]?' &nbsp;·&nbsp; ':'')+n+' found':'')+'</span>'
      :'<br><span style="color:#5c6a7c">Not found yet. Keep walking.</span>');
 if(has){
  const sl=CAT2SLOT[g[1]], worn=(S.eq&&S.eq[sl]===g.id);
  const b=document.createElement('button');
  b.className='wearbtn'+(worn?' on':'');
  b.textContent=worn?'\u2713 WORN \u00b7 TAKE OFF':'WEAR IT \u25b6';
  b.onclick=()=>equip(g);
  txt.appendChild(b);
 }
 D.appendChild(art); D.appendChild(txt);
}
function drawPack(){
 const tot=GEAR.length, got=GEAR.filter(g=>owned(g.id)).length;
 document.getElementById('pcount').textContent=got+' / '+tot;
 drawSlots(); drawTabs(); drawGrid(); drawDetail();
}
document.getElementById('packopen').onclick=()=>{pack.classList.add('open'); drawPack();};
document.getElementById('pclose').onclick=()=>pack.classList.remove('open');

prune(); wizApply(); drawPack();
resize(); hud(); addEventListener('resize',resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
